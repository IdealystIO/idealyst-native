# Sub-crates under `examples/fiddle/` that have their own `[workspace]`
# section (template + webapp) so cargo doesn't try to merge them in.
# Listing them in `exclude` documents the intent; without it cargo
# walks the file system at `cargo check`-time and is fine either way.
exclude = [
    # The MCP Arena is its own top-level workspace (arena/Cargo.toml). It's a
    # benchmark harness, not framework plumbing, and must not be pulled into
    # the framework build graph or lockfile.
    "arena",
    "examples/fiddle/template",
    "examples/fiddle/webapp",
    # ESP32-C3 firmware — target = `riscv32imc-esp-espidf`,
    # requires the espup-installed toolchain + esp-idf SDK. Lives
    # outside the host workspace entirely; see its README for the
    # standalone build flow.
    "crates/backend/cpu/examples/esp32-ili9341",
]

[workspace.package]
edition = "2021"
version = "1.5.2"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The app-facing facade. An app depends on this, writes
# `idealyst::entry!(<lib>)` in `src/main.rs`, and builds with plain
# cargo — there is no CLI-generated web wrapper crate any more.
idealyst = { path = "crates/idealyst", version = "1.5", registry = "idealyst" }
runtime-core = { path = "crates/runtime/core", version = "1.5", registry = "idealyst" }
runtime-shared = { path = "crates/runtime/shared", version = "1.5", registry = "idealyst" }
runtime-world = { path = "crates/runtime/world", version = "1.5", registry = "idealyst" }
runtime-scene = { path = "crates/runtime/scene", version = "1.5", registry = "idealyst" }
runtime-vocabulary = { path = "crates/runtime/vocabulary", version = "1.5", registry = "idealyst" }
# Fast non-cryptographic integer hasher (rustc's own FxHash). Used in the
# reactive core's hot-path collections keyed by internal Signal/Effect ids,
# which are never attacker-controlled — SipHash's DoS-resistance is pure
# overhead there.
rustc-hash = "2"
# Common third-party utilities pinned workspace-wide so framework crates can't
# drift onto incompatible versions (a `thiserror = "1"` here and a `"2"` there
# ships two copies in the bundle). Crates opt in with `{ workspace = true }`;
# extra features compose (`{ workspace = true, features = ["rc"] }`).
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
css = { path = "crates/css", version = "1.5", registry = "idealyst" }
premint-dump = { path = "crates/tools/premint-dump" }
# Link-time distributed slices — the premint style-dump registry
# (`runtime_core::premint`, `style-dump` feature). Link-section
# collection instead of first-use registration because the dump must
# see EVERY `stylesheet!` in the binary, including sheets on screens
# the dump run never renders.
linkme = "0.3"
