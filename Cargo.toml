[workspace]
resolver = "2"
members = [
    # The author surface: a paper-thin re-export of
    # `runtime_vocabulary::glue` plus the macro set, published under the
    # name every consumer already spells (`runtime_core::…`). The pre-v2
    # walker that used to live here — Element, the Backend mega-trait,
    # the render walker, Bound/builders — is deleted.
    # The app-facing facade + entry macro: what lets an app crate be
    # built by plain `cargo build` instead of through a generated
    # per-platform wrapper crate.
    "crates/idealyst",
    "crates/idealyst-macros",
    "crates/runtime/core",
    # The permanent shared substrate: the style engine, assets, animation,
    # touch, scheduling, robot, and the shared prop/handle types — every
    # part of the old runtime-core that outlives the walker.
    "crates/runtime/shared",
    "crates/runtime/macros",
    # The reactive kernel: worlds, staged commits, derivation-class flush.
    "crates/runtime/world",
    # The scene core: Element/realize/Host/Registry + the Dyn/Keyed
    # structural drivers, on the runtime-world kernel. Its recorded
    # behavior is pinned by the committed goldens in crates/dev/scene-parity.
    "crates/runtime/scene",
    # Capability-trait split of the deleted Backend mega-trait:
    # per-primitive Ops traits over the scene Host seam, the built-in
    # primitive handlers, and `glue` — the author-surface module
    # `runtime-core` re-exports.
    "crates/runtime/vocabulary",
    "crates/runtime/layout",

    # Shared StyleRules → CSS conversion (used by web + ssr backends).
    "crates/css",

    # Native backends — implement the scene Host + capability traits on
    # top of a platform's UI toolkit.
    "crates/backend/apple/core",
    "crates/backend/macos",
    "crates/backend/ios/core",
    "crates/backend/ios/mobile",
    "crates/backend/ios/rs-shell",
    "crates/backend/ios/tv",
    "crates/backend/android/core",
    "crates/backend/android/mobile",
    "crates/backend/android/tv",
    "crates/backend/roku",
    "crates/backend/roku/macros",
    "crates/backend/roku/transpile",
    "crates/backend/terminal",
    "crates/backend/cpu",
    "crates/backend/web",
    "crates/backend/ssr",
    "crates/backend/email",
    "crates/backend/windows",
    "crates/backend/linux",

    # GPU Backend — composed of Host + Painter + Engine.
    "crates/gpu-backend/api",
    "crates/gpu-backend/engine",
    "crates/gpu-backend/host/winit",
    "crates/gpu-backend/host/web",
    "crates/gpu-backend/host/ios-mobile",
    "crates/gpu-backend/host/android-mobile",
    "crates/gpu-backend/host/macos-desktop",
    "crates/gpu-backend/host/windows-desktop",
    "crates/gpu-backend/host/linux-desktop",
    "crates/gpu-backend/host/wgpu",
    "crates/gpu-backend/host/appkit",
    "crates/gpu-backend/host/terminal",
    "crates/gpu-backend/host/wgpu-accesskit",

    # Native desktop hosts for the OS-widget backends: GTK4 for
    # `backend-linux`, Win32 for `backend-windows`.
    "crates/host/gtk",
    "crates/host/win32",
    "crates/gpu-backend/painter/ios-sim",
    "crates/gpu-backend/painter/android-sim",
    "crates/gpu-backend/variant/phone",
    "crates/gpu-backend/variant/tablet",
    "crates/gpu-backend/variant/tv",

    # Dev mode — wire protocol, hot reload, dev server, app-side replayer.
    "crates/dev/wire",
    "crates/dev/hot",
    "crates/dev/client",
    "crates/dev/server",
    "crates/dev/http",
    "crates/dev/reload",
    "crates/dev/web-host",
    "crates/dev/runtime-server-shell",
    "crates/dev/mock-backend",
    # New-core test substrate: scene Host + all-30-caps recording mock
    # (replaces the per-suite `impl Backend for Mini` + LegacyBridge
    # combos, so new-core tests survive the old Backend trait's deletion).
    "crates/dev/host-mock",
    # Frozen-artifact substrate for the cross-core parity suites (wave 2c).
    "crates/dev/parity-goldens",
    "crates/dev/headless-screenshot",
    "crates/dev/robot-e2e",
    "crates/dev/robot-relay",
    "crates/dev/robot-test",
    "crates/dev/robot-test-macros",
    "crates/dev/native-parity",
    "crates/dev/scene-parity",
    # Smoke app for backend-web's new-core boot path (idea-lite P3b).
    "crates/dev/newcore-web-smoke",
    # Smoke app for the External-SDK wave: the canvas SDK (scene-registry
    # renderer) on the new-core web boot — the wave's live-verification
    # vehicle (an author draw closure + reactive repaint through a world
    # effect, rendered by canvas-native's Canvas2D handler).
    "crates/dev/newcore-canvas-smoke",
    # Smoke app for backend-macos's new-core boot path (idea-lite P4a).
    "crates/dev/newcore-macos-smoke",
    # Smoke app for backend-ios-mobile's new-core boot path (idea-lite,
    # iOS mirror of P4a). Staticlib + checked-in Swift shell; see its
    # host/run-sim.sh for the simulator launch.
    "crates/dev/newcore-ios-smoke",
    # Smoke app for backend-android-mobile's new-core boot path
    # (idea-lite P5). A normal idealyst project hosted by the generated
    # JNI wrapper's `new-core` feature; `--features launcher --bin
    # launch` drives the existing build/run tooling end-to-end.
    "crates/dev/newcore-android-smoke",
    # Smoke app for render-wgpu's new-core boot path (idea-lite P5, GPU).
    # Windowed via host-winit's `new-core` feature; also a headless
    # offscreen-capture mode (NEWCORE_SMOKE_HEADLESS) for real-GPU PNG
    # evidence without a window.
    "crates/dev/newcore-gpu-smoke",
    # End-to-end integration app for the ui!/#[component] lowering and the
    # vocabulary handlers: real button/toggle/virtualizer handlers driven
    # through macro -> builders -> handlers -> drivers -> kernel, plus the
    # recipe compile-and-realize gate.
    "crates/dev/newcore-app",
    # New-core leg of the MCP catalog-emission suite (idea-lite wave 2c):
    # compiles the SAME shared suite body as
    # crates/mcp/catalog/tests/registers_component.rs under the facade
    # alias, so both `__mcp` anchors are covered and the resulting
    # inventory is proven identical. Its own crate because mcp-catalog
    # can neither depend on the facade (cargo cycle) nor gate a dev-dep.
    "crates/dev/newcore-catalog",

    # MCP — project-aware catalog + stdio server (catalog + Robot tools).
    "crates/mcp/catalog",
    "crates/mcp/server",

    # UI — component library + extras.
    "crates/ui/idea-theme",
    "crates/ui/idea-theme-editor",
    "crates/ui/idea-ui",
    "crates/ui/idea-ui-mail",
    "crates/ui/idea-ui-nav",
    "crates/ui/idea-ui-docs-derive",
    "crates/ui/icons-lucide",

    # SDK — third-party extension primitives (Primitive::External).
    # `maps` is an umbrella crate; its per-backend leaves are nested
    # under it (core/ios/web) so the flat sdk/ listing shows the SDK
    # feature, not its platform implementations.
    "crates/sdk/client/maps",
    "crates/sdk/client/maps/core",
    "crates/sdk/client/maps/web",
    "crates/sdk/client/maps/ios",
    "crates/sdk/client/codeblock",
    "crates/sdk/client/markdown",
    "crates/sdk/client/webview",
    "crates/sdk/client/video",
    "crates/sdk/client/svg",
    # `canvas` 2D-drawing SDK: umbrella facade + renderer-agnostic core.
    # Renderer crates (canvas-vello / canvas-native) added in later phases.
    "crates/sdk/client/canvas",
    "crates/sdk/client/canvas/core",
    "crates/sdk/client/canvas/native",
    "crates/sdk/client/canvas/vello",
    # `charts` charting SDK: `charts-core` is standalone by contract
