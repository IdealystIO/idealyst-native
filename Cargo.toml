[workspace]
resolver = "2"
members = [
    # Runtime — platform-agnostic upper half (above the Backend Interface).
    "crates/runtime/core",
    "crates/runtime/macros",
    "crates/runtime/reactive/arena",
    "crates/runtime/reactive/refs",
    "crates/runtime/layout",

    # Shared StyleRules → CSS conversion (used by web + ssr backends).
    "crates/css",

    # Native backends — implement Backend on top of a platform's UI toolkit.
    "crates/backend/apple/core",
    "crates/backend/macos",
    "crates/backend/ios/core",
    "crates/backend/ios/mobile",
    "crates/backend/ios/rs-shell",
    "crates/backend/ios/tv",
    "crates/backend/android/core",
    "crates/backend/android/mobile",
    "crates/backend/android/tv",
    "crates/backend/roku",
    "crates/backend/roku/macros",
    "crates/backend/roku/transpile",
    "crates/backend/terminal",
    "crates/backend/cpu",
    "crates/backend/web",
    "crates/backend/ssr",
    "crates/backend/email",
    "crates/backend/windows",
    "crates/backend/linux",
    "crates/backend/posix-log-capture",

    # GPU Backend — composed of Host + Painter + Engine.
    "crates/gpu-backend/api",
    "crates/gpu-backend/engine",
    "crates/gpu-backend/host/winit",
    "crates/gpu-backend/host/web",
    "crates/gpu-backend/host/ios-mobile",
    "crates/gpu-backend/host/android-mobile",
    "crates/gpu-backend/host/macos-desktop",
    "crates/gpu-backend/host/wgpu",
    "crates/gpu-backend/host/appkit",
    "crates/gpu-backend/host/terminal",
    "crates/gpu-backend/host/wgpu-accesskit",
    "crates/gpu-backend/painter/ios-sim",
    "crates/gpu-backend/painter/android-sim",
    "crates/gpu-backend/variant/phone",
    "crates/gpu-backend/variant/tablet",
    "crates/gpu-backend/variant/tv",

    # Dev mode — wire protocol, hot reload, dev server, app-side replayer.
    "crates/dev/wire",
    "crates/dev/hot",
    "crates/dev/client",
    "crates/dev/server",
    "crates/dev/http",
    "crates/dev/reload",
    "crates/dev/web-host",
    "crates/dev/runtime-server-shell",
    "crates/dev/mock-backend",
    "crates/dev/headless-screenshot",
    "crates/dev/robot-e2e",
    "crates/dev/robot-relay",
    "crates/dev/robot-test",
    "crates/dev/robot-test-macros",
    "crates/dev/native-parity",

    # MCP — project-aware catalog + stdio server (catalog + Robot tools).
    "crates/mcp/catalog",
    "crates/mcp/server",

    # UI — component library + extras.
    "crates/ui/idea-theme",
    "crates/ui/idea-ui",
    "crates/ui/idea-ui-mail",
    "crates/ui/idea-ui-nav",
    "crates/ui/idea-ui-docs-derive",
    "crates/ui/icons-lucide",

    # SDK — third-party extension primitives (Primitive::External).
    # `maps` is an umbrella crate; its per-backend leaves are nested
    # under it (core/ios/web) so the flat sdk/ listing shows the SDK
    # feature, not its platform implementations.
    "crates/sdk/client/maps",
    "crates/sdk/client/maps/core",
    "crates/sdk/client/maps/web",
    "crates/sdk/client/maps/ios",
    "crates/sdk/client/codeblock",
    "crates/sdk/client/markdown",
    "crates/sdk/client/webview",
    "crates/sdk/client/video",
    "crates/sdk/client/svg",
    # `canvas` 2D-drawing SDK: umbrella facade + renderer-agnostic core.
    # Renderer crates (canvas-vello / canvas-native) added in later phases.
    "crates/sdk/client/canvas",
    "crates/sdk/client/canvas/core",
    "crates/sdk/client/canvas/native",
    "crates/sdk/client/canvas/vello",
    "crates/sdk/client/toolbar",
    "crates/sdk/client/pdf",
    "crates/sdk/client/form",
    "crates/sdk/client/table",
    "crates/sdk/client/virtualized",
    "crates/sdk/client/menu",

    # SDK — utility (non-primitive) crates.
    "crates/sdk/client/net",
    "crates/sdk/client/storage",
    "crates/sdk/client/sync",
    "crates/sdk/client/graphql",
    "crates/sdk/client/pan",
    "crates/sdk/client/zoom",
    "crates/sdk/client/gesture",
    "crates/sdk/client/dnd",
    "crates/sdk/client/microphone",
    "crates/sdk/client/camera",
    "crates/sdk/client/media-stream",
    "crates/sdk/client/media-writer",
    "crates/sdk/client/video-compose",
    "crates/sdk/client/denoise",
    "crates/sdk/client/video-decode",
    "crates/sdk/client/file-export",
    "crates/sdk/client/file-picker",
    "crates/sdk/client/auto-update",
    "crates/sdk/client/offload",
    "crates/sdk/client/offload-macro",
    "crates/sdk/client/credentials",
    "crates/sdk/client/biometrics",
    "crates/sdk/client/screen-recorder",
    "crates/sdk/client/files",
    "crates/sdk/client/i18n",
    "crates/sdk/client/i18n/macros",

    # SDK — device / platform-integration capability crates (Tier 1).
    # `permissions` is the shared runtime-grant substrate the others
    # (notifications, location) build on.
    "crates/sdk/client/permissions",
    "crates/sdk/client/notifications",
    "crates/sdk/client/clipboard",
    "crates/sdk/client/location",
    "crates/sdk/client/share",
    "crates/sdk/client/deep-link",
    "crates/sdk/client/connectivity",
    "crates/sdk/client/haptics",
    "crates/sdk/client/audio",

    # API — full-stack server-functions layer. `server` is the primitive
    # (server fns + transport + the DispatchHook seam); `server-kit` is
    # the conventional policy layer (middleware chain, Auth, guards)
    # built on that seam. See crates/api/server/DESIGN.md.
    "crates/api/server",
    "crates/api/server-macros",
    "crates/api/server-kit",
    "crates/api/server-aws",

    # SDK — server-tier capabilities (run in the server / worker binary,
    # not the client). `jobs` = background-job / queue SDK; `pubsub` =
    # cross-instance publish/subscribe (fan-out).
    "crates/sdk/server/jobs",
    "crates/sdk/server/jobs/macros",
    "crates/sdk/server/pubsub",
    "crates/sdk/server/email",
    "crates/sdk/server/cache",
    "crates/sdk/server/config",

    # SDK — navigator-kind extensions (Primitive::NavigatorExt).
    # Grouped under navigators/: the three SDK features (stack/tab/
    # drawer) plus the shared per-platform machinery in helpers/ that
    # all three depend on.
    "crates/sdk/client/navigators/swap",
    "crates/sdk/client/navigators/stack",
    "crates/sdk/client/navigators/helpers/ios",
    "crates/sdk/client/navigators/helpers/android",

    # Tools — CLI + per-platform build/run + source porters.
    "crates/tools/cli",
    # Source linter engine — `idealyst lint` + rust-analyzer overrideCommand.
    "crates/tools/lint",
    # Project configuration engine — powers `idealyst configure` (devcontainer
    # today) and the shared MCP `configure_devcontainer` tool.
    "crates/tools/configure",
    # wasm-split toolchain (vendored from DioxusLabs/dioxus alpha-0.8.0
    # — we own the snapshot, fix bugs as they fire on our codebase).
    # See `crates/tools/wasm-split/README.md`.
    "crates/tools/wasm-split/wasm-split",
    "crates/tools/wasm-split/wasm-split-cli",
    "crates/tools/wasm-split/wasm-split-macro",
    "crates/tools/wasm-split/wasm-used",
    "crates/tools/icon-gen",
    "crates/tools/build/runtime-server",
    "crates/tools/build/android",
    "crates/tools/build/ios",
    "crates/tools/build/roku",
    "crates/tools/build/sim",
    "crates/tools/build/web",
    "crates/tools/build/macos",
    "crates/tools/build/ssr",
    "crates/tools/build/serverless-lambda",
    "crates/tools/build/terminal",
    "crates/tools/dev-tui",
    "crates/tools/docs-app",
    "crates/tools/run/android",
    "crates/tools/run/ios",
    "crates/tools/run/roku",
    "crates/tools/run/macos",
    "crates/tools/run/terminal",
    "crates/tools/port/core",
    "crates/tools/port/tsx",
    "crates/tools/port/react",
    "crates/tools/port/solid",
    "crates/tools/port/vue",
    "crates/tools/port/svelte",
    "crates/tools/port/project",
    "crates/tools/port/preview",
    # Nested per-crate demos — each is a standalone app crate living at
    # <crate>/examples/<demo>/ next to the SDK / backend / tool it demos
    # or tests. Cargo does not treat these as `[[example]]` targets of
    # the parent crate (auto-discovery skips subdirs with a Cargo.toml).
    "crates/api/server/examples/server-fn-demo",
    "crates/api/server-aws/examples/contact-form-lambda",
    "crates/backend/roku/examples/hello-roku",
    "crates/dev/robot-e2e/examples/conformance",
    "crates/dev/robot-e2e/examples/robot-e2e-demo",
    "crates/mcp/examples/mcp-demo",
    "crates/sdk/client/camera/examples/camera-demo",
    "crates/sdk/client/canvas/examples/canvas-demo",
    "crates/sdk/client/denoise/examples/denoise-demo",
    "crates/sdk/client/dnd/examples/dnd-demo",
    "crates/sdk/client/dnd/examples/kanban-demo",
    "crates/sdk/client/dnd/examples/sortable-demo",
    "crates/sdk/client/file-picker/examples/file-drop-demo",
    "crates/sdk/client/file-picker/examples/file-picker-demo",
    "crates/sdk/client/graphql/examples/graphql-demo",
    "crates/sdk/client/i18n/examples/i18n-demo",
    "crates/sdk/client/markdown/examples/markdown-demo",
    "crates/sdk/client/media-stream/examples/media-sources-demo",
    "crates/sdk/client/media-writer/examples/media-recorder-demo",
    "crates/sdk/client/menu/examples/menu-demo",
    "crates/sdk/client/microphone/examples/mic-demo",
    "crates/sdk/client/navigators/stack/examples/stack-demo",
    "crates/sdk/client/navigators/swap/examples/swap-demo",
    "crates/sdk/client/pdf/examples/pdf-demo",
    "crates/sdk/client/screen-recorder/examples/screen-recorder-demo",
    "crates/sdk/client/screen-recorder/examples/screenshare-preview-demo",
    "crates/sdk/client/sync/examples/todo-sync-demo",
    "crates/sdk/client/toolbar/examples/toolbar-demo",
    "crates/sdk/client/video/examples/camera-preview-demo",
    "crates/sdk/client/video-compose/examples/video-compose-demo",
    "crates/sdk/server/email/examples/email-demo",
    "crates/sdk/server/jobs/examples/jobs-demo",
    "crates/sdk/server/pubsub/examples/pubsub-demo",
    "crates/tools/cli/examples/external-export-suite",
    "crates/ui/icons-lucide/examples/icon-gallery",

    # Websites — documentation / marketing sites built with the framework.
    "websites/docs",
    "websites/docs-macro",
    "websites/idea-ui-docs",
    "websites/idea-ui-docs-gpu",
    "websites/tutorial",
    "websites/website",

    # Curated example apps. `welcome` is load-bearing: `idealyst new`
    # embeds its sources verbatim (cli/src/cmd/scaffold_template.rs).
    "examples/welcome",
    "examples/fiddle",
    "examples/inspector",
    "examples/login-demo",
    "examples/nav-showcase",
    "examples/whiteboard-demo",

    # Benchmarks
    "benchmark",
    "benchmark/idealyst-native/wasm",
    "benchmark/idealyst-native-anim/wasm",

    # Framework regression test apps. See tests/README.md.
    "tests/vtable-dispatch",
    "tests/theme-swap",
    "tests/lazy-chunk-handoff",
    "tests/lazy-external-split/heavy",
    "tests/lazy-external-split/eager",
    "tests/lazy-external-split/lazy",
    "tests/prune-regression",
]

# Sub-crates under `examples/fiddle/` that have their own `[workspace]`
# section (template + webapp) so cargo doesn't try to merge them in.
# Listing them in `exclude` documents the intent; without it cargo
# walks the file system at `cargo check`-time and is fine either way.
exclude = [
    # The MCP Arena is its own top-level workspace (arena/Cargo.toml). It's a
    # benchmark harness, not framework plumbing, and must not be pulled into
    # the framework build graph or lockfile.
    "arena",
    "examples/fiddle/template",
    "examples/fiddle/webapp",
    # ESP32-C3 firmware — target = `riscv32imc-esp-espidf`,
    # requires the espup-installed toolchain + esp-idf SDK. Lives
    # outside the host workspace entirely; see its README for the
    # standalone build flow.
    "crates/backend/cpu/examples/esp32-ili9341",
]

[workspace.package]
edition = "2021"
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
runtime-core = { path = "crates/runtime/core" }
# Fast non-cryptographic integer hasher (rustc's own FxHash). Used in the
# reactive core's hot-path collections keyed by internal Signal/Effect ids,
# which are never attacker-controlled — SipHash's DoS-resistance is pure
# overhead there.
rustc-hash = "2"
css = { path = "crates/css" }
