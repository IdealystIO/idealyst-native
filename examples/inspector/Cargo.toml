[package]
name = "inspector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idealyst Inspector — a runtime debugging dashboard. Connects to a running idealyst app's robot bridge (the single TCP newline-JSON transport) and shows, live: every loaded navigator (current + back-stack), the element tree, components and their callable methods, reactive-arena + perf phase counters, watched signal values, and captured logs. MVP host: macOS desktop."

[lib]
crate-type = ["rlib"]

[dependencies]
# The inspector is a CLIENT of the robot bridge, not a robot target — it
# does NOT enable the runtime's `robot` feature. It just renders an
# idealyst UI and speaks the bridge's newline-JSON protocol over std::net.
#
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `runtime-vocabulary` because the `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
icons-lucide = { workspace = true }
stack-navigator = { workspace = true }
idea-ui-nav = { workspace = true }
serde_json = "1"

# No backend deps: this crate is a platform-agnostic app library (the
# CLI-generated macOS wrapper brings `backend-macos` and calls
# `host_appkit::newcore::run_with`), so it compiles on any host target.

[package.metadata.idealyst.app]
name      = "Inspector"
bundle_id = "ai.truday.idealyst.inspector"
version   = "0.0.1"
targets   = ["macos"]
