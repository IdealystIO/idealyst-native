[package]
name = "probe-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Thread-B probe: the lazy chunk builds the canvas node ITSELF via the ambient backend (running canvas-vello's handler in-chunk), with NO main-registry registration. If canvas-vello leaves main.wasm, the External registry call_indirect was the anchor."

[lib]
crate-type = ["rlib"]

[dependencies]
runtime-core = { workspace = true, features = ["async-driver"] }
canvas = { workspace = true }
canvas-vello = { path = "../../crates/sdk/client/canvas/vello", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[package.metadata.idealyst.app]
name      = "ProbeCanvas"
bundle_id = "ai.truday.idealyst.probecanvas"
version   = "0.0.1"
targets   = ["web"]
