[package]
name = "virtual-table-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Table(virtualized): 100,000 rows on the two-axis grid, header and edge columns frozen while the rest scrolls both ways."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
idealyst = { workspace = true }
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }

[package.metadata.idealyst.app]
name      = "Virtual Table Demo"
bundle_id = "ai.truday.idealyst.virtualtabledemo"
version   = "0.0.1"
targets   = ["web", "macos", "ios", "android"]
