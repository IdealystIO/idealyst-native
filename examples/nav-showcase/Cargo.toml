[package]
name = "nav-showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kitchen-sink navigation demo — a Drawer at the root hosting Tabs (with a Stack inside a tab), a Stepper (an obscure swap variant), and a standalone Stack. Exercises swap + stack navigators nested in each other, with idea-ui-nav chrome."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated runtime-server sidecar
# wrapper (build-runtime-server), which calls
# `register_scene_extensions_recorder`.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs so this manifest names no backend directly.
idealyst = { workspace = true }
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `runtime-vocabulary` because the `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths; `runtime-scene`
# because `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
swap-navigator = { workspace = true }
stack-navigator = { workspace = true }
idea-ui = { workspace = true }
idea-ui-nav = { workspace = true }
dev-server = { workspace = true, optional = true }

[package.metadata.idealyst.app]
name      = "Nav Showcase"
bundle_id = "ai.truday.idealyst.navshowcase"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
