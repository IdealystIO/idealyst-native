[package]
name = "nav-showcase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kitchen-sink navigation demo — a Drawer at the root hosting Tabs (with a Stack inside a tab), a Stepper (an obscure swap variant), and a standalone Stack. Exercises swap + stack navigators nested in each other, with idea-ui-nav chrome."

[lib]
crate-type = ["rlib"]

[features]
sidecar = ["dep:dev-server", "swap-navigator/runtime-server", "stack-navigator/runtime-server"]

[dependencies]
runtime-core = { workspace = true }
swap-navigator = { workspace = true }
stack-navigator = { workspace = true }
idea-ui = { workspace = true }
idea-ui-nav = { workspace = true }
dev-server = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android", target_os = "macos")))'.dependencies]
backend-terminal = { workspace = true }

[package.metadata.idealyst.app]
name      = "Nav Showcase"
bundle_id = "ai.truday.idealyst.navshowcase"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
