[package]
name = "fiddle-snippet"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The app the fiddle server builds a learner's code into. A real idealyst app, the same shape `idealyst new` scaffolds; the server copies it to `examples/fiddle/.work/`, writes the submitted files there as `src/app.rs` (+ `src/app/*.rs`), and runs `idealyst build --web` on the copy."
publish = false

# Its own workspace root, so the parent workspace never claims it and the
# copy the server builds keeps its own lockfile.
[workspace]

[lib]
crate-type = ["rlib"]

# Path deps are relative, and the server's working copy sits at the same
# depth (`examples/fiddle/.work/`), so they resolve from both places.
#
# Everything a submitted file may `use`: the author surface, the scene
# types the registration seam names, and idea-ui for the lessons that
# style its components.
[dependencies]
idealyst = { path = "../../../crates/idealyst" }
runtime-core = { path = "../../../crates/runtime/core" }
runtime-vocabulary = { path = "../../../crates/runtime/vocabulary" }
runtime-scene = { path = "../../../crates/runtime/scene" }
idea-ui = { path = "../../../crates/ui/idea-ui" }

[package.metadata.idealyst.app]
name      = "Fiddle"
bundle_id = "io.idealyst.fiddle"
version   = "0.0.1"
targets   = ["web"]
