[package]
name = "fiddle-webapp"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The fiddle's standalone editor: a multi-file project, a Rust-highlighted editor, and a live preview of the server-built bundle. An idealyst app — `idealyst build --web` stages it at `dist/web`, which the fiddle server serves at `/`."
publish = false

# Its own workspace root, so the parent workspace's lockfile and target
# directory stay out of it.
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
idealyst = { path = "../../../crates/idealyst" }
runtime-core = { path = "../../../crates/runtime/core" }
runtime-vocabulary = { path = "../../../crates/runtime/vocabulary" }
runtime-scene = { path = "../../../crates/runtime/scene" }
idea-ui = { path = "../../../crates/ui/idea-ui" }
# The editor (`code_editor` + `codeblock::rust`) and the preview frame.
codeblock = { path = "../../../crates/sdk/client/codeblock" }
webview = { path = "../../../crates/sdk/client/webview" }
# `POST /compile`, and reading its JSON reply.
net = { path = "../../../crates/sdk/client/net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.idealyst.app]
name      = "Idealyst Fiddle"
bundle_id = "io.idealyst.fiddle_editor"
version   = "0.0.1"
targets   = ["web"]
