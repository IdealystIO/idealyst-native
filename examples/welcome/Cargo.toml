[package]
name = "welcome"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animated welcome demo — three-act cinematic intro driven by the framework's animation system (springs + tweens + a raf-driven sun/vignette/planet pulse). Also the source of truth for the `idealyst new` scaffold; the CLI copies this project verbatim."

# The library half stays platform-agnostic: no `#[cfg(target_os =
# "...")]` blocks, no `web.rs`/`ios.rs`/`android.rs`, the same bytes to
# every backend. The platform-specific half is `src/main.rs`, one
# `idealyst::entry!` line whose shell is picked by the target triple.
#
# The iOS/Android wrappers the CLI still generates depend on this crate
# as an `rlib` and supply their own `staticlib`/`cdylib` crate-type.
[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so
# `register_scene_extensions_recorder` is compiled against the recorder
# backend's scene registry.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only. Carries whatever the
# target needs (backend-web + wasm-bindgen glue on wasm, a native shell
# otherwise) so this manifest names no backend directly.
idealyst = { workspace = true }
# The author surface. `runtime-core` is the crate this project aliases
# to `runtime_core` at its root (see src/lib.rs) — one core, no feature
# switch. `runtime-vocabulary` is needed because the `ui!` emission
# spells absolute `::runtime_vocabulary::glue::…` paths, and
# `runtime-scene` because `register_scene_extensions` is generic over
# the scene `Registry` host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

# No backend deps: `register_scene_extensions` is generic over the scene
# `Host` (this scaffold registers no third-party SDKs), so the app crate
# is fully platform-agnostic — the CLI-generated wrappers bring their own
# concrete backend. A project that adds an SDK with a backend-CONCRETE
# scene handler specializes `register_scene_extensions` to that backend's
# registry type and adds the matching backend dep then.

[package.metadata.idealyst.app]
name      = "Welcome"
bundle_id = "ai.truday.idealyst.welcome"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
