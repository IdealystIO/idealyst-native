[package]
name = "welcome"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Animated welcome demo — three-act cinematic intro driven by the framework's animation system (springs + tweens + a raf-driven sun/vignette/planet pulse). Also the source of truth for the `idealyst new` scaffold; the CLI copies this project verbatim."

# Pure `rlib`. The per-platform wrappers the CLI generates
# (`target/idealyst/welcome/{web,ios,android}/wrapper/`) carry the
# platform-specific crate-type (cdylib for web/Android, staticlib for
# iOS) and entry-point boilerplate; this crate depends on nothing
# platform-specific, has no `#[cfg(target_os = "...")]` blocks, no
# `web.rs`/`ios.rs`/`android.rs`, and ships the same bytes to every
# backend.
[lib]
crate-type = ["rlib"]

[features]
# Runtime-v2 defaults flip: this app (and therefore every `idealyst new`
# scaffold, which copies it verbatim) builds on the NEW core by default.
# The CLI's old-core builds (`--old-core`) compile
# `default-features = false, features = ["old-core"]`; run the old-core
# check yourself with:
#
#   cargo check -p welcome --no-default-features --features old-core
default = ["new-core"]

# Old-core marker for the single-core pin (`build_ios::old_core_user_dep`).
# The old-core deps are unconditional, so this is an empty set — it
# exists so `--no-default-features --features old-core` is a uniform
# invocation across every dual-core app.
old-core = []

# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so
# `register_extensions_recorder` is compiled against the recorder backend.
sidecar = ["dep:dev-server"]

# idea-lite core migration: compile this crate's SAME source against the
# new core via the `extern crate runtime_facade as runtime_core;` alias
# in lib.rs (the idea-ui / website pattern). Default-off; one core per
# build graph (runtime-facade enables `runtime-macros/new-core`, which
# unifies). `dep:runtime-vocabulary` because the retargeted `ui!`
# emission spells absolute `::runtime_vocabulary::glue::…` paths.
#
# Consumer: the marketing website's new-core build, which re-mounts this
# app inside its embedded wgpu Simulator through
# `host_wgpu::mount_newcore` (the new-core wgpu-host mount seam).
#
# `dev-server?/new-core` (weak): when the `sidecar` feature is ALSO on
# (the `idealyst dev --new-core` sidecar wrapper), dev-server compiles
# its recorder caps adoption so `register_scene_extensions_recorder`'s
# `dev_server::newcore::SceneRegistry` type exists. Weak `?/` — a plain
# new-core build (no sidecar) still never pulls dev-server.
new-core = [
    "dep:runtime-facade",
    "dep:runtime-vocabulary",
    # `register_scene_extensions` is generic over the scene `Registry`
    # host — the one seam every new-core wrapper (web/macos/ios/
    # terminal) calls.
    "dep:runtime-scene",
    "dev-server?/new-core",
]

[dependencies]
runtime-core = { workspace = true }
# The new-core alias target + glue-path dep (see the `new-core` feature).
runtime-facade = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
runtime-scene = { workspace = true, optional = true }
# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

# No backend deps: `register_extensions` is generic over `Backend` (this
# scaffold registers no third-party SDKs), so the app crate is fully
# platform-agnostic — the CLI-generated wrappers bring their own concrete
# backend. A project that adds a navigator / external SDK specializes
# `register_extensions` to that backend's concrete type and adds the
# matching backend dep then.

[package.metadata.idealyst.app]
name      = "Welcome"
bundle_id = "ai.truday.idealyst.welcome"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
