[package]
name = "idea-ui-docs-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs the idea-ui docs app natively on the GTK4 backend (backend-linux) via host-gtk. Diagnostic harness for the native Linux path — exercises codeblock, table, icons and the builtin swap navigator. Linux-only; run with `cargo run -p idea-ui-docs-gtk`."

[[bin]]
name = "idea-ui-docs-gtk"
path = "src/main.rs"

[dependencies]
idea-ui-docs = { workspace = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
host-gtk = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `robot`: the tests drive the diagnostic surfaces (native introspection,
# screenshot capture), which the backend gates so a release app does not carry
# them. A dev/test build opts in exactly as the CLI-generated wrapper's own
# `dev` feature does.
backend-linux = { workspace = true, features = ["robot"] }
runtime-shared = { workspace = true }
# The capability traits the tests assert against directly
# (`caps::IntrospectionOps` for the screenshot/geometry verbs) — they are
# trait methods, so the trait has to be in scope at the call site.
runtime-vocabulary = { workspace = true }
