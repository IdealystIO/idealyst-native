[package]
name = "baseline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Trivial hello-world app — the framework floor for web bundle-size measurement (the runtime + backend-web, one text node, no idea-ui, no SDKs)."

[lib]
crate-type = ["rlib"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs so this manifest names no backend directly.
idealyst = { workspace = true }
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `runtime-vocabulary` because the `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }

[package.metadata.idealyst.app]
name      = "Baseline"
bundle_id = "ai.truday.idealyst.baseline"
version   = "0.0.1"
targets   = ["web"]
