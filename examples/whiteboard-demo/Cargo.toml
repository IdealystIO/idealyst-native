[package]
name = "whiteboard-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Whiteboard demo — a freehand-drawable canvas (canvas SDK) that records its OWN output zero-copy (canvas self-capture → media-writer), with a live camera composited into the canvas as a texture layer, a floating overlay toolbar, and an in-app recording preview."

[lib]
crate-type = ["rlib"]

[dependencies]
# The author surface: `runtime-core` is aliased to `runtime_core` at the
# crate root (see src/lib.rs); `async-driver` gives it `driver::spawn_async`.
# `runtime-vocabulary` because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` takes the scene registry.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
# The permanent shared substrate, for the three items the facade root does
# not re-export yet: `color::parse_or` / `color::Rgba`, the app-level
# `set_app_key_handler` hook, and `host::color_scheme()`. Drop this dep once
# `runtime_vocabulary::glue` mirrors them.
runtime-shared = { workspace = true }
idea-ui = { workspace = true }
icons-lucide = { workspace = true }
stack-navigator = { workspace = true }
canvas = { workspace = true }
canvas-native = { workspace = true }
camera = { workspace = true }
microphone = { workspace = true }
media-stream = { workspace = true }
video = { workspace = true }
media-writer = { workspace = true }
file-export = { workspace = true }
files = { workspace = true }

# Web needs the CONCRETE backend type: `canvas_native::register` and
# `video::register` take a `Registry<WebBackend>` there (the real Canvas2D /
# `<video>` handlers), so `register_scene_extensions` is web-concrete. Every
# other target uses the registry-GENERIC `register`, which type-dispatches
# internally (video downcasts to the macOS/iOS/Android registry for its native
# player; canvas type-dispatches to its per-platform painter) — so no native
# backend deps.
#
# `canvas-vello` (the GPU/vello renderer) is deliberately NOT a dependency:
# `canvas-native` now carries real painters on every target this demo ships to
# (web Canvas2D, iOS/macOS CoreGraphics, Android `android.graphics`), and both
# crates install a handler for the SAME `canvas_core::CanvasPrim` payload with
# last-registration-wins. Adding vello here would only trade the CPU painter
# for the GPU one and pull wgpu into the bundle; the demo does not need it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# GPU canvas on Linux/GTK4 (vello over wgpu's GL backend, adopting the GtkGLArea's
# lent GL context) — overrides canvas-native (last-wins). If GL adoption fails at
# runtime the renderer returns None and the canvas stays on canvas-native.
canvas-vello = { workspace = true }

[package.metadata.idealyst.app]
name      = "Whiteboard"
bundle_id = "com.critiq.testideaapp"
version   = "0.0.1"
targets   = ["ios", "android", "web", "macos"]
build_number = "2"

[package.metadata.idealyst.app.permissions]
camera = "Whiteboard shows your camera feed in the corner of the board."
microphone = "Whiteboard records audio alongside the board while recording."

[package.metadata.idealyst.app.macos]
category = "public.app-category.productivity"
