[package]
name = "lazy-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Measurement demo: lazy-loads a vello (wgpu) canvas so we can see how much of canvas-vello lands in main.wasm vs the split chunk."

[lib]
crate-type = ["rlib"]

[dependencies]
runtime-core = { workspace = true, features = ["async-driver"] }
canvas = { workspace = true }
# Text-free canvas → drop vello's glyph pipeline + font stack (skrifa/read-fonts).
# Path dep (not workspace) so `default-features = false` actually takes effect —
# Cargo ignores it on an inherited workspace dep unless the workspace sets it too.
canvas-vello = { path = "../../crates/sdk/client/canvas/vello", default-features = false }

# Needed only on web, and only to name the concrete `WebBackend` for the lazy
# `defer_external_registration` call inside the chunk.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[package.metadata.idealyst.app]
name      = "LazyCanvas"
bundle_id = "ai.truday.idealyst.lazycanvas"
version   = "0.0.1"
targets   = ["web"]
