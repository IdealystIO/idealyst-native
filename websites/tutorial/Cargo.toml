[package]
name = "tutorial"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idealyst tutorial — a step-by-step teacher for the framework's core concepts (staged-commit reactivity, stylesheets, media queries), built with idealyst-native itself."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so
# `register_scene_extensions_recorder` can name
# `dev_server::newcore::SceneRegistry` and register the code-panel
# handler on the wire recorder.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs so this manifest names no backend directly.
idealyst = { workspace = true }
# The author surface. `runtime-core` is the alias target for
# `extern crate runtime_core as runtime_core;` (its root re-exports
# `runtime_vocabulary::glue`).
runtime-core = { workspace = true }
# The macro emission spells absolute `::runtime_vocabulary::glue::…`
# paths.
runtime-vocabulary = { workspace = true }
# `register_scene_extensions` is generic over the scene `Registry`'s host.
runtime-scene = { workspace = true }

idea-ui = { workspace = true }
idea-ui-nav = { workspace = true }
swap-navigator = { workspace = true }
# Theme-aware syntax-highlighted code panels: a scene-registry handler,
# so `codeblock::register` is re-exported from lib.rs as the boot
# registration seam every generated wrapper calls. An UNREGISTERED
# payload panics at realize, so the seam is load-bearing rather than a
# nicety.
codeblock = { workspace = true }
# The live examples (`src/fiddle.rs`): `net` posts the code to the fiddle
# server, `webview` frames the bundle it builds, serde reads the reply.
net = { workspace = true }
# The Copy buttons on code panels and terminal steps.
clipboard = { workspace = true }
webview = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

# NO backend dependencies: the registration seam is generic over the
# scene `Registry`'s host, so ONE fn serves every platform and the
# CLI-generated wrappers bring their own concrete backend.

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.idealyst.app]
name      = "Idealyst Tutorial"
bundle_id = "ai.truday.idealyst.tutorial"
version   = "0.0.1"
targets   = ["web", "ios", "android"]

[package.metadata.idealyst.app.splash]
duration_ms = 0
