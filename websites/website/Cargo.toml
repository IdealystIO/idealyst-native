[package]
name = "website"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Marketing site for idealyst-native — built with idealyst-native itself. Sidebar nav on web, native stack nav on mobile."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs so this manifest names no backend directly.
idealyst = { workspace = true }
# The author-surface alias target: `extern crate runtime_core as
# runtime_core;` in lib.rs shadows the extern prelude for the whole
# crate, so every `runtime_core::…` path resolves against
# `runtime_vocabulary::glue`. `runtime-vocabulary` is a direct dep
# because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths, and because `async-driver` is
# required by the embedded `Simulator` component (the home-page preview
# that runs `welcome::app()` through the wgpu render backend — it uses
# `runtime_core::driver::spawn_async` to wait on the wgpu mount without
# blocking the build).
runtime-core = { workspace = true }
# v2: the native register seam takes a `runtime_scene::Registry`.
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true, features = ["async-driver"] }
# `default-features = false`: idea-ui's `table` default stays out of this
# graph — the website renders no idea-ui Table, so the SDK would be pure
# dep weight here. (PATH dep, not `workspace = true`: cargo ignores
# `default-features = false` on workspace-inherited lines.)
idea-ui = { path = "../../crates/ui/idea-ui", default-features = false }
swap-navigator = { workspace = true }
idea-ui-nav = { workspace = true }
# `codeblock::register` is the website's ONE third-party scene primitive:
# the boot/SSR registration seam that makes code panels render the SDK's
# real `<pre>`/span DOM (see `register_scene_extensions` in lib.rs).
codeblock = { workspace = true }
# Embedded `welcome` app — the canonical scaffold from `idealyst new`.
# Re-mounted inside the home-page Simulator so visitors can preview
# the scene without installing the CLI. Pure rlib, no platform-specific
# code, compiles the same bytes everywhere. Mounted through
# `host_wgpu::mount_newcore` (`render_wgpu::newcore::start_in_world`
# into the page's own world).
welcome = { workspace = true }

# Embedded-Simulator preview stack. These crates self-gate their
# wasm-only innards (see e.g. `host-web/src/lib.rs`'s `cfg(target_arch
# = "wasm32")` blocks), so they compile to empty surfaces on
# native targets and the `Simulator` component's compile-time
# imports stay portable. Matches the docs example's Cargo wiring.
host-web = { workspace = true }
# Target-agnostic wgpu host umbrella. Internally cfg-routes to
# `host-web` on wasm, `host-ios-mobile` on iOS, etc. The Simulator
# component calls `host_wgpu::mount_newcore(...)` cross-target without
# any per-platform `cfg` in author code — see §7 of CLAUDE.md +
# `[[feedback_cfg_hack_signals_missing_backend_method]]`.
host-wgpu = { workspace = true }
render-api = { workspace = true }
# The two simulator skins are pure `Painter` impls with no macro
# emissions — nothing to retarget.
ios-sim = { workspace = true }
android-sim = { workspace = true }

# SSR build target. Optional dep so wasm/native builds don't pull the
# tiny_http machinery into their dep graph; the `ssr` feature flips it
# on and `register_ssr_scene_handlers` (gated by the same feature in
# `lib.rs`) becomes visible to the CLI-generated SSR wrapper binary
# and to the examples (see `[[example]]` below — examples do NOT
# compile with optional features active, so they declare
# `required-features` and are skipped when `ssr` is off).
backend-ssr = { workspace = true, features = ["serve"], optional = true }

# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

[features]
# Default to perf instrumentation ON during this investigation. The
# `debug-stats` feature is feature-gated end-to-end (runtime-shared,
# the iOS backends, here) so it's a single toggle: this `default`
# entry threads it through every backend that ships PhaseTimer
# instrumentation. Drop this entry once the perf chase is over.
default = ["debug-stats"]
# Opt into the project-wide `debug-stats` instrumentation. Routes
# through every dep that has its own `debug-stats` feature, so the
# whole transitive build records into the same
# `runtime_shared::debug::record_apply_phase` aggregator (reached from
# author/macro code as `runtime_core::debug::…` through the facade).
debug-stats = [
    "runtime-vocabulary/debug-stats",
]
# Standalone web boot (`web_entry` in lib.rs + standalone.html): the
# plain-wasm-pack vehicle that carries its OWN
# `#[wasm_bindgen(start)]`. NON-default and NOT enabled by the CLI web
# wrapper (`idealyst build --web`), whose generated wrapper has its own
# start fn — two starts in one module is a wasm-bindgen error. Enable
# only for the manual wasm-pack flow:
#   wasm-pack build --target web --dev websites/website \
#       --out-dir pkg-standalone -- --features standalone-web
standalone-web = []
# Turn on the SSR build path. Activates the optional `backend-ssr` dep
# + the matching `register_ssr_scene_handlers` alias in `lib.rs`. The
# CLI's `idealyst dev --ssr` / `--static` SSR wrapper sets this
# (`features = ["ssr"]` on its path-dep on the user crate).
ssr = ["dep:backend-ssr"]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so
# `register_scene_extensions_recorder` can register the codeblock scene
# handler on the runtime-server recorder registry (navigators are
# vocabulary built-ins — no recording handler to wire).
sidecar = ["dep:dev-server"]
# Turn on the terminal build path. Like `ssr` above, this forces a
# host-triple backend that `cfg(target_os)` can't select: the terminal
# target builds for the host triple, so on a macOS host it collides with
# `backend-macos`. The CLI's terminal wrapper enables this feature to break
# the tie.
terminal = ["dep:backend-terminal"]

# Web target — wasm + DOM. The marketing site's primary surface.
#
# `web-sys` is pulled in directly (alongside the framework's own
# web bindings) so `app()` can reach the document's `<body>` element
# and keep its background in sync with the active theme. The
# framework owns `#app` and below; everything outside that subtree
# is the host page's responsibility.

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `async-driver` brings in `install_async_executor` + `install_render_loop`
# which the embedded `Simulator` component depends on \u{2014} `host_web::mount`
# uses `spawn_async` to drive the wgpu init off the main thread and
# the render loop to tick frames. Without this feature the simulator
# canvas mounts but never paints (the `on_ready` async task is
# queued onto an executor that was never installed).
backend-web = { workspace = true, features = ["async-driver"] }
# NOTE: `lazy! { ... }` / `#[component(lazy)]` needs no direct
# `wasm-split` dependency — the macro aliases the framework's
# re-export into scope itself.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration",
    # Needed by `responsive.rs`: imperative backdrop / hamburger
    # buttons + the reactive class-mirror effect.
    "DomTokenList", "EventTarget", "Event", "HtmlButtonElement", "Node",
] }

# iOS / Android targets — proving the cross-platform claim by having
# the site itself ship to mobile. The chrome (sidebar) is web-only,
# native targets render screens raw inside a UINavigationController /
# FragmentManager.
[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
# `async-driver` is the iOS sibling of the same feature on
# `backend-web` above: it pulls in `install_async_executor`
# (libdispatch-backed) + `install_render_loop` (NSTimer-backed) so
# the embedded `Simulator` component's `spawn_async` future resolves
# and the wgpu host's per-frame closure fires. Without it
# `host_wgpu::mount` queues onto an executor that was never
# installed, so the welcome app never paints.
backend-ios-mobile = { workspace = true, features = ["async-driver", "debug-stats"] }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }

# macOS desktop — AppKit backend. The CLI-generated macOS wrapper mounts
# through `host_appkit::newcore::run_with` and passes
# `register_scene_extensions`, so this dep only supplies the backend
# type named by `register_extensions`.
[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

# Native Linux (GTK4) backend — same shape as the macOS dep. The Linux
# target builds for the host triple; the `terminal` feature (which also
# builds for the host triple) excludes this crate's Linux
# `register_extensions` arm so the two don't collide on a Linux host.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }

# Native Windows (Win32) backend — same shape as the Linux dep, same
# `terminal`-feature exclusion rationale on a Windows host.
[target.'cfg(all(target_os = "windows", not(target_arch = "wasm32")))'.dependencies]
backend-windows = { workspace = true }

# Terminal backend — pulled in ONLY by the `terminal` feature (the CLI's
# terminal wrapper enables it). It can't be a `target_os` dependency like
# the others: the terminal target builds for the host triple, so on a
# macOS host it shares macOS's triple and would collide with
# `backend-macos`. The feature is the disambiguator. See `[features]`.
[dependencies.backend-terminal]
workspace = true
optional = true

# The SSR demo examples need the optional `backend-ssr` dep (`ssr`
# feature). With `required-features`, a plain `cargo test -p website`
# SKIPS them instead of failing on the unresolved optional dep — they
# broke silently for months because an older comment wrongly claimed
# examples compile "with all regular features active". Build them with:
#   cargo run -p website --features ssr --example serve
#   cargo run -p website --features ssr --example ssr
[[example]]
name = "serve"
required-features = ["ssr"]

[[example]]
name = "ssr"
required-features = ["ssr"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.idealyst.app]
name      = "Idealyst"
bundle_id = "io.idealyst"
version   = "0.0.1"
targets   = ["web", "ios", "android"]

[package.metadata.idealyst.app.splash]
duration_ms = 0

# Build-time icon pipeline (icon-gen). One base block per the
# common identity, plus a per-platform `[icon.web]` override for the
# favicon — which uses the already-colored outlined glyph so the
# tab-strip thumbnail is legible without a backdrop.
#
# The base `foreground` + `background` pair drives iOS / Android
# home-screen icons: the plain stroked `light.svg` glyph painted
# over a yellow-to-white linear gradient (CSS-style angle, 180° =
# top-to-bottom).
[package.metadata.idealyst.app.icon]
foreground = "assets/light.svg"
background = { kind = "linear", angle = 180, stops = [
    { offset = 0.0, color = "#EFDD74" },
    { offset = 1.0, color = "#ffffff" },
] }

[package.metadata.idealyst.app.icon.web]
source = "assets/light-outlined.svg"

# Preload the Inter weights the marketing site renders above the fold.
# The build (`stage_bundle`) injects `<link rel="preload" as="font" crossorigin>`
# tags into the staged `index.html`, and the dev server (`dev-http`) does
# the same at request time — same set in both, so the dev loop and the
# deployed bundle hit the network the same way.
#
# Explicit list rather than "every font in the project" because the
# tradeoff is real: each preload starts a parallel fetch competing with
# the wasm download. Listing the weights actually used on the landing
# screen keeps wasm fetch unbloated; rarer weights (Thin/ExtraLight/Black)
# resolve later through the runtime `@font-face` swap-in, which is fine.
[package.metadata.idealyst.app.web]
preload_fonts = [
    "fonts/Inter-Regular.ttf",
    "fonts/Inter-Medium.ttf",
    "fonts/Inter-SemiBold.ttf",
    "fonts/Inter-Bold.ttf",
]
