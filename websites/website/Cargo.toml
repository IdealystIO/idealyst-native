[package]
name = "website"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Marketing site for idealyst-native — built with idealyst-native itself. Sidebar nav on web, native stack nav on mobile."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `async-driver` is required by the embedded `Simulator` component
# (home-page preview that runs `welcome::app()` through the wgpu
# render backend). The Simulator uses `runtime_core::driver::spawn_async`
# to wait on `host_web::mount` without blocking the build walker.
runtime-core = { workspace = true, features = ["async-driver"] }
# The new-core alias target + the retargeted `ui!` emission's absolute
# `::runtime_vocabulary::glue::…` paths (see the `new-core` feature and
# the alias in lib.rs — the nav-showcase / idea-ui-docs pattern).
runtime-facade = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
# `default-features = false` + the explicit prim list (the contract
# idea-ui documents on its own runtime-core dep): idea-ui's `table`
# default is old-core-authored and must stay out of new-core graphs.
# The website renders no idea-ui Table, so the old-core build is
# behavior-identical without it (the nav-showcase precedent).
idea-ui = { path = "../../crates/ui/idea-ui", default-features = false, features = [
    "prim-icon", "prim-image", "prim-text-input", "prim-activity",
    "prim-portal", "prim-presence",
] }
swap-navigator = { workspace = true }
idea-ui-nav = { workspace = true }
# `codeblock` is DUAL-CORE: the old core dispatches its
# `Element::External` payload through the per-backend registry; the
# `codeblock/new-core` leg registers the identical `<pre>`/span handler
# on the scene registry (`codeblock::register` is the boot registration
# seam — see the new-core web entry in lib.rs + tests/ssg_parity.rs).
codeblock = { workspace = true, optional = true }
# Embedded `welcome` app — the canonical scaffold from `idealyst new`.
# Re-mounted inside the home-page Simulator so visitors can preview
# the scene without installing the CLI. Pure rlib, no platform-specific
# code, compiles the same bytes everywhere.
#
# Dual-core: both features enable the dep; `new-core` additionally
# flips `welcome/new-core` so its `ui!` emissions retarget with the
# rest of the graph (proc-macro feature unification) and its dep set
# can resolve the glue paths. The wgpu hosts below mount it through
# `host_wgpu::mount` (old walker) or `host_wgpu::mount_newcore`
# (`render_wgpu::newcore::start_in_world` into the page's world).
welcome = { workspace = true, optional = true }

# Embedded-Simulator preview stack. These crates self-gate their
# wasm-only innards (see e.g. `host-web/src/lib.rs`'s `cfg(target_arch
# = "wasm32")` blocks), so they compile to empty surfaces on
# native targets and the `Simulator` component's compile-time
# imports stay portable. Matches the docs example's Cargo wiring.
host-web = { workspace = true, optional = true }
# Target-agnostic wgpu host umbrella. Internally cfg-routes to
# `host-web` on wasm, `host-ios-mobile` on iOS, etc. The Simulator
# component calls `host_wgpu::mount(...)` cross-target without any
# per-platform `cfg` in author code — see §7 of CLAUDE.md +
# `[[feedback_cfg_hack_signals_missing_backend_method]]`.
host-wgpu = { workspace = true, optional = true }
render-api = { workspace = true, optional = true }
ios-sim = { workspace = true, optional = true }
android-sim = { workspace = true, optional = true }

# SSR build target. Optional dep so wasm/native builds don't pull the
# tiny_http machinery into their dep graph; the `ssr` feature flips it
# on and `register_ssr_extensions` (gated by the same feature in
# `lib.rs`) becomes visible to the CLI-generated SSR wrapper binary
# and to the examples (see `[[example]]` below — examples do NOT
# compile with optional features active, so they declare
# `required-features` and are skipped when `ssr` is off).
backend-ssr = { workspace = true, features = ["serve"], optional = true }

# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

[features]
# Default to perf instrumentation ON during this investigation. The
# `debug-stats` feature is feature-gated end-to-end (runtime-core,
# the iOS backends, here) so it's a single toggle: this `default`
# entry threads it through every backend that ships PhaseTimer
# instrumentation. Drop this entry once the perf chase is over.
default = ["debug-stats", "new-core"]
# The two cores — SAME-SOURCE dual-core app (the idea-ui-docs /
# conformance pattern): exactly one per build. `old-core` is the
# default (CLI dev/build flows unchanged); `new-core` is the idea-lite
# migration build, booted on web via `backend_web::newcore::start_in`
# (see the `web_entry_newcore` module in lib.rs + newcore.html):
#
#   cargo check -p website                                       # new core (the default
#                                                                #   since the runtime-v2 flip)
#   cargo check -p website --no-default-features \
#       --features old-core,debug-stats                          # old core
#   idealyst build --web websites/website                        # new-core web (CLI wrapper,
#                                                                #   wasm-split chunking;
#                                                                #   --old-core opts out)
#   wasm-pack build --target web --dev websites/website \
#       --out-dir pkg-newcore -- --no-default-features \
#       --features new-core,newcore-standalone-web               # new-core web (standalone)
#
# The embedded-Simulator preview stack (welcome + the wgpu hosts +
# sim painters) and `codeblock` are DUAL-CORE: both features enable
# the deps, and `new-core` additionally flips each crate's own
# `new-core` leg. The hero's live preview mounts through
# `host_wgpu::mount` (old walker) or `host_wgpu::mount_newcore`
# (`render_wgpu::newcore::start_in_world` into the page's own world —
# the new-core wgpu-host mount seam), so BOTH builds render the real
# embedded simulator.
old-core = [
    "dep:welcome",
    "dep:host-web",
    "dep:host-wgpu",
    "dep:render-api",
    "dep:ios-sim",
    "dep:android-sim",
    "dep:codeblock",
]
# `new-core` flips the whole idea-* + navigator subtree onto the glue
# facade (`extern crate runtime_facade as runtime_core;` in lib.rs) and
# pulls the vocabulary surface. `backend-web/new-core` is forwarded to
# the wasm-target dep (feature forwarding to target-specific deps
# works — the idea-ui-docs precedent).
new-core = [
    "dep:runtime-facade",
    "dep:runtime-vocabulary",
    # `runtime_core::driver::spawn_async` through the facade — glue
    # mirrors the old root's feature-gated `driver` module behind the
    # vocabulary's forwarding feature (the Simulator's mount rides it).
    "runtime-vocabulary/async-driver",
    "dep:codeblock",
    "codeblock/new-core",
    "swap-navigator/new-core",
    "idea-ui/new-core",
    "idea-ui-nav/new-core",
    "backend-web/new-core",
    # The embedded-Simulator preview stack, new-core legs (see the
    # cluster comment above `old-core`). The sim painters (ios-sim /
    # android-sim) are pure `Painter` impls with no macro emissions —
    # no leg to flip.
    "dep:welcome",
    "welcome/new-core",
    "dep:host-web",
    "host-web/new-core",
    "dep:host-wgpu",
    "host-wgpu/new-core",
    "dep:render-api",
    "dep:ios-sim",
    "dep:android-sim",
    # Weak forward: when the `ssr` feature also activates backend-ssr,
    # flip its new-core leg on so `--features new-core,ssr` alone builds
    # the newcore SSG/serve entries (tests/ssg_parity.rs + the CLI's
    # `--new-core` wrapper). No-op when `ssr` is off.
    "backend-ssr?/new-core",
]
# Standalone new-core web boot (`web_entry_newcore` in lib.rs +
# newcore.html): the interim plain-wasm-pack vehicle that carries its
# OWN `#[wasm_bindgen(start)]`. NON-default and NOT enabled by the CLI
# web wrapper (`idealyst build --web --new-core`), whose generated
# wrapper has its own start fn — two starts in one module is a
# wasm-bindgen error. Enable only for the manual wasm-pack flow:
#   wasm-pack build ... --features new-core,newcore-standalone-web
newcore-standalone-web = []
# Opt into the project-wide `debug-stats` instrumentation. Routes
# through every dep that has its own `debug-stats` feature, so the
# whole transitive build records into the same
# `runtime_core::debug::record_apply_phase` aggregator.
debug-stats = [
    "runtime-core/debug-stats",
]
# Turn on the SSR build path. Activates the optional `backend-ssr`
# dep + the matching `register_ssr_extensions` impl in `lib.rs`. The
# CLI's `idealyst dev --ssr` / `--static` SSR wrapper sets this
# (`features = ["ssr"]` on its path-dep on the user crate).
ssr = ["dep:backend-ssr"]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` + the drawer SDK's recording
# handler so `register_extensions_recorder` can register a navigator
# recording handler on the runtime-server recorder backend.
sidecar = ["dep:dev-server", "swap-navigator/runtime-server"]
# Turn on the terminal build path. Like `ssr` above, this forces a
# host-triple backend that `cfg(target_os)` can't select: the terminal
# target builds for the host triple, so on a macOS host it collides with
# `backend-macos`. The CLI's terminal wrapper enables this feature to break
# the tie. (See the tutorial's Cargo.toml for the full rationale.)
terminal = ["dep:backend-terminal"]

# Web target — wasm + DOM. The marketing site's primary surface.
#
# `web-sys` is pulled in directly (alongside the framework's own
# web bindings) so `app()` can reach the document's `<body>` element
# and keep its background in sync with the active theme. The
# framework owns `#app` and below; everything outside that subtree
# is the host page's responsibility.

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `async-driver` brings in `install_async_executor` + `install_render_loop`
# which the embedded `Simulator` component depends on \u{2014} `host_web::mount`
# uses `spawn_async` to drive the wgpu init off the main thread and
# the render loop to tick frames. Without this feature the simulator
# canvas mounts but never paints (the `on_ready` async task is
# queued onto an executor that was never installed).
backend-web = { workspace = true, features = ["async-driver"] }
# NOTE: `lazy! { ... }` no longer requires a direct `wasm-split`
# dependency — the macro aliases runtime-core's re-export into scope
# itself. Author crates only need `runtime-core`.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "CssStyleDeclaration",
    # Needed by `responsive.rs`: imperative backdrop / hamburger
    # buttons + the reactive class-mirror effect.
    "DomTokenList", "EventTarget", "Event", "HtmlButtonElement", "Node",
] }

# iOS / Android targets — proving the cross-platform claim by having
# the site itself ship to mobile. The chrome (sidebar) is web-only,
# native targets render screens raw inside a UINavigationController /
# FragmentManager.
[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
# `async-driver` is the iOS sibling of the same feature on
# `backend-web` (line 72 above): it pulls in `install_async_executor`
# (libdispatch-backed) + `install_render_loop` (NSTimer-backed) so
# the embedded `Simulator` component's `spawn_async` future resolves
# and the wgpu host's per-frame closure fires. Without it
# `host_wgpu::mount` queues onto an executor that was never
# installed, so the welcome app never paints.
backend-ios-mobile = { workspace = true, features = ["async-driver", "debug-stats"] }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }

# macOS desktop — AppKit backend. `drawer_navigator::register` resolves
# to its macOS impl (`&mut MacosBackend`) on this host, so the example's
# `register_extensions` must take the same type.
[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

# Terminal backend — pulled in ONLY by the `terminal` feature (the CLI's
# terminal wrapper enables it). It can't be a `target_os` dependency like
# the others: the terminal target builds for the host triple, so on a
# macOS host it shares macOS's triple and would collide with
# `backend-macos`. The feature is the disambiguator. See `[features]`.
[dependencies.backend-terminal]
workspace = true
optional = true

# The SSR demo examples need the optional `backend-ssr` dep (`ssr`
# feature) and register through the old-core SSR path
# (`register_ssr_extensions` → `swap_navigator::register_generic`), so
# they also require `old-core`. With `required-features`, a plain
# `cargo test -p website` (either core) SKIPS them instead of failing
# on the unresolved optional dep — they broke silently for months
# because the old comment wrongly claimed examples compile "with all
# regular features active". Build them with:
#   cargo run -p website --features ssr --example serve
#   cargo run -p website --features ssr --example ssr
[[example]]
name = "serve"
required-features = ["ssr", "old-core"]

[[example]]
name = "ssr"
required-features = ["ssr", "old-core"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.idealyst.app]
name      = "Idealyst"
bundle_id = "io.idealyst"
version   = "0.0.1"
targets   = ["web", "ios", "android"]

[package.metadata.idealyst.app.splash]
duration_ms = 0

# Build-time icon pipeline (icon-gen). One base block per the
# common identity, plus a per-platform `[icon.web]` override for the
# favicon — which uses the already-colored outlined glyph so the
# tab-strip thumbnail is legible without a backdrop.
#
# The base `foreground` + `background` pair drives iOS / Android
# home-screen icons: the plain stroked `light.svg` glyph painted
# over a yellow-to-white linear gradient (CSS-style angle, 180° =
# top-to-bottom).
[package.metadata.idealyst.app.icon]
foreground = "assets/light.svg"
background = { kind = "linear", angle = 180, stops = [
    { offset = 0.0, color = "#EFDD74" },
    { offset = 1.0, color = "#ffffff" },
] }

[package.metadata.idealyst.app.icon.web]
source = "assets/light-outlined.svg"

# Preload the Inter weights the marketing site renders above the fold.
# The build (`stage_bundle`) injects `<link rel="preload" as="font" crossorigin>`
# tags into the staged `index.html`, and the dev server (`dev-http`) does
# the same at request time — same set in both, so the dev loop and the
# deployed bundle hit the network the same way.
#
# Explicit list rather than "every font in the project" because the
# tradeoff is real: each preload starts a parallel fetch competing with
# the wasm download. Listing the weights actually used on the landing
# screen keeps wasm fetch unbloated; rarer weights (Thin/ExtraLight/Black)
# resolve later through the runtime `@font-face` swap-in, which is fine.
[package.metadata.idealyst.app.web]
preload_fonts = [
    "fonts/Inter-Regular.ttf",
    "fonts/Inter-Medium.ttf",
    "fonts/Inter-SemiBold.ttf",
    "fonts/Inter-Bold.ttf",
]
