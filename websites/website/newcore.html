<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <base href="/" />
    <title>Idealyst — One Rust codebase, every platform (new core)</title>
    <style>
      /* Same mount conventions as index.html (the CLI web shell). */
      html, body, #app { height: 100%; margin: 0; }
      body {
        background: #f7f8fb;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      // Built by:
      //   rm -rf websites/website/pkg-newcore
      //   wasm-pack build --target web --dev websites/website \
      //       --out-dir pkg-newcore -- --no-default-features --features new-core
      // (NOT with default features — `old-core`/`new-core` are mutually
      // exclusive; see the compile_error guard in src/lib.rs. wasm-pack
      // 0.12 fails re-reading its own generated package.json on
      // REbuilds — rm -rf pkg-newcore first.)
      // Serve from the app dir (e.g. `python3 -m http.server`) and open
      // /newcore.html.
      import init from "./pkg-newcore/website.js";
      init();
    </script>
  </body>
</html>
