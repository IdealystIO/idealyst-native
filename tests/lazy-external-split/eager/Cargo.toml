[package]
name = "lazy-external-split-eager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Eager-registration variant of the registration-split measurement: registers the heavy External handler at boot (register_extensions), anchoring its 512 KiB payload in main.wasm. Paired with lazy-external-split-lazy; the prune-regression runner diffs the two main.wasm sizes."

[lib]
crate-type = ["rlib"]

[dependencies]
runtime-core = { workspace = true }
idea-ui = { workspace = true }
lazy-external-split-heavy = { path = "../heavy" }

[package.metadata.idealyst.app]
name      = "Lazy External Split (eager)"
bundle_id = "ai.truday.idealyst.lazy_external_split_eager"
version   = "0.0.1"
targets   = ["web"]

[package.metadata.idealyst.app.splash]
duration_ms = 0
