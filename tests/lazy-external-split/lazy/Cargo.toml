[package]
name = "lazy-external-split-lazy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lazy-registration variant of the registration-split measurement: registers the heavy External handler from inside the lazy! chunk body via runtime_core::defer_external_registration, keeping its 512 KiB payload out of main.wasm. Paired with lazy-external-split-eager."

[lib]
crate-type = ["rlib"]

[dependencies]
runtime-core = { workspace = true }
idea-ui = { workspace = true }
lazy-external-split-heavy = { path = "../heavy" }

[package.metadata.idealyst.app]
name      = "Lazy External Split (lazy)"
bundle_id = "ai.truday.idealyst.lazy_external_split_lazy"
version   = "0.0.1"
targets   = ["web"]

[package.metadata.idealyst.app.splash]
duration_ms = 0
