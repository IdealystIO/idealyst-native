[package]
name = "lazy-external-split-heavy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deliberately-heavy fake External SDK for the registration-split measurement. Carries 512 KiB of static data reachable only through its Element::External handler; whether that data lands in main.wasm or the lazy chunk depends solely on where the handler is registered (eager vs runtime_core::defer_external_registration)."

[lib]
crate-type = ["rlib"]

[dependencies]
runtime-core = { workspace = true }

# `register_lazy` names the concrete web backend to key the deferral queue.
# Web-only; the handler itself (`build_heavy`) is backend-neutral.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
