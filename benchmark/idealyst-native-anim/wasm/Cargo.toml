[package]
name = "benchmark-idealyst-native-anim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The author surface: `extern crate runtime_core as runtime_core;` in
# lib.rs shadows the extern prelude, so `runtime_core::{ui, node_ref,
# animation::…, …}` resolves against `runtime_vocabulary::glue`.
runtime-core = { workspace = true }
# The `ui!` emission spells absolute `::runtime_vocabulary::glue::…`
# paths, so the vocabulary must be nameable from the extern prelude.
runtime-vocabulary = { workspace = true }
idea-ui = { workspace = true }
backend-web = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Performance"]

# Same wasm-opt config as the other benchmark variant so per-instruction
# perf is comparable.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
