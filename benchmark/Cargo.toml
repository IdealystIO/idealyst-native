[package]
name = "benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The author surface: `extern crate runtime_core as runtime_core;` in
# lib.rs shadows the extern prelude, so `runtime_core::{ui, stylesheet,
# signal, …}` resolves against `runtime_vocabulary::glue`.
runtime-core = { workspace = true }
# The `ui!` / `stylesheet!` emissions spell absolute
# `::runtime_vocabulary::glue::…` paths.
runtime-vocabulary = { workspace = true }
# `Registry`, for the `start_in` registration seam the webview SDK
# handler is installed through.
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
backend-web = { workspace = true }
webview = { workspace = true }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# Same allocator caveat applies as in the idealyst-native variant —
# the bench's churn pattern is on the inner iframe, not the runner,
# so the runner can use the default allocator without trouble.

[dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Performance"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--strip-debug", "--strip-producers", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
