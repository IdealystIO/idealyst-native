[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stdio MCP server that surfaces the framework's component catalog. Provides list_components / describe_component / find_uses / find_dependencies tools, plus the `idealyst://catalog` resource. Consumes the `mcp-catalog` ResolvedCatalog built from the linked-in inventory."

[dependencies]
# `mcp-catalog` provides the catalog data; consumers of this crate
# also need to enable `runtime-core/catalog` so their `#[component]`
# expansions actually populate the inventory slice.
mcp-catalog = { workspace = true }

# The idealyst source linter — powers the `lint_project` tool, which
# runs the same idiom-drift rules as the `idealyst lint` CLI over a
# project's un-expanded Rust source.
lint = { workspace = true }

# Project configuration engine — backs the `configure_devcontainer` tool with
# the exact same plan→apply core as the `idealyst configure devcontainer` CLI.
configure = { workspace = true }

# rmcp 1.x — the official Rust MCP SDK. Features:
# - `server` enables the ServerHandler + ServiceExt machinery
# - `macros` enables `#[tool_router]` / `#[tool]` / `#[tool_handler]`
# - `transport-io` enables `transport::stdio()`
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }

# rmcp's async runtime — only `rt-multi-thread` + `macros` are
# strictly required for stdio, but `full` is fine for a dev tool.
tokio = { version = "1", features = ["full"] }

anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# Decode `screenshot` PNG base64 so the tool can save it to disk and
# return only the path — never streaming the base64 into the model.
base64 = "0.22"
# Shared render-parity model + diff (also used by the robot-test harness), for
# the `compare_native_parity` tool.
native-parity = { workspace = true }

# File-watch (phase 5). Reuses `notify-debouncer-mini` — same crate
# the existing `dev-reload` uses, so we don't introduce a second
# file-watch implementation in the tree.
notify-debouncer-mini = { version = "0.4", default-features = false }

# stderr logging (rmcp examples use it; not strictly required).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Liveness checks on discovered apps: the file-based discovery scanner
# uses `kill(pid, 0)` on POSIX to drop registration files left by
# crashed processes.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The author surface + `#[component]` for the `catalog_service::tests`
# module, which links a few synthetic components and asserts they
# round-trip through the `list_components` tool's in-process catalog
# fallback path. `catalog` is what makes `#[component]` emit its
# `inventory::submit!` entry — without it the test binary's catalog is
# empty even though the components compile. The crate root declares the
# `runtime_core` alias under `#[cfg(test)]`, so this stays a dev-dep.
runtime-core = { workspace = true, features = ["catalog"] }
# `#[component]`'s submission spells the absolute path
# `::runtime_vocabulary::glue::__mcp`.
runtime-vocabulary = { workspace = true, features = ["catalog"] }
runtime-macros = { workspace = true, features = ["catalog"] }
