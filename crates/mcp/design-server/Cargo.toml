[package]
name = "mcp-design-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Stdio MCP server (`idealyst mcp design`) with idea-ui design guidance: opinionated design skills, whole-screen recipes compiled against idea-ui, and prompts for designing screens, brand themes, navigation and reviews."

[dependencies]
# Same MCP SDK and feature set as `mcp-server` (one rmcp in the CLI).
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `schema_minify` — both servers advertise their tool schemas the same,
# trimmed way.
mcp-server = { workspace = true }
