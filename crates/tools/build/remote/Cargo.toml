[package]
name = "build-remote"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Release builds of remote-component bundles (`idealyst build --remote`): each bundle crate the app declares, compiled to wasm, checked, stamped with its metadata and optionally signed."

[dependencies]
anyhow = "1"
remote-bundle = { path = "../../../streaming/bundle-format", version = "1.2.0", registry = "idealyst" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
wasmparser = { workspace = true }
# Runs a bundle's shape functions to list what it requires (`requires.rs`):
# the same interpreter, and features, as the loader (`remote-host`).
# Strips the shape functions once they've been read (`strip_shapes`).
walrus = { workspace = true }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[dev-dependencies]
tempfile = "3"
serde_json = { workspace = true }
