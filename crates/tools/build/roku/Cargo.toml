[package]
name = "build-roku"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Roku build orchestration: collects #[method]-transpiled BrightScript + a UI command stream into an installable Roku package"

# Pure orchestration crate. No Rust runs on Roku — this crate's job
# is to lay out a complete `.pkg` directory: app manifest, the
# BrightScript runtime that materializes our SceneGraph from a
# baked JSON command stream, and the per-project methods.brs +
# ui.json. Sibling crates that need the same pipeline pieces (a
# future `run-roku`, for instance) can call into `build()`.
[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
backend-roku-transpile = { workspace = true }
# Pulled in for `FrameworkSource` — the snapshot wrapper's Cargo.toml
# uses the same workspace-or-git source resolution as iOS/Android.
# `build-ios` is the shared home for those utilities.
build-ios = { workspace = true }
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Wrapper-shape tests generate the snapshot wrapper into a scratch dir
# and assert on its text (they never invoke cargo).
tempfile = "3"
