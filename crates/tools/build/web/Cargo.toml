[package]
name = "build-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web build orchestration: generates an ephemeral cdylib wrapper around a user's app crate and drives wasm-pack to produce a .wasm + JS shim. Same pattern as build-ios / build-android."

[dependencies]
anyhow = "1"
build-ios = { workspace = true }
# `--gzip` support for `idealyst build --web`. Writes the bundle's
# files as gzipped bytes under their original filenames so a static
# host can serve them with `Content-Encoding: gzip`.
flate2 = { workspace = true }
# Precompressed `.br` sibling emission for the staged bundle (release
# builds). Pure-Rust encoder; q11 at build time so static hosts
# (nginx `brotli_static`, Caddy `precompressed`, CDN edges) serve
# max-quality brotli with zero per-request cost. Brotli beats gzip -9
# by ~20% on the wasm (222 → 179 KB on the all-on baseline).
brotli = "7"
# Content-hash fingerprinting of the staged bundle: every pkg file is
# renamed to carry a build digest so redeploys can never be served
# stale from HTTP caches.
sha2 = { workspace = true }
# Vendored wasm-split toolchain. Called as a library (not a
# subprocess) so our patches apply automatically without users
# needing to install a separate binary on PATH.
wasm-split-cli = { workspace = true }
# Generates the favicon set (favicon.ico bundle + 192/512/180 PNGs)
# from `[package.metadata.idealyst.app.icon].source` during bundle
# staging. Build is a no-op when the icon block is absent.
icon-gen = { workspace = true }
# Reads the APP crate's Cargo.toml to warn when `--primitives` is
# defeated by the app's own default-features runtime-core dep line
# (feature unification). Already a dev-dep for the wrapper tests.
toml = "0.8"

[dev-dependencies]
tempfile = "3"
toml = "0.8"
