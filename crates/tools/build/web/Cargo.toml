[package]
name = "build-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web build orchestration: generates an ephemeral cdylib wrapper around a user's app crate and drives wasm-pack to produce a .wasm + JS shim. Same pattern as build-ios / build-android."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[dependencies]
anyhow = "1"
# Every line the build prints is a dev-loop event: the cargo run is
# captured and parsed into progress and diagnostics, and the stage
# timings are typed. Callers that never pass a reporter get plain stderr,
# which is what this crate printed before.
dev-events = { workspace = true }
build-ios = { workspace = true }
# `--gzip` support for `idealyst build --web`. Writes the bundle's
# files as gzipped bytes under their original filenames so a static
# host can serve them with `Content-Encoding: gzip`.
flate2 = { workspace = true }
# Precompressed `.br` sibling emission for the staged bundle (release
# builds). Pure-Rust encoder; q11 at build time so static hosts
# (nginx `brotli_static`, Caddy `precompressed`, CDN edges) serve
# max-quality brotli with zero per-request cost. Brotli beats gzip -9
# by ~20% on the wasm (222 → 179 KB on the all-on baseline).
brotli = "7"
# Content-hash fingerprinting of the staged bundle: every pkg file is
# renamed to carry a build digest so redeploys can never be served
# stale from HTTP caches.
sha2 = { workspace = true }
# Import-section scan for the `--no-split` inline loader: we need the
# exact `./__wasm_split.js` import names the `#[wasm_split]` macro
# emitted, and nothing else about the module. Streaming the sections is
# cheap; a full `walrus` parse of a multi-hundred-MB debug wasm is the
# cost `--no-split` exists to avoid.
wasmparser = { workspace = true }
# The rustc-invocation capture and replay the native hot-patch pipeline
# already owns. The wasm patch build replays the same captures for the
# same reason — cargo folds RUSTFLAGS into `-Cmetadata`, `-Cmetadata`
# seeds the symbol mangling, and the jump table pairs symbols by name —
# so this is one mechanism, not two.
build-runtime-server = { workspace = true }
# `JumpTable` — subsecond's own type. The dev server serializes it and
# the page hands the deserialized value straight to `apply_patch`, so a
# shape of our own would be a mismatch nothing checks.
subsecond-types = "0.7"
# Vendored wasm-split toolchain. Called as a library (not a
# subprocess) so our patches apply automatically without users
# needing to install a separate binary on PATH.
wasm-carve = { workspace = true }
# Generates the favicon set (favicon.ico bundle + 192/512/180 PNGs)
# from `[package.metadata.idealyst.app.icon].source` during bundle
# staging. Build is a no-op when the icon block is absent.
icon-gen = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Tests build their fixtures with it. Nothing on the build path uses it:
# base prep, the stranded-import pass and the base index are streaming
# wasmparser / wasm-carve passes (a walrus parse of CrewForge's base was
# 4–9 s and ~3.7 GB each).
walrus = { workspace = true }
toml = "0.8"
# The two-crate roundtrip writes rustc captures in the replay's real
# on-disk format (`replay::CapturedInvocation`, JSON).
serde_json = { workspace = true }
# The own-glue E2E (`tests/own_glue_e2e.rs`) drives headless Chrome over
# the DevTools protocol, as `idealyst-cli`'s browser E2Es do.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
