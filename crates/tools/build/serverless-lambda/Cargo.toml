[package]
name = "build-serverless-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AWS Lambda build orchestration: generates an ephemeral binary wrapper around a user's app crate that force-links its #[server] fns and runs them under the Lambda runtime via server_aws::run(), builds it with `cargo lambda build` into a `bootstrap`, and emits an RIE Dockerfile for local image-fidelity testing. Same wrapper-crate pattern as build-ssr / build-web."

[dependencies]
anyhow = "1"
# `parse_manifest`, `FrameworkSource`, `Manifest` — the shared build-helper
# schema, same as build-ssr.
build-ios = { workspace = true }

[dev-dependencies]
# Wrapper-template regression tests generate into a tempdir.
tempfile = "3"
