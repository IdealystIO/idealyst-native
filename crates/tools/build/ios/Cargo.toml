[package]
name = "build-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iOS build orchestration: generates an ephemeral staticlib wrapper around a user's app crate and drives cargo to produce a .a"
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
