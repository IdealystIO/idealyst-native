[package]
name = "build-ios"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "iOS build orchestration: generates an ephemeral staticlib wrapper around a user's app crate and drives cargo to produce a .a"

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
# `test_support` only (the `test-support` feature).
tempfile = { version = "3", optional = true }

[features]
# The hermetic offline cargo world (`build_ios::test_support`) the sibling
# build crates' wrapper tests share. Never enabled by the CLI.
test-support = ["dep:tempfile"]

[dev-dependencies]
tempfile = "3"
