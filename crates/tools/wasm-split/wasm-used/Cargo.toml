[package]
name = "wasm-used"
edition = "2024"
version.workspace = true
authors = ["Jonathan Kelley"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus/"
homepage = "https://dioxuslabs.com"
description = "wasm-used implementation for Rust"
keywords = ["wasm", "wasm-used", "wasm-split", "dioxus" ]
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[dependencies]
walrus = { workspace = true, features = ["parallel"] }
id-arena = { workspace = true }
tracing = { workspace = true }
