[package]
name = "wasm-split-macro"
edition = "2024"
version = "1.5.2"
authors = ["Jonathan Kelley"]
description = "macro crate for wasm-split - a tool for splitting up large WASM binaries into smaller chunks"
repository = "https://github.com/DioxusLabs/dioxus/"
license = "MIT OR Apache-2.0"
keywords = ["wasm", "cli", "split", "dioxus"]
rust-version = "1.85.0"


[dependencies]
syn = { workspace = true, features = ["full"] }
base16 = { workspace = true }
digest = { workspace = true }
quote = { workspace = true }
sha2 = { workspace = true }
# `span-locations`: `LoaderNames::new` reads `Span::file()` to name each
# split export by (module, fn, file) instead of by byte offset — see the
# comment there for the incremental-compilation cascade that fixes.
proc-macro2 = { workspace = true, features = ["span-locations"] }

[lib]
proc-macro = true
