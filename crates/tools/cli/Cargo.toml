[package]
name = "idealyst-cli"
version = "1.7.1"
edition.workspace = true
license.workspace = true
description = "Idealyst framework CLI — scaffold, dev-serve, build, and run idealyst apps"
# `package-assets/` is gitignored, so it has to be named here to be
# packaged; `include` also keeps the e2e `tests/` (which need the
# workspace) out of the published crate.
include = ["/src/**", "/build.rs", "/package-assets/**"]

# The binary embeds two things that live outside this directory: the
# `idealyst new` scaffold (`examples/welcome`) and the Inspector front end
# (built from `examples/inspector`). A change to either is a change to the
# CLI, and the release stages both into `package-assets/` before packaging
# — the build script exports them when the env var is set. See build.rs,
# "Package assets".
[package.metadata.registry]
also-watch = ["examples/welcome", "examples/inspector"]
prepackage = [
    "cargo", "build", "-p", "idealyst-cli",
    "--config", "env.IDEALYST_CLI_EXPORT_PACKAGE_ASSETS='1'",
]

# The package is `idealyst-cli` so `cargo install idealyst-cli` is
# discoverable, but the binary itself is `idealyst` — what users type.
[[bin]]
name = "idealyst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
# `idealyst update` compares the running version with the registry's.
semver = { version = "1", features = ["serde"] }
# Unified SDK config loader — `dev`/`worker` read the merged `idealyst.toml`
# (connection profiles + `[jobs]`/`[pubsub]`) to decide worker orchestration.
# Default features only: the loader + schema, none of the SDK wiring.
idealyst-config = { workspace = true }
# Auto-load `.env` / `.env.local` from the invocation directory so
# credentials (App Store Connect API key, signing team) resolve without
# manual `source`-ing. Does NOT override already-set process env vars, so
# a real shell var always wins over the file.
dotenvy = "0.15"
# Cross-platform Ctrl-C handler. The `termination` feature widens
# the catch to SIGTERM (terminal window closed) and SIGHUP (parent
# shell exit) — without it, only SIGINT (literal Ctrl-C) triggered
# cleanup, leaking `welcome-runtime-server-host` processes every
# time the user dismissed the CLI any other way. SIGKILL still
# bypasses the handler; the dev-host has its own parent-PID
# watchdog for that case.
ctrlc = { version = "3", features = ["termination"] }
# Dev-mode infrastructure. Both crates are intentionally small and
# usable independently — `dev-http` for plain static serving,
# `dev-reload` for the watch+wasm-pack loop. The CLI is the wiring.
# The `ui!` front end, as a library: the CLI runs the SAME parser, split
# pass and node numbering the proc macro does, to produce a build's
# overlay descriptor set from source. A second implementation that
# disagreed by one node would mis-address every patch after it.
runtime-macros-parse = { workspace = true }
runtime-template = { workspace = true }
# File-content digests for the overlay build key.
sha2 = { workspace = true }
dev-http = { workspace = true }
dev-reload = { workspace = true }
# The session's reporting: every dev-loop line is a typed event, fanned
# out to the terminal (plain lines or the panel), the session log, and
# `--events`/`--events-file` JSON.
dev-events = { workspace = true, features = ["schema"] }
# Robot bridge relay for `dev --web --local --robot`: the dev process hosts a
# relay the browser app dials, exposing its Robot bridge to the MCP server.
robot-relay = { workspace = true }
# `idealyst inspect` / `dev --inspect`: the Inspector's debug server (it
# owns every app connection and all debug state) and the protocol it
# speaks with the front end the CLI embeds (see build.rs).
inspector-server = { workspace = true }
inspector-protocol = { workspace = true }
# Declarative cross-platform Robot test runner behind `idealyst test`.
robot-test = { workspace = true }
# Platform-specific build orchestration. Each platform's pipeline
# is its own crate so the CLI's `build` and `run` commands stay thin.
build-ios = { workspace = true }
run-ios = { workspace = true }
build-runtime-server = { workspace = true }
build-android = { workspace = true }
run-android = { workspace = true }
build-roku = { workspace = true }
run-roku = { workspace = true }
build-sim = { workspace = true }
# `idealyst build --remote` / `idealyst remote`: release bundles of remote
# components, and their signing keys.
build-remote = { workspace = true }
remote-bundle = { path = "../../streaming/bundle-format", version = "1.2.0", registry = "idealyst" }
# `idealyst ota`: publishing over-the-air releases; `toml_edit` writes the
# settings into an app's Cargo.toml without disturbing the rest of it.
ota-publish = { path = "../../ota/publish", version = "0.1.0", registry = "idealyst" }
ota-index = { path = "../../ota/index", version = "0.2.0", registry = "idealyst" }
toml_edit = "0.22"
build-web = { workspace = true }
build-macos = { workspace = true }
build-ssr = { workspace = true }
build-serverless-lambda = { workspace = true }
run-macos = { workspace = true }
build-terminal = { workspace = true }
run-terminal = { workspace = true }
build-linux = { workspace = true }
run-linux = { workspace = true }
build-windows = { workspace = true }
run-windows = { workspace = true }
# Interactive panel for `idealyst dev --interactive`. Pulled in by the
# CLI only; the dev-tui crate dogfoods the framework's terminal
# backend to render a live build/run status + log stream.
dev-tui = { workspace = true }
# Generates favicon / app-icon assets from a single SVG (or PNG)
# source declared in `[package.metadata.idealyst.app.icon]`. Driven
# by the `sync icons` subcommand and, eventually, build-time auto-
# sync hooks in the per-platform build crates.
icon-gen = { workspace = true }
# Relative-path computation for the `icon preview` HTML
# (`<img src="web/favicon.ico">` references resolved against the
# HTML's location). Tiny dep; no transitive heft.
pathdiff = "0.2"
# Roku BrightScript transpiler — powers the `brs` subcommand, which
# scans the project's source files for `#[method]`-tagged fns and
# concatenates their BrightScript output into a single `.brs` file.
backend-roku-transpile = { workspace = true }
syn = { version = "2", features = ["full"] }
# Reads the workspace's own catalog entries from source (`catalog-json
# --scan`, `catalog-scan`, and the MCP server's refresh).
catalog-scan = { workspace = true }
# `catalog-scan` prints a param's type as the author wrote it.
quote = { workspace = true }
# Source linter engine — powers the `lint` subcommand and the
# rust-analyzer `check.overrideCommand` integration. The CLI is just the
# entry point; the rules + diagnostic formats live in the crate.
lint = { workspace = true }

# Project configuration engine — powers `idealyst configure` (devcontainer
# provisioning today). The same crate backs the MCP `configure_devcontainer`
# tool; the CLI adds only the interactive wizard on top of its plan→apply core.
configure = { workspace = true }
# Interactive prompts for `idealyst configure devcontainer` (multi-select of
# services, per-service action/variant). Only reached in the interactive path;
# `--non-interactive` never touches it.
dialoguer = "0.11"

# `mcp` subcommand — uses the same server crate as `mcp-demo`. The
# CLI is just the entry point that picks options and hands them off.
# Note: the CLI itself has no `#[component]` definitions, so its
# catalog is empty on its own — the value is being the wired-up
# launcher rather than a different server. (The user's app, when
# it depends on runtime-core/mcp, populates the inventory.)
mcp-server = { workspace = true }
mcp-catalog = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# setrlimit(RLIMIT_AS) for the default process-level memory cap (see
# `memory_limit.rs`). Already pulled in transitively by many deps;
# named explicitly because the CLI itself calls into it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# build.rs compiles the Inspector front end (`examples/inspector`) for the
# web with the same pipeline `idealyst build --web` runs, and embeds the
# bundle so `idealyst inspect` serves it from the binary.
[build-dependencies]
build-web = { workspace = true }
build-ios = { workspace = true }
dev-events = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
# E2E test for `idealyst mcp` live-reload: drive the real server binary
# over stdio as an MCP client. `client` + `transport-child-process` give
# us `TokioChildProcess` + the client peer; the extra tokio features are
# for spawning/awaiting that child and polling with timeouts.
rmcp = { version = "1", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
serde_json = { workspace = true }
# `wasm_hot_patch_e2e`: talks to headless Chrome over the DevTools
# protocol. Same version the dev crates already lock.
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# `wasm_hot_patch_e2e`: checks the served patch's sections.
wasmparser = { workspace = true }
