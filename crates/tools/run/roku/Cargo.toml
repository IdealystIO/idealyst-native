[package]
name = "run-roku"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Roku side-loader: zips a build-roku package directory, uploads it to a device in developer mode via the standard HTTP digest /plugin_install endpoint, and optionally tails the debug console on port 8085"
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
anyhow = "1"
build-roku = { workspace = true }
