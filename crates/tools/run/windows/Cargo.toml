[package]
name = "run-windows"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Windows launcher for `idealyst run windows` / `idealyst dev --windows`: builds via build-windows, then launches the .exe."

# Windows launcher for `idealyst run --windows` / `idealyst dev --windows`.
#
# Calls `build-windows` to produce the `.exe`, then spawns it — as a
# foreground child (one-shot `idealyst run windows`, stdio inherited so
# framework logs surface) or detached (dev mode). No bundle / signing
# step; a Windows exe launches directly.

[dependencies]
anyhow = "1"
build-windows = { workspace = true }
build-ios = { workspace = true }
