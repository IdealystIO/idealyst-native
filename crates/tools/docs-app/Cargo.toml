[package]
name = "docs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Catalog-driven documentation app — renders an Idealyst project's component catalog (every #[component], primitive, utility, type, guide) for humans, built with idea-ui + the docs SDKs. Backs the `idealyst docs` command; catalog source is injectable via the IDEALYST_DOCS_CATALOG env var at build time."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

# `rlib` only: the app's entry point is `src/main.rs`, and `idealyst docs`
# links this crate as a library into a generated project. Not a `cdylib`:
# under `idealyst docs` the `extern` block `build.rs` generates names the
# documented project's preview symbols, which only that generated project
# links, so a standalone link of this crate cannot resolve them.
[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so
# `register_scene_extensions_recorder` compiles against the recorder
# backend's scene registry; device/web builds never see it.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs. An idealyst app IS its binary; there is no generated
# wrapper crate.
idealyst = { workspace = true }
# The author surface. `runtime-core` is aliased to `runtime_core` at
# the crate root (src/lib.rs).
#
# `catalog` flips the
# emission gate in `runtime-macros` AND the vocabulary's `glue::__mcp`
# anchor (which this root's glob re-export carries, so alias-resolved
# `#[derive(IdealystSchema)]` / `recipe!` / `doc_scope!` emissions land
# there too), pulling `mcp-catalog` in transitively. That is what makes
# every `#[component]` expansion across the dep graph — idea-ui's, the
# shell's, the SDKs' — register a catalog entry the app can read back.
#
# `previews` makes every `#[component]` / zero-argument `recipe!` across
# the graph export its live preview under a symbol the catalog records;
# `build.rs` declares those symbols in an `extern` block (src/previews.rs).
runtime-core = { workspace = true, features = ["catalog", "previews"] }
# The `ui!` / `#[component]` emission spells absolute
# `::runtime_vocabulary::glue::…` paths, and `app()` names the
# vocabulary's nav prims directly.
runtime-vocabulary = { workspace = true }
# `runtime_scene::Registry` — the type of the boot registration seam.
runtime-scene = { workspace = true }
# Read the catalog programmatically (typed `ResolvedCatalog` + the
# entry structs). A pure-consumer app would only need
# `runtime-core/catalog`, but this app inspects the catalog directly.
mcp-catalog = { workspace = true }
# idea-ui provides the layout/typography/cards/tabs/table components the
# docs chrome is built from. Depending on it (and referencing its
# components in `app()`) links its rlib, which brings its
# `inventory::submit!` catalog ctors into the build — so idea-ui's
# components show up in the runtime catalog.
idea-ui = { workspace = true }
# Outlet-model navigation: the swap navigator swaps the active screen into
# the layout's `{nav.outlet}`; idea-ui-nav's `AppShell` packages the
# pinned-sidebar ⇄ off-canvas-drawer chrome around it.
swap-navigator = { workspace = true }
idea-ui-nav = { workspace = true }
# Theme-aware syntax-highlighted code panels for usage snippets.
# `codeblock::register` at boot is its scene-registry seam.
codeblock = { workspace = true }
# CommonMark/GFM prose rendering for guides + entry docs — one native
# styled-text node per backend. Recipe code samples stay on `codeblock`.
# `markdown::register` at boot is its scene-registry seam.
markdown = { workspace = true }
# The playground's and header's Copy buttons.
clipboard = { workspace = true }
# Reads the build-time `sources.json` ("View source").
serde_json = { workspace = true }
# Real HTML <table> on web; shared-track CSS-grid on native. Powers the
# auto-generated props/fields tables. `table::register_handlers` at boot
# is its scene-registry seam.
table = { workspace = true }
# Lucide icon pack — the `MENU` glyph for the mobile hamburger AND the
# whole-pack `ALL` registry (the `registry` feature) the Icons gallery
# page renders the live glyph grid from. Geometry comes from here; the
# pack's catalog metadata (names/count/license) comes from catalog.json.
icons-lucide = { workspace = true, features = ["registry"] }
# Recorder backend for the runtime-server sidecar wrapper. Optional —
# pulled in only by the `sidecar` feature (host-side sidecar build);
# never compiled for device/web targets.
dev-server = { workspace = true, optional = true }

# No backend deps. `register_scene_extensions` is generic over the scene
# `Host` (all three SDK handlers this app registers are caps-generic), so
# the app crate is fully platform-agnostic — the CLI-generated wrappers
# bring their own concrete backend and own the boot, including the live
# viewport source (`backend_web::newcore::start_in` installs the window
# `resize` listener itself; there is no per-backend `register_extensions`
# hook to write any more).

# Build-time catalog extraction (see build.rs). These compile for the
# HOST and run inside the build script, where inventory's `#[used]` ctors
# survive — so we get the FULL framework catalog, immune to the wasm DCE
# that prunes the runtime self-inventory. `runtime-core/catalog` flips
# the emission gate on within the build-dep feature graph so every
# `#[component]` / `#[derive(IdealystSchema)]` in these crates emits.
[build-dependencies]
# Same features as the runtime dep: the catalog this extracts must record
# the preview symbols that the wasm build of the same crates exports.
runtime-core = { workspace = true, features = ["catalog", "previews"] }
mcp-catalog = { workspace = true }
idea-ui = { workspace = true }
swap-navigator = { workspace = true }
idea-ui-nav = { workspace = true }
table = { workspace = true }
codeblock = { workspace = true }
# `catalog` makes icons-lucide self-register its `IconSetEntry` into the
# inventory the build script's `catalog_json()` reads — so the Icons pack
# lands in catalog.json. (Resolver v2 keeps this build-dep feature off the
# wasm runtime dep above, which only needs `registry`.)
icons-lucide = { workspace = true, features = ["catalog"] }
serde_json = { workspace = true }
# `src/source_extract.rs`: parse each component's file to cut out its fn
# for "View source". `span-locations` gives the line numbers it slices by.
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# The unit tests build the catalog and exercise the view-model mapping.
serde_json = { workspace = true }

# wasm-opt's bundled binaryen rejects bulk-memory ops emitted by recent
# rustc; the wasm is still LTO'd at link time without the post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Idealyst project config — read by `idealyst build`/`run`/`dev`.
[package.metadata.idealyst.app]
name      = "Idealyst Docs"
bundle_id = "io.idealyst.docs_app"
version   = "0.0.1"
targets   = ["web", "ios", "android"]

[package.metadata.idealyst.app.splash]
duration_ms = 0
