# A native app and its remote components in ONE source file
# (`src/main.rs`). This package is the app; `../bundle` builds the same
# file as the wasm bundle the app loads its `#[component(remote)]`
# components from. `cargo run --release -p remote-example`.

[package]
name = "remote-example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
runtime-core = { workspace = true }
# `remote`: the `#[component(remote)]` runtime (props, loader seam).
runtime-vocabulary = { workspace = true, features = ["remote"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
stream-host = { path = "../../host" }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
