# The remote bundle of `../app`: the SAME source file, built for wasm32 with
# `--cfg idealyst_stream_guest`, where its `#[component(remote)]` bodies
# and mount exports compile and the app itself does not. Built by the app's
# build script (embedded as its fallback) and served live by stream-serve.

[package]
name = "remote-example-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The APP's crate name, not this package's. App components are imported by
# `module_path::Name`, and the module path starts with the crate name: built
# as `remote_example_bundle`, the bundle asked the app for
# `remote_example_bundle::Badge` while the app registered
# `remote_example::Badge`, and every import failed with MissingImport. The
# app's build script checks the two names match.
name = "remote_example"
path = "../app/src/main.rs"
crate-type = ["cdylib"]

[dependencies]
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true, features = ["remote"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
# `#[host_fn]`: native functions the remote component calls.
stream-abi = { path = "../../abi" }
stream-macros = { path = "../../macros" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)', 'cfg(idealyst_stream_model_a)'] }
