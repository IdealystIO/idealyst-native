# A shopping-style app whose screens come from a remote bundle: a native
# tab shell, a remote feed, a remote shop that defines its own navigator,
# native settings driving context the remote screens read. The components
# live in `src/lib.rs`, which is also the bundle (built by `build.rs` for
# the embedded copy, and by `idealyst build --remote` for a release); the
# desktop window is `src/main.rs` (`cargo run --release -p
# remote-showcase`); the CLI's iOS/Android shells mount `app()` from the lib
# (`idealyst build --ios --release` from this directory).

[package]
name = "remote-showcase"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "remote-showcase"
path = "src/main.rs"

[features]
# Run the remote screens in-process (the same source, compiled natively)
# instead of from the bundle: the native baseline `examples/measure.rs`
# compares against, and the flow test's second run.
inline = ["runtime-vocabulary/remote-inline"]

[dependencies]
runtime-core = { workspace = true }
idea-ui = { workspace = true }
runtime-vocabulary = { workspace = true, features = ["remote"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }

# The app's side only: the loader. Gated off a bundle build
# (`idealyst build --remote` compiles this crate's library with
# `--cfg idealyst_stream_guest`), which can't compile an interpreter.
[target.'cfg(not(idealyst_stream_guest))'.dependencies]
remote-host = { path = "../../host" }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true }

# The benchmark reads resident memory from the kernel (`task_info`).
[target.'cfg(target_vendor = "apple")'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
host-mock = { workspace = true }
# `tests/requirements.rs`: list what the embedded bundle requires, as the
# release build does, and check it against what this app provides.
build-remote = { path = "../../../tools/build/remote" }
remote-bundle = { workspace = true }
# `tests/ota.rs`: the showcase updated over the air from a release directory.
ota = { workspace = true }
ota-publish = { path = "../../../ota/publish" }
# `tests/ota.rs`: the app's client against the real resolution service,
# served in-process (and its requests read as JSON).
ota-resolver = { path = "../../../ota/resolver" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
serde_json = { workspace = true }
tempfile = "3"

[package.metadata.idealyst.app]
name      = "Remote Showcase"
bundle_id = "ai.truday.idealyst.remoteshowcase"
version   = "0.0.1"
targets   = ["ios", "android", "macos"]

# The release bundle: this crate's own library, built by
# `idealyst build --remote` into target/idealyst/remote/showcase.wasm.
[package.metadata.idealyst.remote]
bundles = [{ name = "showcase", package = "remote-showcase" }]

# Over-the-air releases (`ota`, `idealyst ota publish`): the showcase's
# development server, which `stream-serve` runs on this port. A release
# app points `url` at the CDN in front of `bucket`.
[package.metadata.idealyst.ota]
url = "http://127.0.0.1:7878/ota"
bucket = "../../../../target/idealyst/ota-showcase"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
