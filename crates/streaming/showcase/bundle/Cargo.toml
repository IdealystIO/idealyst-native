# The remote bundle of `../app`: its `src/lib.rs`, built for wasm32 with
# `--cfg idealyst_stream_guest`. Built by the app's build script (embedded
# as its fallback) and served live by stream-serve (`/showcase.wasm`).

[package]
name = "remote-showcase-bundle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The APP's crate name: app components are imported by `module_path::Name`
# (the app's build script checks the two match).
name = "remote_showcase"
path = "../app/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
runtime-core = { workspace = true }
idea-ui = { workspace = true }
runtime-vocabulary = { workspace = true, features = ["remote"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
stream-abi = { path = "../../abi" }
stream-macros = { path = "../../macros" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)', 'cfg(idealyst_stream_model_a)', 'cfg(feature, values("inline"))'] }
