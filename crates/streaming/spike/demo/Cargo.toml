# A real AppKit window showing streamed components from the spike bundle
# next to native host controls. `cargo run --release -p stream-demo`.

[package]
name = "stream-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stream-host = { path = "../../host" }
stream-spike = { path = ".." }
runtime-shared = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true }
