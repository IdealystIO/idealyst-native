# A real AppKit window showing streamed components from the spike bundle
# next to native host controls. `cargo run --release -p stream-demo`.

[package]
name = "stream-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
remote-host = { path = "../../host" }
stream-spike = { path = ".." }
runtime-shared = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
# The bridged remote component: the same RemoteCounter compiled natively
# (for side-by-side comparison), `ui!` to mount it, and the codecs for its
# props and context.
spike-components = { path = "../components" }
runtime-core = { workspace = true }
remote-abi = { path = "../../abi" }
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true }
