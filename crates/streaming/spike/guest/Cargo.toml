# The spike's streamed bundle. Built for wasm32 with
# `--cfg idealyst_stream_guest` by stream-spike's build script; without that
# cfg the whole crate compiles to nothing, so `cargo build --workspace`
# stays green.

[package]
name = "spike-guest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stream-guest = { path = "../../guest" }
spike-camera = { path = "../camera" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
