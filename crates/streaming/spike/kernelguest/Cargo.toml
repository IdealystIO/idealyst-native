# Phase-3 test bundle: plain runtime-world code (signals, memo, effects,
# scopes, cleanups, context) compiled with `--cfg idealyst_stream_guest`, so
# its kernel is the BRIDGED engine and everything it creates lives in the
# host app's graph. Built for wasm32 by stream-spike's build script.

[package]
name = "spike-kernelguest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
runtime-world = { workspace = true }
# Codecs for host-owned values (props, context).
stream-abi = { path = "../../abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
