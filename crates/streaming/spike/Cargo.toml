# stream-spike — measures and tests the streamed-component boundary end to
# end: builds `spike-guest` to wasm32 (build.rs), loads it through
# stream-host into a host-mock scene, and compares against the same tree
# built natively. A spike: not published, not depended on.

[package]
name = "stream-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stream-host = { path = "../host" }
stream-abi = { path = "../abi" }
# The full-framework (model B) prototype host: load the bundle, decode its
# wire commands.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "portable-dispatch"] }
wire = { workspace = true }
spike-camera = { path = "camera" }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[dev-dependencies]
host-mock = { workspace = true }
# Model B: replay the bundle's commands through the real replay client into
# the mock scene, and run the same component natively for parity/baseline.
dev-client = { workspace = true }
dev-server = { workspace = true }
mock-backend = { workspace = true }
spike-components = { path = "components" }
runtime-core = { workspace = true }
