# stream-spike — tests the remote-component boundary end to end: builds the
# spike's bundles to wasm32 (build.rs), loads them through stream-host into
# a host-mock scene, and compares against the same trees built natively.
# Also `stream-serve`, which rebuilds and serves bundles live. A spike: not
# published, not depended on.

[package]
name = "stream-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stream-host = { path = "../host" }

[dev-dependencies]
stream-abi = { path = "../abi" }
spike-camera = { path = "camera" }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
host-mock = { workspace = true }
spike-components = { path = "components" }
spike-remoteattr = { path = "remoteattr" }
spike-ideaui = { path = "ideaui" }
idea-ui = { workspace = true }
stack-navigator = { path = "../../sdk/client/navigators/stack" }
runtime-core = { workspace = true }
