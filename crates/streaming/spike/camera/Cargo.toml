# spike-camera — a fake camera SDK exposing `#[host_fn]`s. One definition,
# compiled into the app (the real functions) and into the bundle (stubs).
# Which one is decided by `--cfg idealyst_stream_guest`, set only by the
# bundle build — see stream-macros for why that is not a cargo feature.

[package]
name = "spike-camera"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
stream-abi = { path = "../../abi" }
stream-macros = { path = "../../macros" }

[target.'cfg(idealyst_stream_guest)'.dependencies]
stream-guest = { path = "../../guest" }

[target.'cfg(not(idealyst_stream_guest))'.dependencies]
runtime-shared = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
