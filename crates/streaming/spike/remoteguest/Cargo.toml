# Phase 4 test bundle: `spike-components`' RemoteCounter — an ordinary
# `#[component]` written with `ui!` — as a REMOTE component. Its kernel is
# the bridged one (its signals live in the host's graph) and its tree
# crosses through runtime-vocabulary's element codec, to be realized by the
# host's own registry and backend. Built for wasm32 by stream-spike's build
# script.

[package]
name = "spike-remoteguest"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spike-components = { path = "../components" }
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true, features = ["remote"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
# Codecs for host-owned values (props, context).
remote-abi = { path = "../../abi" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
