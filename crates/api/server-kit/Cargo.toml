[package]
name = "server-kit"
version.workspace = true
edition.workspace = true
license.workspace = true

# The conventional policy layer over the server-functions primitive.
#
# The `server` crate is deliberately unopinionated: its only interception
# surface is a single DispatchHook slot. This crate is the conventional
# implementation built on that slot — an ordered middleware chain
# (`install_middleware` / `from_fn`), the `Auth<T>` 401-on-missing
# extractor, the `csrf_guard` origin check, and path-scoped `require`
# guards. An app that wants a different policy model skips this crate
# and installs its own DispatchHook; this one is convention, not core.
#
# Feature split mirrors `server`: the `Auth<T>` wrapper type exists on
# both builds (it appears in shared #[server] signatures); everything
# else — the chain, the hook glue, the guards — is `server`-feature-only.

[features]
default = []
server = ["server/server"]

[dependencies]
server = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Builds the Stream fixture for the #[sse] on_open gating test.
futures-util = "0.3"
