[package]
name = "server-kit"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# The conventional policy layer over the server-functions primitive.
#
# The `server` crate is deliberately unopinionated: its only interception
# surface is a single DispatchHook slot. This crate is the conventional
# implementation built on that slot — an ordered middleware chain
# (`install_middleware` / `from_fn`), the `Auth<T>` 401-on-missing
# extractor, the `csrf_guard` origin check, and path-scoped `require`
# guards. An app that wants a different policy model skips this crate
# and installs its own DispatchHook; this one is convention, not core.
#
# Feature split mirrors `server`: the `Auth<T>` wrapper type exists on
# both builds (it appears in shared #[server] signatures); everything
# else — the chain, the hook glue, the guards — is `server`-feature-only.

[features]
default = []
server = ["server/server", "dep:cache", "dep:serde", "dep:serde_json", "dep:getrandom"]
# Redis-backed LimitStore + cache/session backends (shared across
# instances). The connection is app-provided context — the app opens one
# redis::Client and every consumer (RedisLimitStore, cache::RedisCache,
# sessions-over-cache) reads the same installed instance.
redis = ["server", "dep:redis", "dep:tokio", "cache/redis"]

[dependencies]
server = { workspace = true }
# Sessions ride the Cache abstraction (a session store IS a KV-with-TTL).
cache = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# CSPRNG session tokens.
getrandom = { version = "0.2", optional = true }
# `redis` feature only. Mirrors jobs/pubsub: tokio-comp + the multiplexed
# connection manager + Lua script support; tokio only for sync::OnceCell.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Builds the Stream fixture for the #[sse] on_open gating test.
futures-util = "0.3"
