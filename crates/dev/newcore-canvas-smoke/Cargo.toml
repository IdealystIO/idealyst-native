# newcore-canvas-smoke — live-verification vehicle for the External-SDK
# wave: the canvas SDK rendered through the scene registry on the web
# boot path. Direct vocabulary-builder calls (no macros — the
# newcore-web-smoke posture) build a tree containing a `canvas::Canvas`
# whose draw closure reads a signal; a button bumps the signal, and the
# repaint must flow through the SDK's world effect → canvas-native's
# Canvas2D handler.
#
# Build + serve (from the repo root):
#   wasm-pack build --target web --dev crates/dev/newcore-canvas-smoke
#   python3 -m http.server 8090 -d crates/dev/newcore-canvas-smoke
[package]
name = "newcore-canvas-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smoke app: the canvas SDK on the web boot path (External-SDK wave)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
backend-web = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
# The shared substrate for the literal `StyleRules` this tree builds.
runtime-shared = { workspace = true }
canvas = { workspace = true }
canvas-native = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
console_error_panic_hook = "0.1"
