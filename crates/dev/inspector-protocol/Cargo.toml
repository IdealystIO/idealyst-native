[package]
name = "inspector-protocol"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "The wire protocol between the Idealyst Inspector front end and its debug server (`idealyst inspect`): the typed mirror of a target app's state (`Snapshot`), the discovered-app list, and the JSON messages each side sends over the Inspector WebSocket. Plain serde types, so the same crate builds for the wasm front end and the native server."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
