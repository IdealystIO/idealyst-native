# newcore-macos-smoke — P4a smoke app for the macOS backend's NEW-core
# boot path (`host_appkit::newcore::run` → `backend_macos::newcore::start`).
# Builds the same small vocabulary-builder tree as `newcore-web-smoke`
# (text + button + toggle + a dyn hole + a keyed list + one literal
# StyleRules) with DIRECT builder calls — no `ui!`/`jsx!` — so it
# exercises the registry-dispatch render path against real AppKit
# independent of the parallel P3a macro-lowering work.
#
# Run (macOS only):
#   cargo run -p newcore-macos-smoke
[package]
name = "newcore-macos-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smoke app for backend-macos's new-core (Host + caps) boot path — idea-lite migration P4a."

[[bin]]
name = "newcore-macos-smoke"
path = "src/main.rs"

[dependencies]
runtime-core = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true, features = ["new-core"] }
# Embedded-simulator phase (self-test phase 5): mount a new-core wgpu
# preview INSIDE this new-core app via `host_macos_desktop::
# mount_newcore` (realizes into this app's world through
# `backend_macos::newcore::mounted_world`). `render-wgpu` supplies the
# `NativeSkin` painter; `runtime-core/async-driver` names the
# `driver::spawn_async` entry the async wgpu init rides (host-appkit
# already installs the libdispatch executor via `install_scheduler`).
host-macos-desktop = { workspace = true, features = ["new-core"] }
render-wgpu = { workspace = true, features = ["new-core"] }
runtime-core = { workspace = true, features = ["async-driver"] }
objc2 = "0.5"
# Self-test only (`NEWCORE_SMOKE_SELFTEST=1`): count the live NSView
# tree under the key window to prove realize/finish attached real views.
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder", "NSWindow", "NSView"] }
objc2-foundation = { version = "0.2", features = ["NSThread", "NSArray", "NSGeometry", "NSString"] }
