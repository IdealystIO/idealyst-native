# newcore-android-smoke — smoke app for the Android backend's boot path
# (`backend_android::newcore::start`). Builds the same small
# vocabulary-builder tree as `newcore-macos-smoke` / `newcore-web-smoke`
# (text + button + toggle + a dyn hole + a keyed list + one literal
# StyleRules) with DIRECT builder calls — no `ui!`/`jsx!` — so it
# exercises the registry-dispatch render path against real Android Views
# with the macro-lowering layer out of the picture.
#
# This is a normal idealyst PROJECT: the CLI-generated JNI wrapper hosts
# it, routing `attach` through `newcore::start(backend,
# register_scene_extensions, scene_app)`. Build + install + launch on an
# emulator/device with the checked-in driver (needs ANDROID_HOME +
# ANDROID_NDK_HOME):
#
#   cargo run -p newcore-android-smoke --features launcher --bin launch
#
# Self-test (always on): ~2.5 s after boot an `after_ms` timer STAGES a
# signal write (committed only if the scheduler's post-dispatch flush
# hook works), then logs
#   [SMOKE-SELFTEST] committed=true views=<n> verdict=PASS
# to logcat (tag `idealyst`), with the view count read from the REAL
# Android view hierarchy over JNI.
[package]
name = "newcore-android-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smoke app for backend-android-mobile's Host + caps boot path."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Host-side launcher (build wrapper → APK → adb install → launch).
# Off by default so the Android cdylib build of this lib never pulls
# the host tooling crates.
launcher = ["dep:run-android", "dep:build-ios", "dep:anyhow"]

[[bin]]
name = "launch"
path = "src/bin/launch.rs"
required-features = ["launcher"]

[dependencies]
# The shared substrate: the style data model + the scheduler the
# self-test's scope-owned timers come from.
runtime-shared = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
# Host-side launcher deps (feature-gated).
run-android = { workspace = true, optional = true }
build-ios = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# The lib's self-test calls `backend_android::newcore::live_view_count()`
# directly, so this crate names the backend itself rather than reaching it
# only through the generated wrapper.
backend-android-mobile = { workspace = true }
log = "0.4"

[package.metadata.idealyst.app]
name      = "Newcore Smoke"
bundle_id = "ai.truday.idealyst.newcoresmoke"
version   = "0.0.1"
targets   = ["android"]
