[package]
name = "parity-goldens"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Golden-file substrate for the backend parity suites: each consumer
# compares its current output (byte-exact SSR/email HTML, cell-exact
# terminal grids, pixel-exact CPU framebuffers, byte-exact Roku command
# streams, wire-snapshot JSON) against a committed reference file.
#
# Contract: `check_*` always compares; `freeze_*` writes a reference only
# under `IDEALYST_FREEZE_GOLDENS=1` (only dev-tui's panel goldens call
# it; the backend parity references are fixed).
#
# See `docs/runtime-v2-deletion-baseline.md` and each consumer's
# `tests/goldens/README.md`.

[dependencies]
# Lossless RGBA8 PNG for framebuffer goldens (alpha preserved, so the
# round trip is byte-exact). Already in the lock via mock-backend /
# icon-gen, so this adds no new build.
image = { version = "0.25", default-features = false, features = ["png"] }
