# newcore-web-smoke — smoke app for the web backend's boot path
# (`backend_web::newcore::start` / `newcore::hydrate`). Builds a small
# vocabulary-builder tree (text + button + toggle + a dyn hole + a keyed
# list + a sheet-styled section) with DIRECT builder calls — no
# `ui!`/`jsx!` — so it exercises the registry-dispatch render path with
# the macro lowering out of the picture.
#
# Build + serve (from the repo root):
#   wasm-pack build --target web --dev crates/dev/newcore-web-smoke
#   python3 -m http.server 8080 -d crates/dev/newcore-web-smoke
#   open http://localhost:8080/            # fresh CSR boot (newcore::start)
#   open http://localhost:8080/hydrate.html # adopt-mode boot (newcore::hydrate)
#     — hydrate.html ships #app pre-rendered (server-shaped fixture) and logs
#       a `[hydrate-smoke]` node-identity report proving adoption, not rebuild.
[package]
name = "newcore-web-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smoke app for backend-web's Host + caps boot path."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `hydrate` compiles the adoption machinery so `newcore::hydrate` can
# adopt the pre-rendered DOM in hydrate.html (index.html stays CSR).
backend-web = { workspace = true, features = ["hydrate"] }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
# The shared substrate for the style data model this tree builds by hand
# (`StyleRules`, `StyleSheet`, `StyleApplication`, tokens, colors, lengths).
runtime-shared = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
console_error_panic_hook = "0.1"
