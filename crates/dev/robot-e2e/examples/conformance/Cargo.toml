[package]
name = "conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform conformance app: mounts the framework's primitives, idea-ui components, and navigators in deliberately weird configurations, each tagged with a stable test_id, and drives them with an in-app robot-e2e suite. Run it on any backend to get a pass/fail verdict on the framework core."

[lib]
# `cdylib` for the new-core web build (`wasm-pack build --target web -- \
# --no-default-features --features new-core,robot`); the CLI's old-core
# builds keep consuming the rlib through their generated wrapper.
crate-type = ["rlib", "cdylib"]

[features]
# `robot` MUST be a default feature: the `ui!` macro's
# `#[cfg(feature = "robot")]` gate is evaluated in THIS crate's context, so
# without it the lowered primitives omit their `test_id` slots and the whole
# suite is blind. It also pulls the `robot-e2e` harness + turns on the real
# Robot API. `--no-default-features` still builds a plain, untested app.
default = ["robot", "old-core"]
robot = ["runtime-core/robot", "idea-ui?/robot", "dep:robot-e2e"]

# The two cores — SAME-SOURCE dual-core app (the newcore-app pattern):
# exactly one per build; `old-core` is the default (CLI builds are
# unchanged), `new-core` is the idea-lite migration build:
#
#   cargo check -p conformance                                        # old core
#   cargo check -p conformance --no-default-features \
#       --features new-core,robot                                     # new core
#
# `new-core` is NON-default on purpose: it forwards to
# `runtime-macros/new-core`, and proc-macro features unify across a
# build graph (see runtime-macros/Cargo.toml). The old-core surface
# (idea-ui components, the class stack-navigator SDK) is old-core-only —
# those crates' own `ui!` call sites cannot lower to the new core yet —
# so its screens/suites are gated out of new-core builds and reported as
# blocked, never stubbed.
old-core = ["dep:idea-ui", "dep:stack-navigator"]
new-core = [
    "dep:runtime-macros",
    "runtime-macros/new-core",
    "dep:runtime-vocabulary",
    "runtime-vocabulary/robot",
    "dep:runtime-world",
    # idea-ui rides BOTH cores now (P6 SDK retarget): the same
    # Switch/Checkbox/Button screens + suite run same-source on the new
    # core through idea-ui's own `new-core` alias build.
    "dep:idea-ui",
    "idea-ui/new-core",
    "robot-e2e?/new-core",
    "backend-web/new-core",
    # The web host's robot surface: `newcore::start` installs the
    # vocabulary Robot driver env (queries enter the world, actions
    # settle via flush_sync) behind backend-web's `robot` feature —
    # without it the in-app suite's actions stage writes that never
    # commit.
    "backend-web/robot",
    "dep:wasm-bindgen",
]

# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` + the navigators' recorder
# registration so the suite can run over the runtime-server wire too.
sidecar = ["dep:dev-server", "stack-navigator/runtime-server"]

[dependencies]
runtime-core = { workspace = true }
runtime-macros = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
runtime-world = { workspace = true, optional = true }
# PATH dep with `default-features = false` (the documented cargo gotcha:
# the flag is ignored on `workspace = true` lines): idea-ui's `table`
# default is old-core-authored and cannot join a new-core graph, so the
# prim families are re-enabled explicitly. Conformance never renders
# Table, so the old-core build is behavior-identical without it.
idea-ui = { path = "../../../../ui/idea-ui", default-features = false, optional = true, features = [
    "prim-icon", "prim-image", "prim-text-input", "prim-activity",
    "prim-portal", "prim-presence",
] }
icons-lucide = { workspace = true }
stack-navigator = { workspace = true, optional = true }
robot-e2e = { workspace = true, optional = true }
dev-server = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android", target_os = "macos")))'.dependencies]
backend-terminal = { workspace = true }

[package.metadata.idealyst.app]
name      = "Conformance"
bundle_id = "ai.truday.idealyst.conformance"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos"]
