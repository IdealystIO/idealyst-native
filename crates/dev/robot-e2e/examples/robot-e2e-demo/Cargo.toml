[package]
name = "robot-e2e-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Demo of an in-app, Playwright-style E2E test harness built on the framework's Robot API. The app drives its own UI (locate → click/fill → assert) and logs each step to the platform console — one harness, every backend."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[features]
# `robot` compiles in the demo's IN-APP suite (`src/e2e.rs`, which drives
# the `Robot` API directly) and the framework's robot with it. It is a
# default feature because the CLI turns on the framework's robot features
# in a dev build, never this crate's own, and the in-app suite is the
# demo. An app that is only driven from outside (`tests/robot.rs`, the
# MCP) needs no feature of its own: `test_id`, `#[robot_fn]` registration
# and `robot::watch_signal` all compile in every build.
default = ["robot"]
robot = ["runtime-core/robot", "runtime-shared/robot", "idealyst/robot"]

# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server). Pulls `dev-server` so the recorder backend is
# available.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs. An idealyst app IS its binary; there is no generated
# wrapper crate.
idealyst = { workspace = true }
# The author surface, aliased to `runtime_core` at the crate root.
runtime-core = { workspace = true }
# The `ui!`/`#[component]` expansions spell absolute
# `::runtime_vocabulary::glue::…` paths, so this is a direct dep; the
# registration seam is generic over `runtime_scene::Registry<H>`.
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
# `robot` forwards the shared half too (runtime-vocabulary/robot does not),
# which is what gives the bridge transport the Robot assertions ride on.
runtime-shared = { workspace = true }
idea-ui = { workspace = true }
dev-server = { workspace = true, optional = true }

# Host-side E2E suite (`tests/robot.rs`), run by `idealyst test` or `cargo test`.
# A dev-dependency so it never enters the wasm/native app build.
[dev-dependencies]
robot-test = { workspace = true }

[package.metadata.idealyst.app]
name      = "Robot E2E Demo"
bundle_id = "ai.truday.idealyst.robote2edemo"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos", "linux", "windows"]
