[package]
name = "robot-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared, in-app Playwright-style E2E harness built on the framework's Robot API. Provides Page/Locator/expect + a multi-suite runner that narrates every step to the platform console and emits a machine-readable `[E2E-RESULT]` summary for cross-platform automation."
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# The harness is a test-support crate: it always wants the real Robot API
# (find/click/type_text/…), which lives behind `runtime-vocabulary/robot`,
# so it is on unconditionally here. A consuming app still declares its
# OWN `robot` feature so the `ui!` macro emits `test_id` slots in THAT
# crate's context — see the conformance app's Cargo.toml.
runtime-vocabulary = { workspace = true, features = ["robot"] }
# The shared substrate for everything outside the registry: the platform
# logger (`log_info!`/`log_error!`), the scheduler the suite runner paces
# itself with (`after_ms_detached`), the microtask drain `settle()` uses,
# and `ViewportRect` for the layout assertions.
runtime-shared = { workspace = true }
