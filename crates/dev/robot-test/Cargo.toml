[package]
name = "robot-test"
version = "3.1.0"
edition.workspace = true
license.workspace = true
description = "Cross-platform end-to-end tests authored in Rust. A `#[robot_test]` function drives a relay-connected `App` (Playwright-flavoured locate → act → assert) and runs as a standard `#[test]` — the relay makes web, macOS, iOS, and Android apps reachable as the same bridge. Powers `idealyst test`."

[lib]
crate-type = ["rlib"]

[dependencies]
robot-test-macros = { workspace = true }
native-parity = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
# `app.file_picker()`: a queued file's bytes cross the bridge base64.
base64 = "0.22"
# `app.camera().fake_image(path)`: the test image is decoded on the test's side.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# `tests/multi_app.rs`: a real relay with two fake apps behind it.
robot-relay = { path = "../robot-relay" }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
