[package]
name = "capability-coverage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Static capability coverage check: which backends leave a capability-trait method at its default body while other backends implement it. Reads source with syn, so one host checks every backend."

[dependencies]
syn = { workspace = true, features = ["full", "visit"] }
serde = { workspace = true, features = ["derive"] }
toml = "0.8"
