# Capability coverage: every default-bodied `caps::*Ops` method that some
# backend implements must be implemented by each checked backend, or be
# listed here. See `src/lib.rs` for the rule.
#
#   status = "na"   the default is right for that backend (with the reason)
#   status = "gap"  missing; implement it and delete the backend from the list
#
# `cargo run -p capability-coverage` prints the matrix.

caps = "crates/runtime/vocabulary/src/caps"

[[backend]]
name = "web"
src = "crates/backend/web/src"

[[backend]]
name = "ssr"
src = "crates/backend/ssr/src"

[[backend]]
name = "macos"
src = "crates/backend/macos/src"

[[backend]]
name = "ios"
src = "crates/backend/ios/mobile/src"

[[backend]]
name = "android"
src = "crates/backend/android/mobile/src"

[[backend]]
name = "linux"
src = "crates/backend/linux/src"

[[backend]]
name = "windows"
src = "crates/backend/windows/src"

[[backend]]
name = "gpu"
src = "crates/gpu-backend/engine/src"

[[backend]]
name = "terminal"
src = "crates/backend/terminal/src"

[[backend]]
name = "cpu"
src = "crates/backend/cpu/src"

# ===========================================================================
# Not applicable: web / DOM-only hooks. Natives apply styles, text and
# layout directly; these exist for the browser's CSS layer, the JS fast
# paths and SSR hydration.
# ===========================================================================

[[allow]]
method = "BatchOps::*"
backends = ["*"]
except = ["web"]
status = "na"
reason = "web wire batching: natives apply ops directly"

[[allow]]
method = "DocumentOps::*"
backends = ["*"]
except = ["web", "ssr"]
status = "na"
reason = "HTML attributes / raw CSS: DOM only"

[[allow]]
method = "StyleOps::*"
backends = ["*"]
except = ["web", "ssr"]
status = "na"
reason = "CSS-layer hooks (preminted classes, tokens as CSS variables, container contexts, JS class bindings); natives resolve StyleRules per node. Real native StyleOps gaps are listed by exact method below"

[[allow]]
method = "TextOps::*"
backends = ["*"]
except = ["web", "ssr"]
status = "na"
reason = "JS text-binding fast path; natives update text through update_text. Real native TextOps gaps are listed by exact method below"

[[allow]]
method = "LifecycleOps::*"
backends = ["*"]
except = ["web", "ssr"]
status = "na"
reason = "SSR hydration / lazy-chunk annotations. Native layout-pass gaps are listed by exact method below"

[[allow]]
method = "AppEnvOps::set_page_metadata"
backends = ["*"]
except = ["ssr"]
status = "na"
reason = "document <head> metadata is SSR output"

[[allow]]
method = "AppEnvOps::set_scrollbar_theme"
backends = ["*"]
except = ["web", "ssr"]
status = "na"
reason = "CSS scrollbar colors"

[[allow]]
method = "LinkOps::update_link_url"
backends = ["*"]
except = ["web"]
status = "na"
reason = "a link's url is the web href; natives navigate through on_activate"

[[allow]]
method = "A11yOps::dump_accessibility_tree"
backends = ["*"]
except = ["gpu"]
status = "na"
reason = "a self-drawn backend exports its own semantics tree; native toolkits and the DOM own theirs"

[[allow]]
method = "ScrollOps::apply_scroll_view_always_bounce"
backends = ["*"]
except = ["ios"]
status = "na"
reason = "UIScrollView alwaysBounce*: UIKit only"

[[allow]]
method = "ScrollOps::apply_virtualizer_safe_area_inset"
backends = ["*"]
except = ["ios"]
status = "na"
reason = "UICollectionView content inset adjustment: UIKit only"

[[allow]]
method = "ScrollOps::apply_scroll_view_bounces"
backends = ["*"]
except = ["web", "ios"]
status = "na"
reason = "trait docs: the default is right for scrollers that do not overscroll"

[[allow]]
method = "IntrospectionOps::device_frame"
backends = ["*"]
except = ["android"]
status = "na"
reason = "physical-pixel frame for adb input injection; other platforms inject through native_pointer"

[[allow]]
method = "IntrospectionOps::note_introspection_root"
backends = ["*"]
except = ["web", "linux"]
status = "na"
reason = "other backends find the framework boundary from their own node registry"

[[allow]]
method = "PresenceOps::create_presence_placeholder"
backends = ["*"]
except = ["macos"]
status = "na"
reason = "trait docs: override only to pick a different native view class (macOS deep hit-test view)"

[[allow]]
method = "SafeAreaOps::apply_safe_area_padding"
backends = ["macos", "linux", "windows"]
status = "na"
reason = "desktop windows have no safe area"

[[allow]]
method = "SafeAreaOps::apply_scroll_view_safe_area_inset"
backends = ["macos", "linux", "windows"]
status = "na"
reason = "desktop windows have no safe area"

[[allow]]
method = "SafeAreaOps::mark_keyboard_avoiding"
backends = ["macos", "linux", "windows"]
status = "na"
reason = "trait docs: no soft keyboard"

[[allow]]
method = "TextInputOps::update_text_input_keyboard"
backends = ["macos", "linux", "windows"]
status = "na"
reason = "trait docs: no soft keyboard"

[[allow]]
method = "InputOps::claim_touch"
backends = ["macos", "linux", "windows", "gpu"]
status = "na"
reason = "no competing native touch consumers (mouse input; gpu routes its own touches)"

[[allow]]
method = "InputOps::install_hover_handler"
backends = ["ios", "android"]
status = "na"
reason = "touch-first: no hover pointer (StyleOps::attach_states docs record the same call)"

[[allow]]
method = "InputOps::install_wheel_handler"
backends = ["ios", "android"]
status = "na"
reason = "touch-first: trackpad scrolling arrives as a pan"

[[allow]]
method = "IntrospectionOps::capture_screenshot"
backends = ["web"]
status = "na"
reason = "the browser harness (Playwright) takes web screenshots"

[[allow]]
method = "IntrospectionOps::supports_screenshot"
backends = ["web"]
status = "na"
reason = "the browser harness (Playwright) takes web screenshots"

[[allow]]
method = "LifecycleOps::run_layout"
backends = ["web"]
status = "na"
reason = "the browser lays out"

[[allow]]
method = "LifecycleOps::schedule_layout_pass"
backends = ["web"]
status = "na"
reason = "the browser lays out"

[[allow]]
method = "LifecycleOps::annotate_nav_outlet"
backends = ["web"]
status = "na"
reason = "trait docs: SSR marks outlets for hydration; live backends have nothing to annotate"

[[allow]]
method = "LifecycleOps::renders_lazy_chunks"
backends = ["web"]
status = "na"
reason = "only SSR stops lazy boundaries at their placeholder"

[[allow]]
method = "StyleOps::install_theme_palettes"
backends = ["web"]
status = "na"
reason = "trait docs: only static rendering ships inactive palettes; web re-publishes tokens on theme swap"

[[allow]]
method = "DocumentOps::register_raw_css"
backends = ["web"]
status = "gap"
reason = "verify: a client-rendered web app may drop raw CSS that SSR would have shipped"

# ===========================================================================
# Partial backends.
# ===========================================================================

[[allow]]
method = "*"
backends = ["ssr"]
status = "na"
reason = "static HTML render: no input, no updates after render, no handles or introspection. Exceptions are listed by exact method"

[[allow]]
method = "A11yOps::update_accessibility"
backends = ["ssr"]
status = "gap"
reason = "server HTML should carry the ARIA attributes the web backend sets"

[[allow]]
method = "*"
backends = ["terminal"]
status = "gap"
reason = "partial backend, not audited method by method: a new terminal gap does not fail this check until it is"

[[allow]]
method = "*"
backends = ["cpu"]
status = "gap"
reason = "partial backend (software rasterizer), not audited method by method: a new cpu gap does not fail this check until it is"

# ===========================================================================
