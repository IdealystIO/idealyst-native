# newcore-app — P3a integration proof for the `ui!` / `#[component]`
# NEW-core lowering (idea-lite migration): a small but real app —
# nested components with static/reactive/defaulted/children props, local
# signals, a memo, reactive `if`, a keyed `for` with row-local state,
# and event-handler-driven mutations — plus a P3-set primitive demo
# (`build_demo`: overlay / anchored_overlay / presence / flat_list, the
# formerly macro-deferred tags) — whose SOURCE (`src/app.rs`) is
# core-agnostic and compiles against EITHER core:
#
#   cargo test  -p newcore-app --features new-core   # the e2e gate
#   cargo check -p newcore-app --features old-core   # same-source proof
#
# The features are NON-default on purpose: `new-core` forwards to
# `runtime-macros/new-core`, and proc-macro features unify across a
# build graph — a default-on feature here would flip the lowering for
# every ui! consumer in any workspace-wide build (see the feature's
# docs in runtime-macros/Cargo.toml). With no features this crate
# compiles to an empty lib.
[package]
name = "newcore-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Integration example: ui! + #[component] authored app on the new core (idea-lite P3a)."

[features]
# Runtime-v2 defaults flip: the proof crate builds its new-core leg by
# default. Old-core leg: `--no-default-features --features old-core`.
default = ["new-core"]
new-core = [
    "runtime-macros/new-core",
    "dep:runtime-vocabulary",
    # The P5 identity seam: `test_id = ...` in src/app.rs registers into
    # the vocabulary robot registry, and tests/e2e.rs drives the app
    # through `runtime_vocabulary::robot::Robot` (find/click/type_text).
    "runtime-vocabulary/robot",
    "dep:runtime-scene",
    "dep:runtime-world",
    "dep:scene-parity",
    # The alias target for tests/recipes_compile.rs — the dual-core
    # compile gate over the STATIC recipe sources in
    # crates/runtime/shared/recipes/ (see runtime_shared::recipes).
    "dep:runtime-facade",
]
old-core = ["dep:runtime-core"]

[dependencies]
runtime-macros = { workspace = true }
runtime-core = { workspace = true, optional = true }
runtime-facade = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
runtime-scene = { workspace = true, optional = true }
runtime-world = { workspace = true, optional = true }
# The mock-host machinery (FullRecorder + LegacyBridge) the e2e tests
# mount against. A normal (optional) dependency rather than a dev-dep
# because dev-deps can't be optional and the crate must stay empty with
# no features.
scene-parity = { path = "../scene-parity", optional = true }
