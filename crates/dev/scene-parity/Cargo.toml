[package]
name = "scene-parity"
version.workspace = true
edition.workspace = true
license.workspace = true

# P1 exit-gate harness for the idea-lite core migration: a recording
# Backend + scenario suite that pins the EXACT structural-op sequences
# the current walker emits (see README.md). The future `runtime-scene`
# core must reproduce these golden files on the same scenarios.
#
# Dev/test utility crate — nothing shipped depends on it.

[dependencies]
runtime-core = { workspace = true }
# The new-core harness mode: the same scenarios re-targeted at the P1
# scene core, checked against the SAME goldens (modulo the README's
# sanctioned divergences).
runtime-scene = { workspace = true }
runtime-world = { workspace = true }
# P2b full-op gate: the built-in vocabulary's handlers mounted through
# LegacyBridge<FullRecorder>, compared against the old walker on the
# same goldens.
runtime-vocabulary = { workspace = true, features = ["legacy-bridge"] }
# GfxSim's dummy surface provider (graphics lifecycle goldens) — same
# version runtime-core builds its GraphicsSurface contract against.
raw-window-handle = "0.6"
# Navigator parity (old side): the outlet-model swap/stack SDK handlers,
# registered on the FullRecorder via `register_generic` so the walker's
# navigator path drives the REAL backend-neutral handlers.
swap-navigator = { workspace = true }
stack-navigator = { workspace = true }
