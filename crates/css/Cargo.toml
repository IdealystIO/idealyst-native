[package]
name = "css"
version = "2.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The style data model + tokens. Only style TYPES are read (StyleRules,
# enums, Breakpoint), all ungated, so no runtime-shared features are
# needed.
runtime-shared = { path = "../runtime/shared", default-features = false, version = "2.4.0", registry = "idealyst" }
