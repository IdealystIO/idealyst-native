[package]
name = "media-stream"
version = "1.6.0"
edition.workspace = true
license.workspace = true

# A cross-platform, platform-agnostic handle to a live video source — the
# common currency between capture SDKs (`camera`, `screen-recorder`) that
# PRODUCE video and display / processing layers that CONSUME it.
#
# Deliberately thin and GPU-free: a `MediaStream` carries (a) a CPU frame
# tap (normalized RGBA8, for analysis / a lowest-common-denominator display
# / a fallback) and (b) an opaque, type-erased "native source" handle — the
# platform's zero-copy frame source (a web `MediaStream`, an Apple
# `CVPixelBuffer` pool, an Android `SurfaceTexture`) that a same-platform
# display or GPU-compositing layer downcasts. The native pipe never leaks
# into author code: a developer wires `camera -> video` and never names a
# platform type.
#
# This crate intentionally does NOT depend on `wgpu` or the graphics stack.
# A real-time GPU compositor is a LAYER ON TOP that consumes a `MediaStream`
# (importing frames as textures, zero-copy via the native source, or via the
# CPU tap as a fallback). The only guarantee made here is that such a
# consumer is possible — the abstraction doesn't preclude it.

[dependencies]

# Native `screenshot()` bridges the one-shot frame out of the `subscribe`
# callback (a capture-thread `Send` closure) to the awaiting caller.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The web legs — the capture clock's `Date.now()`, `screenshot()`'s
# `<video>` + 2D `getImageData`, and the synthetic-`AudioStream` →
# `MediaStreamTrack` WebAudio bridge (`audio_web_bridge`) — go through
# web-glue, the framework-owned JS boundary
# (docs/proposals/own-web-bindings.md). A web stream's `native_source` is a
# `web_glue::dom::MediaStream`.
web-glue = { workspace = true }

# Browser tests (`tests/web_media_stream.rs`) — run with
# `cargo test -p media-stream --target wasm32-unknown-unknown` (the workspace
# runner supplies web-glue's JS).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# src/apple_surface.rs calls CoreFoundation (`CFRetain`/`CFRelease`).
# iOS links the Rust code as a staticlib inside Xcode/swiftc, which drops
# `#[link(kind = "framework")]`; the iOS run tool links what is declared
# here (`tests/sdk_framework_declarations.rs` in run-ios checks the two match).
[package.metadata.idealyst.ios]
frameworks = ["CoreFoundation"]
