[package]
name = "toolbar-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Smoke-test binary for the `toolbar` SDK. Boots a host-appkit window with an NSToolbar attached, demonstrating the reactive items + click handler shape end-to-end."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

# Plain bin — runs via `cargo run -p toolbar-demo`. No app bundle,
# no Info.plist; NSApp is activated via `setActivationPolicy` in the
# host so the window shows up regardless. For a "real" macOS app
# you'd go through `idealyst dev --macos` (auto-bundles); this is
# just a developer-loop check that the SDK + host hook + macOS
# backend all line up.

[[bin]]
name = "toolbar-demo"
path = "src/main.rs"

[dependencies]
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/main.rs). `runtime-scene` supplies `IntoElement` (the trait that turns
# the SDK's `ToolbarBound` into the scene `Element` `run_with` builds).
runtime-core = { workspace = true }
runtime-scene = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
host-appkit = { workspace = true }
toolbar = { workspace = true }
