[package]
name = "offload-macro"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# The `#[offload::job]` attribute: a no-op marker on every target (a job is
# dispatched through the function pointer `offload::handle!` captures; on web
# the pointer's table index reaches a Web Worker running the same module).
# Attribute macros must be proc-macros, hence this crate.

[lib]
proc-macro = true

[dependencies]
