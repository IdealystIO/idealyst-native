[package]
name = "camera-preview-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camera → Video demo — the camera SDK yields a MediaStream and the video SDK displays it. On web the stream's native_source (a web_sys::MediaStream) is attached as <video> srcObject (zero-copy). Exercises the phase-2 MediaStream consumer path end to end."

[lib]
crate-type = ["rlib"]

[features]
sidecar = ["dep:dev-server"]

[dependencies]
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `async-driver` for the `driver::spawn_async` camera open.
# `runtime-vocabulary` for the `ui!` emission's absolute
# `::runtime_vocabulary::glue::…` paths AND the `caps::ExternalOps` /
# `style_attach::StyleServices` bounds the native registration seam names;
# `runtime-scene` for the `Registry` the seam takes.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
camera = { workspace = true }
video = { workspace = true }
dev-server = { workspace = true, optional = true }

# Web's `video::register` is registry-CONCRETE (`Registry<WebBackend>`), so
# the wasm32 leg of `register_scene_extensions` needs the backend's `Host`
# impl. The native leg is registry-generic and type-dispatches inside the
# SDK, so no per-platform backend dep is needed there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[package.metadata.idealyst.app]
name      = "Camera Preview"
bundle_id = "ai.truday.idealyst.camerapreview"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos"]

[package.metadata.idealyst.app.permissions]
camera = "Camera Preview shows your camera feed through the video component."
