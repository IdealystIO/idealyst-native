[package]
name = "video"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `Video` SDK — one crate, cfg-gated per-platform player
# modules. Mirrors the `webview` SDK's single-crate layout (see
# `crates/sdk/client/webview/Cargo.toml` for the same rationale).
#
# # Platform coverage
#
# - Web: `<video>` element.
# - macOS / iOS: layer-backed host view — `AVPlayerLayer` sublayer for
#   the URL path, per-frame CGImage/IOSurface `contents` for the live
#   `MediaStream` path.
# - Android: `FrameLayout` host filled by the Kotlin shim with a
#   `VideoView` (URL) or an `ImageView` fed RGBA frames (stream).
# - Other targets (SSR, wgpu desktop, terminal, …): the framework's
#   External placeholder.
#
# `register` type-dispatches ONCE, by registry type (the toolbar SDK's
# pattern) — a cfg split cannot express it, because `target_os = "macos"`
# is also true for a macOS SSG build.
description = "Third-party Video SDK — <video> on web, AVPlayer on Apple, VideoView on Android."

[dependencies]
# A `Video` can display a live `MediaStream` (from `camera` /
# `screen-recorder`), not just a URL `src`.
media-stream = { workspace = true }
# The scene registry + the vocabulary caps the handlers drive
# (`ExternalOps::create_external` placeholder path) + `style_attach` for
# the author-style channel + `runtime_world::effect` for the
# reactive-source binding (and `scoped_scheduling::raf_loop_scoped` for
# the native frame pumps).
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-world = { workspace = true }
# The permanent shared substrate: `Ref` (the handle slot `.bind` fills),
# `accessibility`, the style data model.
runtime-shared = { workspace = true }

[dev-dependencies]
# tests/scene.rs mounts `Video(...)` through the scene registry
# end-to-end on the shared host-mock recording substrate.
host-mock = { workspace = true }

# The wasm32 handler is `WebBackend`-concrete (`<video>` DOM has no
# caps-trait expression), so `Registry<WebBackend>` needs the backend's
# `Host` impl.
#
# COORDINATION (runtime-v2 deletion wave): `` is
# still required because the backends' `Host` + caps impls are behind
# that feature. Drop the forward once the backend crates make them
# unconditional.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaStream",
    "Node",
] }
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
backend-android-mobile = { workspace = true }
backend-android-core = { workspace = true }
jni = "0.21"

# The Kotlin shim that hosts the VideoView (URL) / ImageView (live stream)
# children and converts RGBA frames to a Bitmap. `idealyst run android`
# discovers + compiles it from here.
[package.metadata.idealyst.android]
runtime_kotlin = ["runtime/kotlin/io/idealyst/video/RustVideoFrameSink.kt"]

[target.'cfg(target_os = "ios")'.dependencies]
backend-ios-mobile = { workspace = true }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSURL",
    "NSNotification",
    "NSGeometry",
] }
objc2-ui-kit = { version = "0.2", features = [
    "UIView",
    "UIResponder",
] }

# macOS (AppKit): both the live `MediaStream` display path (layer-backed NSView,
# CALayer `contents` ← per-frame CGImage / IOSurface) AND the AVPlayer/URL path
# (an `AVPlayerLayer` sublayer), mirroring iOS — so a recorded-file preview
# (`MediaContent::Url`) plays. `block2` drives the loop-playback notification
# observer; `AVFoundation` is force-linked in `macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
backend-macos = { workspace = true }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSURL",
    "NSNotification",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",
    "NSResponder",
] }
