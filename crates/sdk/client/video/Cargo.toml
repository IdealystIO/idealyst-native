[package]
name = "video"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `Video` SDK — one crate, cfg-gated per-backend impl
# modules. Mirrors the `webview` SDK's single-crate layout (see
# `crates/sdk/webview/Cargo.toml` for the same rationale).
#
# # Backend coverage
#
# - Web: `<video>` element.
# - iOS: `AVPlayerLayer` over a `UIView` host.
# - Android: `android.widget.VideoView`.
# - Other targets (wgpu desktop, terminal, etc.): the framework's
#   `External` placeholder. Apps that want video on those targets ship
#   their own SDK module — the `register_external` surface is open.

[features]
# Runtime-v2 defaults flip: the new-core leg is the default surface;
# the old-core leg is the opt-in (`--no-default-features` — in-repo
# consumers ride the workspace dep spec, which pins defaults off and
# selects a core explicitly per graph).
default = ["new-core"]
# Old-core marker for uniform `--no-default-features --features
# old-core` invocations (the old-core deps are unconditional).
old-core = []
# Idea-lite migration: re-express the SAME authored surface
# (`Video(VideoProps { .. }).bind(v)` + a bootstrap `register`) over the
# scene registry — the new core's unified primitive==external contract.
# Default-off and MUTUALLY EXCLUSIVE with the old-core surface (the two
# define the same public names — one core per build, mirroring the
# runtime-macros/new-core build-graph-wide switch; a consuming app crate
# forwards this from its own new-core feature). The old-core modules are
# byte-untouched under the default build. `backend-web/new-core` is
# needed because the wasm32 handler is `WebBackend`-concrete (`<video>`
# DOM has no caps-trait expression) and `Registry<WebBackend>` needs the
# backend's new-core `Host` impl. The native players (iOS/macOS/Android)
# are old-core-only for now — see `src/newcore.rs`.
new-core = [
    "dep:runtime-vocabulary",
    "dep:runtime-scene",
    "dep:runtime-world",
    "backend-web/new-core",
]

[dependencies]
runtime-core = { workspace = true }
# A `Video` can display a live `MediaStream` (from `camera` /
# `screen-recorder`), not just a URL `src`.
media-stream = { workspace = true }
# New-core surface (feature `new-core`): the scene registry + the
# vocabulary caps the handlers drive (`ExternalOps::create_external`
# placeholder path) + `style_attach` for the author-style channel +
# `runtime_world::effect` for the reactive-source binding.
runtime-scene = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
runtime-world = { workspace = true, optional = true }
# Self-registration of the per-backend Video external at construction.
inventory = "0.3"

[dev-dependencies]
# tests/newcore.rs (`--features new-core`) mounts `Video(...)` through
# the scene registry end-to-end on the shared host-mock recording
# substrate; tests/oldcore.rs runs on the default (old-core) surface.
host-mock = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "MediaStream",
    "Node",
] }
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
backend-android-mobile = { workspace = true }
backend-android-core = { workspace = true }
jni = "0.21"

# The Kotlin shim that hosts the VideoView (URL) / ImageView (live stream)
# children and converts RGBA frames to a Bitmap. `idealyst run android`
# discovers + compiles it from here.
[package.metadata.idealyst.android]
runtime_kotlin = ["runtime/kotlin/io/idealyst/video/RustVideoFrameSink.kt"]

[target.'cfg(target_os = "ios")'.dependencies]
backend-ios-mobile = { workspace = true }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSURL",
    "NSNotification",
    "NSGeometry",
] }
objc2-ui-kit = { version = "0.2", features = [
    "UIView",
    "UIResponder",
] }

# macOS (AppKit): both the live `MediaStream` display path (layer-backed NSView,
# CALayer `contents` ← per-frame CGImage / IOSurface) AND the AVPlayer/URL path
# (an `AVPlayerLayer` sublayer), mirroring iOS — so a recorded-file preview
# (`MediaContent::Url`) plays. `block2` drives the loop-playback notification
# observer; `AVFoundation` is force-linked in `macos.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
backend-macos = { workspace = true }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSURL",
    "NSNotification",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",
    "NSResponder",
] }
