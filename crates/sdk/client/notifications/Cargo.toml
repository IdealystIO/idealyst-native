[package]
name = "notifications"
version = "8.0.0"
edition.workspace = true
license.workspace = true

# Cross-platform LOCAL notifications and their responses (+ a raw push-token
# seam).
#
# Show a notification now or after a delay — with action buttons, a reply
# field, a priority, a sound choice, a group and an image — update/cancel it
# by id, hear what the user did with it (`on_response`), and read the
# device's push token for *app-owned* remote delivery. One author API, every
# backend, identical observable behavior; per-platform hooks hand over the
# platform's own notification object for everything else:
#
#   - web (wasm32)        : the `Notification` Web API (immediate)
#   - iOS / macOS / tvOS  : UNUserNotificationCenter + its delegate (objc2)
#   - Android             : NotificationManager + channels + AlarmManager,
#                           with the Kotlin shim under runtime/kotlin (JNI)
#   - Windows             : WinRT toasts
#   - Linux               : org.freedesktop.Notifications over D-Bus (zbus)
#
# Authorization is NOT re-implemented here — it goes through the `permissions`
# crate (`Permission::Notifications`). This crate declares the manifest
# capability; remote push needs deeper build wiring (APNs entitlement / FCM
# project / a service worker) which is a documented seam, not built here.

# Capability requirement. The CLI injects the matching manifest entry per
# target: Android `android.permission.POST_NOTIFICATIONS` (API 33+); iOS/macOS
# need no plist key (runtime prompt via `permissions`). Remote push additionally
# needs the iOS `aps-environment` entitlement + a `remote-notification`
# background mode — a deeper build seam, declared by the app, not here.
[package.metadata.idealyst]
capabilities = ["notifications"]

# The Android shim (taps, actions, dismissals, scheduled alarms) and the
# trampoline activity + receiver it needs, declared inside <application>.
[package.metadata.idealyst.android]
runtime_kotlin = ["runtime/kotlin/io/idealyst/notifications/RustNotifications.kt"]
manifest_application = ["manifest/application.xml"]

# Web: the handlers for clicks, action buttons and dismissals of
# notifications shown through the app's service worker (src/web.rs), composed
# into the app's `idealyst-sw.js` by the web build (docs/service-worker.md).
[package.metadata.idealyst.web]
service_worker = ["sw/notifications.js"]

# iOS links the Rust code as a staticlib inside Xcode/swiftc, which drops
# `#[link(kind = "framework")]`; the iOS run tool links what is declared here.
[package.metadata.idealyst.ios]
frameworks = ["UserNotifications"]

[dependencies]
# The response inbox: platform callbacks (any thread) wake a UI-thread task
# waiting on this channel (src/response.rs); also the one-shot completion
# channels of the Apple backend.
async-channel = "2"
# Runtime grant flow (status / request) — the shared substrate; we never call
# OS permission APIs directly.
permissions = { workspace = true }
# Recipes + the `ui!` / primitives they compile against.
# The author surface, aliased to `runtime_core` at the crate root (see
# src/lib.rs). `runtime-vocabulary` is a direct dep because the `ui!`
# emission inside the recipes spells absolute `::runtime_vocabulary::glue::…`
# paths.
# `async-driver`: the response pump is a task on the host's executor
# (`driver::spawn_detached`, src/response.rs).
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }

# Web (wasm): the Notification Web API through a web-glue binding
# (`src/web.rs`). Web-push is a service-worker seam that reports
# `NotSupported` and binds nothing.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-glue = { workspace = true }

# Browser tests (`tests/web_notify.rs`) — run with
# `cargo test -p notifications --target wasm32-unknown-unknown` (the
# workspace runner supplies web-glue's JS; `wasm-pack test` cannot load it).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# iOS / macOS / tvOS: UNUserNotificationCenter via objc2.
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSArray", "NSDictionary", "NSObject"] }
# Completion-handler blocks (request added, categories applied) and the
# delegate's completion parameters.
block2 = "0.5"

# Android: NotificationManager + NotificationChannel via JNI on the host context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Linux desktop: the session-bus `org.freedesktop.Notifications` service via
# pure-Rust `zbus`. Version matched to the tree's existing lock entry (pulled
# in transitively by `ashpd`) so no new version is introduced. Default
# features keep zbus's runtime-agnostic `async-io` executor, so the async
# surface awaits cleanly under whatever runtime the caller drives.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "4"

[features]
# Compile the `recipe!` usage examples (feeds MCP / autodocs). Off in
# production builds, so recipes cost nothing there. Forwards `async-driver`
# so the recipes can use the real `runtime_core::driver::spawn_async`
# pattern (the canonical way author code drives `notify(...).await` from a
# button press).
catalog = ["runtime-core/catalog", "runtime-core/async-driver"]

# Windows: WinRT toasts. `backend-windows` supplies the app's
# AppUserModelID (`app_identity`), which toasts are attributed to.
[target.'cfg(all(target_os = "windows", not(target_arch = "wasm32")))'.dependencies]
backend-windows = { workspace = true }
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation", "Foundation_Collections"] }


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
pollster = "0.4"
# The robot test controls (`src/robot_controls.rs`) compile only in robot
# builds; the unit tests turn the vocabulary's `robot` on to reach them.
runtime-vocabulary = { workspace = true, features = ["robot"] }
