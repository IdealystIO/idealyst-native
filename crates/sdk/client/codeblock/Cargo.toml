[package]
name = "codeblock"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `CodeBlock` primitive — a single backend node rendering
# a flat sequence of `(text, color)` runs. Carved out of
# `runtime-core` after a measurement showed the equivalent
# composition (`View` + `Repeat<styled-View-with-Text>`) generates
# 100-300× more backend ops per re-render than the single-node
# primitive, even with the batched-Repeat fast path.
#
# Single-node throughout: web emits one `<pre>` with child `<span>`s;
# Android renders one `RustCodeBlock` (HorizontalScrollView + TextView
# + SpannableString); iOS renders one UIScrollView wrapping an
# inset-honoring label with NSAttributedString; macOS mirrors iOS with
# NSScrollView + NSTextField. Per-target `register` functions live in
# `lib.rs` behind `#[cfg(...)]`. Padding is author-driven (see the
# lib.rs module doc) — handlers bake none in.

[dependencies]
runtime-core = { workspace = true }
# Self-registration of the per-backend external handler at construction.
inventory = "0.3"
# Wire serde for `CodeBlockProps` so a `code_block(...)` external renders
# over the runtime-server wire (recorder serializes the spans; the device
# deserializes them back + dispatches to its real per-backend handler).
serde_json = { workspace = true }

# Web handler self-registers a `WebExternalRegistrar` (the generic
# `register` monomorphized to `WebBackend`), so the web backend must be a
# named dependency on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

# Android handler depends on the Android backend's `register_external`
# inherent method plus its JNI surface for constructing the
# `RustCodeBlock` view and feeding it a SpannableString. The dep is
# target-gated so non-Android targets don't try to link the Android
# backend.
[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
jni = "0.21"
log = "0.4"

# iOS handler depends on the iOS backend + core for `IosBackend` /
# `IosNode` / `color_to_uicolor`, plus objc2 for the obj-c message
# sends that build the NSAttributedString and UILabel.
[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
backend-ios-core = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSString",
    "NSRange",
] }
objc2-ui-kit = { version = "0.2", features = ["UIScrollView", "UILabel"] }

# Linux (GTK4) handler: one `gtk::Label` whose per-token foreground colors
# are carried as `pango::AttrColor` ranges on a single `pango::AttrList`
# (the GTK analogue of iOS/macOS `NSAttributedString`). Depends on the Linux
# backend's `register_external` / `register_external_view` inherent methods
# plus `gtk4` for the Label + Pango attributes. Target-gated so non-Linux
# targets don't link GTK.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }
gtk4 = { version = "0.9", features = ["v4_12"] }
runtime-core = { workspace = true }

# Windows handler: one painted colored-runs leaf via the Windows
# backend's `create_colored_code_leaf` extension point (the painted-
# scene analogue of an attributed-string label — the backend measures
# the runs in the platform monospace font and its GDI+ scene painter
# draws them). Wrapped in a `create_view` node so the author's
# `.with_style` box styling (background, radius, padding) lands like
# every other backend.
[target.'cfg(all(target_os = "windows", not(target_arch = "wasm32")))'.dependencies]
backend-windows = { workspace = true }

# macOS handler: one `NSScrollView` (horizontal) wrapping an `NSTextField`
# label whose `attributedStringValue` carries per-run `NSColor` ranges. Mirrors
# the iOS handler. objc2 versions match `backend-macos` so the `NSView` type in
# `MacosNode::View(...)` is identical across the crate boundary.
[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSString",
    "NSRange",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSScrollView",
    "NSTextField",
    "NSText",
    "NSControl",
    "NSCell",
    "NSActionCell",
    "NSColor",
    "NSFont",
    "NSView",
    "NSResponder",
] }

