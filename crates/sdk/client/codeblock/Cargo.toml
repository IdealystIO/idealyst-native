[package]
name = "codeblock"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `CodeBlock` primitive — a single backend node rendering
# a flat sequence of `(text, color)` runs. Carved out of the framework
# core after a measurement showed the equivalent composition
# (`view` + `for`-over-styled-`text`) generates 100-300× more backend
# ops per re-render than the single-node primitive, even with the
# batched-repeat fast path.
#
# Single-node on the platforms with a real handler: Android renders one
# `RustCodeBlock` (HorizontalScrollView + TextView + SpannableString);
# iOS renders one UIScrollView wrapping an inset-honoring label with
# NSAttributedString; macOS mirrors iOS with NSScrollView +
# NSTextField. Every other caps-complete host (web, SSR, terminal, gpu,
# host-mock) gets the portable `<pre>`/span handler. `register`
# type-dispatches ONCE, by registry type — a cfg split cannot express
# it, because `target_os = "macos"` is also true for a macOS SSG build.
# Padding is author-driven (see the lib.rs module doc); handlers bake
# none in.
description = "Read-only colored-text (code) panel primitive — one native node per block."

[dependencies]
# The scene registry (`item` + `MountCx`/`Registry`) + the vocabulary
# caps the portable mount handler drives (`DocumentOps::create_element`,
# `TextOps::create_text`, `StyleOps::apply_style`) + `style_attach` for
# the author-style channel.
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
# The permanent shared substrate: `Color` / `StyleRules` / `Tokenized` /
# `accessibility`, plus the canonical color parser the macOS handler
# resolves author colors through.
runtime-shared = { workspace = true }
# `code_editor` is reactive: it holds the buffer `Signal<String>`, reads
# it from the decorated layer's update effect, and accepts an optional
# `ReadSignal<Vec<Decoration>>` for async decoration producers.
runtime-world = { workspace = true }

# tests/scene.rs mounts `code_block(...)` / `code_editor(...)` through
# the scene registry end-to-end on the shared host-mock recording
# substrate.
[dev-dependencies]
host-mock = { workspace = true }

# No wasm32-specific dependency: the web arm IS the portable
# caps-generic handler, so `register` needs no backend-web dep there.

# Android handler needs the Android backend's JNI surface for
# constructing the `RustCodeBlock` view and feeding it a
# SpannableString, plus its `Host` impl so `Registry<AndroidBackend>`
# resolves. Target-gated so non-Android targets don't link it.
#
# COORDINATION (runtime-v2 deletion wave): `` is
# still required because the backends' `Host` + caps impls are behind
# that feature. Drop the forward once the backend crates make them
# unconditional.
[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
jni = "0.21"
log = "0.4"

# iOS handler depends on the iOS backend for `IosBackend` / `IosNode` /
# `color_to_uicolor`, plus objc2 for the obj-c message sends that build
# the NSAttributedString and UILabel.
[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
backend-ios-core = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSString",
    "NSRange",
] }
objc2-ui-kit = { version = "0.2", features = ["UIScrollView", "UILabel"] }

# Linux (GTK4) handler: one `gtk::Label` whose per-token foreground colors
# are carried as `pango::AttrColor` ranges on a single `pango::AttrList`
# (the GTK analogue of iOS/macOS `NSAttributedString`). Depends on the Linux
# backend's `register_external` / `register_external_view` inherent methods
# plus `gtk4` for the Label + Pango attributes. Target-gated so non-Linux
# targets don't link GTK.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }
gtk4 = { version = "0.9", features = ["v4_12"] }
runtime-core = { workspace = true }

# Windows handler: one painted colored-runs leaf via the Windows
# backend's `create_colored_code_leaf` extension point (the painted-
# scene analogue of an attributed-string label — the backend measures
# the runs in the platform monospace font and its GDI+ scene painter
# draws them). Wrapped in a `create_view` node so the author's
# `.with_style` box styling (background, radius, padding) lands like
# every other backend.
[target.'cfg(all(target_os = "windows", not(target_arch = "wasm32")))'.dependencies]
backend-windows = { workspace = true }

# macOS handler: one `NSScrollView` (horizontal) wrapping an `NSTextField`
# label whose `attributedStringValue` carries per-run `NSColor` ranges. Mirrors
# the iOS handler. objc2 versions match `backend-macos` so the `NSView` type in
# `MacosNode::View(...)` is identical across the crate boundary.
[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSString",
    "NSRange",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSScrollView",
    "NSTextField",
    "NSText",
    "NSControl",
    "NSCell",
    "NSActionCell",
    "NSColor",
    "NSFont",
    "NSView",
    "NSResponder",
] }
