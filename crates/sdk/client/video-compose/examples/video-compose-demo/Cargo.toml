[package]
name = "video-compose-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Video compositing demo — the camera SDK yields an input MediaStream; video-compose overlays a watermark + drawn label and emits a NEW output MediaStream. Two live previews sit side by side: the untouched input and the composited output, so the 'ops live only on the product' guarantee is visible. A button drives the watermark opacity reactively."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs. An idealyst app IS its binary; there is no generated
# wrapper crate.
idealyst = { workspace = true }
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `async-driver` for the `driver::spawn_async` camera open.
# `runtime-vocabulary` for the `ui!` emission's absolute
# `::runtime_vocabulary::glue::…` paths AND the `caps::ExternalOps` /
# `style_attach::StyleServices` bounds the native registration seam names;
# `runtime-scene` for the `Registry` the seam takes.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
camera = { workspace = true }
video = { workspace = true }
media-stream = { workspace = true }
canvas-core = { workspace = true }
video-compose = { workspace = true }

[package.metadata.idealyst.app]
name      = "Video Compose"
bundle_id = "ai.truday.idealyst.videocompose"
version   = "0.0.1"
targets   = ["macos", "web", "ios", "android"]

[package.metadata.idealyst.app.permissions]
camera = "Video Compose overlays a watermark on your camera feed."
