[package]
name = "webview"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `WebView` SDK — one crate, cfg-gated per-backend glue.
# Demonstrates the single-crate variant of the third-party primitive
# pattern (as opposed to the multi-crate maps SDK split).
#
# Why one crate: this SDK has a single owner and ships every backend
# from the same release. Cargo's `[target.'cfg(...)'.dependencies]`
# handles per-target deps cleanly, so the multi-crate split (umbrella
# + per-platform leaves) buys nothing here. The maps SDK split was
# justifiable as a proof-of-concept; this is the simpler model future
# SDKs should follow unless they genuinely have independent owners
# per backend.
#
# # Android Kotlin contributions
#
# When an Android renderer lands and grows a `WebViewClient` shim (for
# `onPageFinished`/`onReceivedError`) or a `@JavascriptInterface`
# bridge (for `postMessage`), declare the source files under
# `[package.metadata.idealyst.android]` and they'll get picked up
# automatically by `idealyst run android`. The `run-android` CLI's
# Kotlin/Java discovery walks `cargo metadata` against the wrapper
# manifest and stages every declared file alongside the framework's
# own runtime sources.

[dependencies]
# The scene registry + the vocabulary caps the handlers drive
# (`ExternalOps::create_external` placeholder path) + `style_attach` for
# the author-style channel + `runtime_world::effect` for the
# reactive-URL binding. `runtime-shared` supplies `Ref` and
# `accessibility::AccessibilityProps` (the permanent substrate types).
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-world = { workspace = true }

[dev-dependencies]
# tests/webview.rs mounts `WebView(...)` through the scene registry
# end-to-end on the shared host-mock recording substrate.
host-mock = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm32 handler is `WebBackend`-concrete (the `<iframe>` DOM has no
# caps-trait expression) so `Registry<WebBackend>` needs the backend's
# `Host` impl — and the DOM event listeners must call
# `backend_web::newcore::schedule_flush` after author callbacks.
backend-web = { workspace = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlIFrameElement",
    "Window",
    "MessageEvent",
    "EventTarget",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
