[package]
name = "connectivity"
version = "1.7.0"
edition.workspace = true
license.workspace = true

# Cross-platform network reachability.
#
# Reports whether the device currently has network access and over what
# transport (wifi / cellular / ethernet), plus notifies on change. One small
# author API — `current()` for a synchronous snapshot and `watch(cb)` for a
# change subscription whose returned guard unregisters on drop — maps to each
# platform's native reachability monitor:
#   - web      : `navigator.onLine` + `online`/`offline` window events,
#                `navigator.connection` for the transport hint.
#   - iOS/macOS: `NWPathMonitor` (Network framework).
#   - Android  : `ConnectivityManager` (getActiveNetwork + capabilities;
#                registerDefaultNetworkCallback).
#
# Reachability + coarse transport only. Bandwidth, metered/expensive flags,
# and a reactive `Signal` binding are deliberately later layers.

[package.metadata.idealyst]
# Knowing the network's reachability/transport needs a permission only on
# Android (`ACCESS_NETWORK_STATE`). iOS/macOS/web need none — the CLI maps
# this capability per platform.
capabilities = ["network_state"]

# `NWPathMonitor` (src/apple.rs) lives in the Network framework. The
# `#[link]` there covers macOS (rustc links the binary) but not iOS: the app
# links the Rust code as a staticlib inside Xcode/swiftc, which drops it, and
# the device link failed with undefined `_nw_path_monitor_*`. The iOS run
# tool links what is declared here (`tests/sdk_framework_declarations.rs` in
# run-ios checks every SDK).
[package.metadata.idealyst.ios]
frameworks = ["Network"]

[features]
# Compile-checked usage recipes for the catalog / MCP / docs surface. Off in
# production builds, so recipes cost nothing there.
catalog = ["runtime-core/catalog"]

[dependencies]
# Used by the recipe `ui!` examples (and the recipe! macro). With `catalog`
# off the recipes expand to nothing, but the dep stays present for the macro.
# The author surface, aliased to `runtime_core` at the crate root (see
# src/lib.rs). `runtime-vocabulary` is a direct dep because the `ui!`
# emission inside the recipes spells absolute `::runtime_vocabulary::glue::…`
# paths.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }

# Web (wasm): navigator.onLine + online/offline events + NetworkInformation,
# through web-glue bindings (`src/web.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-glue = { workspace = true }

# Browser tests (`tests/web_watch.rs`) — run with
# `cargo test -p connectivity --target wasm32-unknown-unknown` (the
# workspace runner supplies web-glue's JS; `wasm-pack test` cannot load it).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# iOS / macOS / tvOS: NWPathMonitor via the Network framework (objc2 runtime).
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos"))'.dependencies]
objc2 = "0.5"
block2 = "0.5"

# Android: ConnectivityManager via JNI on the host Activity context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Linux (desktop): NetworkManager over the system D-Bus. Pure-Rust async `zbus`
# with the `async-io` backend (same choice as the `credentials` crate) — no
# `libdbus` C dependency, builds without system headers. `futures-lite` drives
# the one-shot `block_on` + the property-change stream select; `async-channel`
# is the watcher-thread shutdown signal dropped by the subscription guard.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4.4", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-channel = "2"
