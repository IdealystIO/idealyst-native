[package]
name = "canvas-vello"
version = "2.0.0"
edition.workspace = true
license.workspace = true

# `canvas-vello` — the GPU renderer for the `canvas` SDK. Renders the
# same `canvas_core::Scene` with `vello` (GPU compute 2D) onto the
# framework's `graphics` primitive surface via `wgpu`.
#
# The app selects this renderer over `canvas-native` by passing
# `canvas_vello::register` to the boot entry's registry seam (it installs a
# scene handler for `canvas_core::CanvasPrim`; last registration wins).
#
# vello requires compute shaders (Metal / Vulkan / DX12 / WebGPU). On native
# backends that's always available. On WEB it renders over wgpu's WebGPU backend
# (wgpu 29 vendors its WebGPU bindings, so no `--cfg=web_sys_unstable_apis`
# needed) — but WebGPU isn't universal, so `render_web.rs` decides per canvas at
# runtime: a headless probe in `on_ready` commits the canvas to webgpu+vello or
# falls back to Canvas2D (`canvas-native`'s rasterizer) on the same element. One
# generic `register<B>` covers every backend because the GPU surface comes from
# `Backend::create_graphics`.

[features]
# On by default so text-drawing canvases keep working. Turn OFF
# (`default-features = false`) for a canvas that draws no text: it drops vello's
# glyph pipeline and its font stack (skrifa / read-fonts, ~hundreds of KB of
# code + data that otherwise strands in the web bundle even when the renderer is
# code-split). A `DrawOp::Glyphs` run is a no-op with this off.
default = ["glyphs"]
glyphs = []
# `rasterize_cpu`: draw a canvas scene with vello_cpu (pure Rust, compiles to
# wasm with SIMD) for GPUs vello's compute pipeline can't run on. Pulled in by
# `canvas3d-wgpu` for its overlay on WebGL2 / simulators; ~130 KB brotli on web.
cpu = ["dep:vello_cpu"]

[dependencies]
# The scene registry the renderer installs into, the graphics + style caps
# it drives, `runtime_world::effect` for the reactive repaint, and
# `runtime-shared` for the graphics event/surface vocabulary + the detached
# retry timer.
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-world = { workspace = true }
canvas-core = { workspace = true }
# Self-capture: read rendered frames back into the app's `MediaStream` via the
# `CanvasProps.capture` `FrameWriter`. Thin, GPU-free currency crate.
media-stream = { workspace = true }
# CPU rasterizer behind the `cpu` feature. Same peniko 0.6 / kurbo 0.13 as
# vello 0.9, so the encoder's conversions are shared. No multithreading (wasm
# main thread; overlays are small).
vello_cpu = { version = "0.3", optional = true, default-features = false, features = ["std", "u8_pipeline"] }
# Surface bring-up, frame target, present blit and shared compositor (the
# machinery this renderer shares with canvas3d-wgpu).
gpu-surface = { workspace = true }
log = "0.4"

# vello/wgpu's Metal backend pulls `objc2-foundation 0.3` (the objc2 0.6-gen),
# the framework's Apple backends use `objc2-foundation 0.2` (0.5-gen). These
# COEXIST in one binary — verified by spike: vello compiles AND links into a
# macOS `.app` alongside `backend-macos`, because none of the objc2 framework
# crates carry a `links` key (only the shared `objc-sys` does, with a versioned
# name) and `canvas-vello` reaches the GPU via `raw-window-handle` (raw ptrs),
# never crossing objc2 types with the backend. So vello is enabled on macOS AND
# iOS (GPU canvas via Metal — same objc2-coexistence trick; iOS uses host Metal
# which has f16/compute). Web uses wgpu's WebGPU backend (see the wasm32 block
# below). Same wgpu major (29) the gpu-backend uses; vello 0.9 pins it too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello = "0.9"
wgpu = "29"
pollster = "0.4"

# Linux (GTK4): the GL-context adoption and present live in `gpu-surface`. This
# crate's own Linux deps are for the zero-copy capture path below. wgpu 29's
# `default` features include `gles`; the explicit feature is belt-and-suspenders.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "29", features = ["gles"] }
wgpu-hal = { version = "29", features = ["gles"] }
# Zero-copy GPU capture on Linux (the dma-buf analog of macOS's IOSurface path):
# export the vello GL render target as a dma-buf via `EGL_MESA_image_dma_buf_export`
# and publish it as the stream's native source (no per-frame CPU readback). wgpu's
# public API doesn't expose the raw GL texture name, so `native_capture_linux`
# reaches through `wgpu-hal`'s GLES `TextureInner::Texture { raw: glow::Texture }`.
# `glow` names that type (it's `wgpu-hal 29`'s own glow major, 0.17 — must match so
# the `TextureInner` variant's `raw` field is the same `NativeTexture`). EGL entry
# points are resolved through the GL proc-address loader (epoxy), not a separate
# EGL link — see `native_capture_linux.rs`.
glow = "0.17"
# `dlopen`/`dlsym` libepoxy to read its `epoxy_eglGetProcAddress` dispatch pointer
# (the SAME loader `backend-linux`'s `gl_loader` uses), so the EGL export entry
# points come from epoxy, not a separate `libEGL` link. libepoxy is already mapped
# in the process (GTK links it); this just bumps its refcount.
libc = "0.2"

# Web (wasm32): vello over wgpu's **WebGPU** backend. `default-features = false,
# features = ["webgpu", "wgsl"]` selects the browser WebGPU path (NOT webgl —
# vello needs compute shaders, which WebGL can't do; where WebGPU is absent the
# renderer falls back to Canvas2D, not webgl). The async bring-up (probe before
# claiming the canvas, rAF pacing) lives in `gpu-surface`. `canvas-native` is
# the Canvas2D fallback delegate (its `make_2d_rasterizer`), reached on the same
# `<canvas>` when WebGPU is unavailable. Path dep (not workspace) so this stays
# a delegate-only edge.
[target.'cfg(target_arch = "wasm32")'.dependencies]
vello = "0.9"
wgpu = { version = "29", default-features = false, features = ["webgpu", "wgsl"] }
canvas-native = { path = "../native", default-features = false, features = ["web-sys-canvas"], version = "1.7.0", registry = "idealyst" }
# A texture layer's native source is a `web_glue::dom::MediaStream` (what the
# media SDKs publish). HYBRID-BRIDGE: wgpu — the layer `<video>` is a web-sys
# element for wgpu's `ExternalImageSource`, so the stream crosses to
# wasm-bindgen once per attach (`web_layer::LayerSlot::ensure_stream`).
web-glue = { workspace = true, features = ["wasm-bindgen-bridge"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    # GPU layer compositor (`web_layer`): a hidden `<video>` per texture layer
    # plays the camera `MediaStream` (crossed over from its web-glue handle);
    # its current frame is copied into a wgpu texture each frame via
    # `Queue::copy_external_image_to_texture`.
    "Window",
    "Document",
    "Element",
    "HtmlVideoElement",
    "HtmlMediaElement",
    "MediaStream",
] }

# Native GPU glyph test (`glyph_run_rasterizes_on_the_gpu`) maps a character to
# its glyph id with the same skrifa vello uses internally, so the id it hands
# the `DrawOp::Glyphs` arm indexes the font the way vello expects.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
skrifa = "0.42"
serde_json = { workspace = true }
# CPU-vs-GPU rasterization benchmark (`bench_cpu_vs_gpu_rasterization`, #[ignore])
# loads a real PDF page into a canvas Scene. `pdf` depends only on `canvas-core`
# (no cycle back to `canvas-vello`).
pdf = { path = "../../pdf" }

# Linux dma-buf export spike (`dmabuf_export_spike`, #[ignore], interactive): a
# live `GtkGLArea` is the only way to get the EGL display+context the GL path uses,
# so the spike borrows `backend-linux`'s `build_gl_area_for_test` (the same helper
# `gl_target_adoption.rs` uses). `backend-linux` does NOT depend on `canvas-vello`,
# so this dev-only edge is acyclic. `gtk4` comes via `backend_linux::gtk4`.
[target.'cfg(target_os = "linux")'.dev-dependencies]
backend-linux = { path = "../../../../backend/linux" }

# Zero-copy GPU capture on macOS: render vello into an IOSurface-backed Metal
# texture (imported into the canvas wgpu device via `wgpu::Device::as_hal` +
# `create_texture_from_hal`) and publish that IOSurface as the stream's native
# source — no CPU readback, no swizzle. These are the SAME objc2 0.6-gen crates
# wgpu-hal 29's Metal backend already uses (so the `ProtocolObject<dyn MTL*>`
# types are ABI-identical with what `as_hal` hands back), and they coexist with
# backend-macos's 0.5-gen (see the objc2-coexistence note above).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", features = [
    "MTLDevice",
    "MTLTexture",
    "MTLPixelFormat",
    "MTLResource",
    "MTLAllocation",
    # Enables `newTextureWithDescriptor:iosurface:plane:` on MTLDevice.
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSValue"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
