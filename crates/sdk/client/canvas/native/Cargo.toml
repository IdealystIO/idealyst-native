[package]
name = "canvas-native"
version.workspace = true
edition.workspace = true
license.workspace = true

# `canvas-native` — renders a canvas `Scene` with each platform's NATIVE
# 2D engine. One crate, cfg-gated per-backend modules (codeblock/video
# pattern). The app picks this renderer by calling `canvas_native::register`
# at bootstrap; it registers an `Element::External` handler for
# `CanvasProps` keyed by its TypeId.
#
# Backend coverage:
# - Web: `<canvas>` 2D context.
# - iOS: CoreGraphics / `CGContext` via a `UIView` subclass.
# - macOS: CoreGraphics / `CGContext` via an `NSView` subclass (shares
#   the iOS op-replay through the `apple` module; only the context
#   acquisition + bezier/color vtable differ).
# - Android: `android.graphics.Canvas`.
# - Other targets: framework `External` placeholder; use `canvas-vello`.

[features]
# Runtime-v2 defaults flip: new-core leg on by default (old-core via
# `--no-default-features --features self-register`).
default = ["self-register", "new-core"]
# Old-core marker for uniform invocations.
old-core = []
# Self-registration of the per-backend external handler at backend
# construction (no app-side `register` call needed). ON by default so apps
# that depend on this crate directly keep the zero-config behavior.
#
# OFF for delegate-only consumers: `canvas-vello` depends on this crate
# purely for `make_2d_rasterizer` (its Canvas2D fallback) with
# `default-features = false`. The inventory ctor is a link-time anchor —
# it makes the whole rasterizer + glyph stack (skrifa/read_fonts, ~670 KB
# of a lazy web bundle's main.wasm) reachable from `main`'s ctors, which
# pins it in `main.wasm` even when the canvas itself is lazy-loaded in a
# wasm-split chunk. With the feature off, that code is reachable only from
# the registering chunk and splits out cleanly. See the `lazy-loading`
# guide ("Lazy-loading a heavy SDK").
self-register = ["dep:inventory"]
# Idea-lite migration (External-SDK wave): register the web (`<canvas>`
# 2D) renderer as a scene-Registry handler for `canvas_core::CanvasPrim`
# (see src/web_newcore.rs). Default-off and MUTUALLY EXCLUSIVE with the
# old-core register surface (same public `register` name — one core per
# build graph). Non-web targets install the External-placeholder
# degradation handler until the native painters port (documented seam in
# lib.rs). `backend-web/new-core` is required because the wasm32 handler
# is `WebBackend`-concrete (Canvas2D has no caps-trait expression).
new-core = [
    "canvas-core/new-core",
    "dep:runtime-scene",
    "dep:runtime-vocabulary",
    "dep:runtime-world",
    "backend-web/new-core",
]

[dependencies]
runtime-core = { workspace = true }
canvas-core = { workspace = true }
# New-core surface (feature `new-core`).
runtime-scene = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
runtime-world = { workspace = true, optional = true }
# Self-registration of the per-backend external handler at construction.
inventory = { version = "0.3", optional = true }
# Outline glyphs from font bytes so a `DrawOp::Glyphs` run (a rendered PDF's
# text) renders on the CPU backends with the SAME geometry the GPU (vello) path
# produces — both outline at upem = 1000 with hinting off. Pure Rust, builds on
# every target incl. wasm. Matches the version vello already pulls.
skrifa = "0.42"

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "CanvasWindingRule",
    "ResizeObserver",
    # Self-capture: `HtmlCanvasElement::capture_stream_with_frame_request_rate`
    # → `MediaStream`, published as the canvas stream's native source. Capture
    # runs in MANUAL mode (rate 0) and we drive `requestFrame()` per render via
    # the `CanvasCaptureMediaStreamTrack`, paced by `performance.now()`.
    "MediaStream",
    "MediaStreamTrack",
    "CanvasCaptureMediaStreamTrack",
    "Performance",
    # Texture layers (camera): a hidden <video> per layer is drawImage'd into the
    # canvas so captureStream records it (web parity for camera-in-canvas).
    "HtmlVideoElement",
    "HtmlMediaElement",
    # Static-image blit (`DrawOp::Image`): raw RGBA → `ImageData` → an offscreen
    # `<canvas>` (`put_image_data`), drawImage'd into the scene
    # (`draw_image_with_html_canvas_element_and_dw_dh`).
    "ImageData",
    # Persistent layer (`DrawOp::Layer`): `get_transform()` returns a `DomMatrix`
    # used to mirror the main context's transform onto the offscreen layer.
    "DomMatrix",
] }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
objc2-ui-kit = { version = "0.2", features = ["UIView", "UIResponder"] }

# iOS SIMULATOR only: the CPU self-capture (recording) fallback lives here
# because vello can't run on the sim. `backend-ios-core` provides `ios_log` for
# the one-time "you're on the slow CPU path" NSLog warning. Not pulled into
# device builds, where vello owns capture and the CPU path isn't compiled.
[target.'cfg(all(target_os = "ios", target_abi = "sim", not(target_arch = "wasm32")))'.dependencies]
backend-ios-core = { workspace = true }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",
    "NSResponder",
    "NSColor",
    "NSBezierPath",
    "NSGraphicsContext",
] }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
backend-android-core = { workspace = true }
jni = "0.21"

[dev-dependencies]
# Unconditional in tests so the self-register gate tests can iterate the
# registry even when the feature (and the optional runtime dep) is off.
inventory = "0.3"
# tests/newcore.rs (`--features new-core`): the placeholder arm on the
# shared host-mock recording substrate.
host-mock = { workspace = true }
