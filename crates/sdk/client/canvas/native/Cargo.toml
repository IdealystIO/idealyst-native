[package]
name = "canvas-native"
version = "1.7.1"
edition.workspace = true
license.workspace = true

# `canvas-native` — renders a canvas `Scene` with each platform's NATIVE
# 2D engine. One crate, cfg-gated per-backend modules (codeblock/video
# pattern). The app picks this renderer by passing
# `canvas_native::register` to the boot entry's registry seam; it installs
# a scene handler for `canvas_core::CanvasPrim`.
#
# Backend coverage:
# - Web: `<canvas>` 2D context.
# - iOS: CoreGraphics / `CGContext` via a `UIView` subclass.
# - macOS: CoreGraphics / `CGContext` via an `NSView` subclass (shares
#   the iOS op-replay through the `apple` module; only the context
#   acquisition + bezier/color vtable differ).
# - Android: `android.graphics.Canvas`.
# - Other targets: the External placeholder; use `canvas-vello`.

[features]
# VACUOUS — retained only so existing `features = ["self-register"]` dep
# specs keep resolving. It used to gate an `inventory` ctor that
# self-registered the handler at backend construction; the scene registry
# is built explicitly at boot, so there is no ctor and nothing to gate.
# (The old motivation was bundle size: the ctor was a link-time anchor
# that pinned the rasterizer + glyph stack in a lazy web bundle's
# `main.wasm`. With no ctor, delegate-only consumers like `canvas-vello`
# reach `make_2d_rasterizer` without anchoring anything.) Safe to delete
# once no dep spec names it.
self-register = []
# HYBRID-BRIDGE: wgpu. The public `make_2d_rasterizer` /
# `publish_capture_stream` take a `web_sys::HtmlCanvasElement`, because
# `canvas-vello` (wgpu, hence wasm-bindgen) calls them with its graphics
# canvas. Off by default: compiled in, they link wasm-bindgen's runtime into
# EVERY canvas app — and a module carrying wasm-bindgen builds in hybrid mode
# (the wasm-bindgen CLI) even when no GPU renderer is in it. canvas-vello
# turns it on; nothing else needs it. Web only (the deps are wasm32-only).
web-sys-canvas = ["dep:wasm-bindgen", "dep:web-sys", "web-glue/wasm-bindgen-bridge"]

[dependencies]
canvas-core = { workspace = true }
# The scene registry the platform handlers install into, the vocabulary
# caps + style channel they drive, and `runtime_world::effect` for the
# reactive repaint. `runtime-shared` names
# `accessibility::AccessibilityProps` on the placeholder arm.
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-world = { workspace = true }
# No font parser here: glyph runs are outlined by canvas-core's
# `expand_glyph_run`, linked through `FontResource` — so an app drawing only
# charts doesn't ship skrifa (~400 KB of wasm) through this renderer.

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }
# The `<canvas>`, the Canvas2D replay, texture-layer `<video>`s, the
# ResizeObserver and `captureStream` all go through web-glue, the
# framework-owned JS boundary (docs/proposals/own-web-bindings.md). A texture
# layer's / the self-capture's native source is a `web_glue::dom::MediaStream`.
web-glue = { workspace = true }
# Only with `web-sys-canvas` (see [features]).
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"], optional = true }

# Browser tests (`tests/web_canvas.rs`) — run with
# `cargo test -p canvas-native --target wasm32-unknown-unknown` (the
# workspace runner supplies web-glue's JS; `wasm-pack test` cannot load it).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
media-stream = { workspace = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
objc2-ui-kit = { version = "0.2", features = ["UIView", "UIResponder"] }

# iOS SIMULATOR only: the CPU self-capture (recording) fallback lives here
# because vello can't run on the sim. `backend-ios-core` provides `ios_log` for
# the one-time "you're on the slow CPU path" NSLog warning. Not pulled into
# device builds, where vello owns capture and the CPU path isn't compiled.
[target.'cfg(all(target_os = "ios", target_abi = "sim", not(target_arch = "wasm32")))'.dependencies]
backend-ios-core = { workspace = true }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.2", features = [
    "NSView",
    "NSResponder",
    "NSColor",
    "NSBezierPath",
    "NSGraphicsContext",
] }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
backend-android-core = { workspace = true }
jni = "0.21"

[dev-dependencies]
# tests/canvas.rs: the placeholder arm on the shared host-mock recording
# substrate.
host-mock = { path = "../../../../dev/host-mock" }

# Unconditional in tests so the self-register gate tests can iterate the
# registry even when the feature (and the optional runtime dep) is off.
inventory = "0.3"

# Linux/GTK renderer — Cairo (GTK's own 2D engine, already linked by the
# toolkit). `backend-linux` re-exports `gtk4`, so cairo/graphene/glib all
# come from the one gtk4 version the backend itself uses — two gtk4
# majors in a process would be two incompatible GObject wrapper sets.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }

# The Cairo renderer's glyph test (`linux.rs` tests) outlines a reference glyph
# itself to compare against the Glyphs arm. Test-only: the renderer reaches
# skrifa through canvas-core's `expand_glyph_run`, never directly.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dev-dependencies]
skrifa = "0.42"
