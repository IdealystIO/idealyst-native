[package]
name = "canvas-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Canvas SDK demo — programmatic 2D drawing (paths, fills, strokes, gradients, transforms, clip, animation) rendered via canvas-native's Canvas2D replay. Exercises the renderer-agnostic Scene end to end on web."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# The author surface. `runtime-core` is aliased to `runtime_core` at the
# crate root (see src/lib.rs) — one core, no feature switch.
# `runtime-vocabulary` is needed because the `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths (and for the caps bounds
# `canvas_native::register` asks for), and `runtime-scene` for the scene
# `Registry` in the registration seam.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
canvas = { workspace = true }
canvas-native = { workspace = true }

# No backend deps: `canvas_native::register` is generic on every target
# and type-dispatches ONCE at registration (it downcasts the registry to
# the platform's concrete one and installs the native painter, falling
# back to the External placeholder), so this crate stays fully
# platform-agnostic.

[package.metadata.idealyst.app]
name      = "Canvas Demo"
bundle_id = "ai.truday.idealyst.canvasdemo"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
