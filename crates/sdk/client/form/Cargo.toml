[package]
name = "form"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `Form` SDK — one crate, cfg-gated per-backend glue (same
# single-crate shape as the `webview` SDK).
#
# # Why this is an SDK and not a core primitive
#
# A form has no convergent cross-platform behavior to put behind the
# host capability set: on web `<form>` is a real element (submit-on-enter,
# autofill grouping, FormData), while iOS/Android have NO form
# construct at all — their form affordances (autofill, return-key
# submit) live per-field on the inputs, not on a container. A core
# primitive that's inert on every backend except web would be a
# web-only capability wearing a primitive's clothes. So `Form` is an
# opinionated SDK built on the scene registry's external-element
# contract (with children):
#   * web    → a real `<form>` wrapping the inputs as DOM descendants,
#              with the native `submit` event wired to `on_submit`
#              after `preventDefault()`.
#   * native → a plain passthrough container; submission is triggered
#              by the author's submit Button calling `on_submit`.
#
# Field VALUES are collected via the framework's reactive signals, not
# the web form's FormData — `on_submit` reads your field signals. The
# `<form>` element only contributes web UX/integration (Enter-to-submit,
# autofill, preventDefault), never the source of truth for data.

[dependencies]
# The scene registry + the vocabulary caps the handlers drive
# (`ExternalOps::create_external` placeholder path) + `style_attach` for
# the author-style channel. No `runtime-world` — the form handler runs
# no effects (the submit listener is a plain DOM callback).
# `runtime-shared` supplies `Ref` and `accessibility::AccessibilityProps`.
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# tests/form.rs mounts `Form { .. }` through the scene registry
# end-to-end on the shared host-mock recording substrate.
host-mock = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The wasm32 handler is `WebBackend`-concrete (the real `<form>` +
# submit listener has no caps-trait expression, and the listener must
# call `backend_web::newcore::schedule_flush`), so `Registry<WebBackend>`
# needs the backend's `Host` impl.
backend-web = { workspace = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Node",
    "Window",
    "Event",
    "EventTarget",
    "HtmlFormElement",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
