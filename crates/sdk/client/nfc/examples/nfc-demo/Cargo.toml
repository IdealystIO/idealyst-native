[package]
name = "nfc-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Reads and writes NFC tags with the nfc SDK. 'Scan' keeps a reader session open and lists every tag tapped (id, technologies, NDEF records); 'Write text' writes the typed text to the next tag and reads it back; 'Stop' ends the session."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only.
idealyst = { workspace = true }
# `async-driver` because the scan/write handlers use `spawn_then`.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
nfc = { workspace = true }
dev-server = { workspace = true, optional = true }

[package.metadata.idealyst.app]
name      = "NFC"
bundle_id = "ai.truday.idealyst.nfc"
version   = "0.0.1"
targets   = ["android", "ios", "web", "macos"]

# The reason the iOS scan sheet shows. Android's NFC permission needs none.
[package.metadata.idealyst.app.permissions]
nfc = "Read and write NFC tags"

# Let iOS report Type 4 tags (and phones emulating one) by their NDEF
# application id.
[package.metadata.idealyst.app.nfc]
iso7816_aids = ["D2760000850101"]
