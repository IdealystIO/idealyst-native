[package]
name = "offload"
version = "2.0.0"
edition.workspace = true
license.workspace = true

# Run a CPU-heavy function OFF the main thread, with one platform-agnostic call
# site:
#
#     #[offload::job]
#     fn rasterize(req: Req) -> Out { /* heavy work */ }
#
#     let out = offload::run(offload::handle!(rasterize), &req).await?;
#
#   - web:    runs the job in a Web Worker (a real background thread) that
#             instantiates the SAME app module through the framework's own
#             glue (`web_glue::worker`) — no wasm-bindgen, no
#             SharedArrayBuffer, so NO cross-origin isolation (COOP/COEP)
#             headers are required and embedding still works. There is no
#             second build artifact. The job crosses as a function-table
#             index; its argument and result as postcard bytes.
#   - native: runs the job on a `std::thread`; the result is delivered back
#             through a oneshot channel the `.await` polls.
#
# Job argument + return types must be `serde::Serialize + Deserialize` (the web
# backend ships them across the worker boundary; native clones them).

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
# `#[offload::job]` — a no-op marker attribute on every target.
offload-macro = { path = "../offload-macro", version = "1.6.0", registry = "idealyst" }
# The oneshot each backend resolves the awaited future through.
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-glue = { workspace = true }
# The wire format for a job's argument and result: compact, serde-driven, no
# std requirement. `alloc` gives `to_allocvec`.
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Block on the `run` future in native unit tests.
pollster = "0.3"
serde = { workspace = true }

# Browser tests (`tests/web_worker.rs`): `cargo test -p offload --target
# wasm32-unknown-unknown` through the workspace runner.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# `join_all` for the concurrent-jobs test.
futures = "0.3"
web-glue = { workspace = true }
