[package]
name = "ios-navigator-helpers"
version = "1.5.3"
edition.workspace = true
license.workspace = true

[dependencies]
# Substrate only: the navigator DATA model (`NavigatorControl` / `NavState` /
# `MountResult` / `NavigatorOps`) plus the style + color vocabulary. Nothing
# here touches the author surface (no `ui!`, no `Element`), and `NavState`'s
# signals are the substrate's own arena handles, so this depends on
# `runtime-shared` directly rather than through the `runtime_core` facade.
runtime-shared = { workspace = true }

# All UIKit machinery is iOS-only; on non-iOS hosts the crate compiles
# to an empty rlib so the workspace still cross-compiles. SDK iOS
# handlers cfg-gate their `use ios_navigator_helpers::...` to iOS, so
# host-side code never touches anything here.
[target.'cfg(target_os = "ios")'.dependencies]
# The `native_push` seam (`handlers::nav_native_push`) the stack
# presenter implements. iOS-only like the rest of this crate's real
# dependencies — the whole crate is `#![cfg(target_os = "ios")]`.
runtime-vocabulary = { workspace = true }
backend-ios-mobile = { workspace = true }
backend-ios-core = { workspace = true }
runtime-layout = { workspace = true }
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSArray",
    "NSEnumerator",
    "NSObject",
] }
objc2-ui-kit = { version = "0.2", features = [
    "UIResponder",
    "UIView",
    "UIViewController",
    "UINavigationController",
    "UIColor",
    "UIGestureRecognizer",
    "UITapGestureRecognizer",
] }
