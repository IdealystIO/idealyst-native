[package]
name = "nested-nav-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nested navigators with two simultaneous sidebars — a primary section sidebar (outer swap) whose 'Reports' screen body is a second swap navigator with its own secondary tool sidebar. Both `.layout(...)` chromes render at once."

[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server), which calls `register_scene_extensions_recorder`.
# The swap navigator's runtime is a vocabulary BUILT-IN (installed on every
# host by `register_builtins`, wire recorder included), so there is no SDK
# feature to forward.
sidecar = ["dep:dev-server"]

[dependencies]
# The author-surface root: `extern crate runtime_core as runtime_core;`
# in src/lib.rs maps every `runtime_core::…` path here.
# `runtime-vocabulary` because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
swap-navigator = { workspace = true }
dev-server = { workspace = true, optional = true }

# No backend deps: `register_scene_extensions` is registry-generic (no
# third-party scene handlers here), so the crate stays platform-agnostic and
# the CLI-generated wrappers bring their own concrete backend.

[package.metadata.idealyst.app]
name      = "Nested Nav Demo"
bundle_id = "ai.truday.idealyst.nestednavdemo"
version   = "0.0.1"
targets   = ["web"]
