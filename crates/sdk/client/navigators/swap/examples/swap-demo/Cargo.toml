[package]
name = "swap-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Minimal swap-navigator demo — three co-equal tab screens switched via a bottom TabBar. The bar is author layout (idea-ui-nav) wrapping the navigator's single outlet; no push/pop depth. The canonical 'TabBar wired to a router' case."

[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper
# (build-runtime-server), which calls `register_scene_extensions_recorder`.
# The swap navigator's runtime is a vocabulary BUILT-IN — `register_builtins`
# installs it on every host including the wire recorder — so the seam has
# nothing to register and no SDK feature to forward.
sidecar = ["dep:dev-server"]

[dependencies]
# The author-surface root: `extern crate runtime_core as runtime_core;`
# in src/lib.rs maps every `runtime_core::…` path here.
# `runtime-vocabulary` because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
swap-navigator = { workspace = true }
idea-ui = { workspace = true }
idea-ui-nav = { workspace = true }
dev-server = { workspace = true, optional = true }

# No backend deps: `register_scene_extensions` is registry-generic (this
# demo registers no third-party scene handlers), so the crate stays fully
# platform-agnostic and the CLI-generated wrappers bring their own
# concrete backend.

[package.metadata.idealyst.app]
name      = "Swap Demo"
bundle_id = "ai.truday.idealyst.swapdemo"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
