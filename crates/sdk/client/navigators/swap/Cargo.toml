[package]
name = "swap-navigator"
version.workspace = true
edition.workspace = true
license.workspace = true

# First-party **Swap** navigator SDK — a flat set of co-equal screens the
# user switches between (`Select`), with author-supplied chrome. Replaces
# the tab + drawer navigators: "tab bar" and "drawer" are now just author
# layout wrapped around the navigator's single outlet (`{nav.outlet}`),
# the analog of react-router's `<Outlet/>`.
#
# The authored surface lowers to the vocabulary's `swap_navigator()`
# builder; the RUNTIME is the vocabulary's own swap handler, installed on
# every host by `register_builtins`. So there is no per-backend handler to
# register (hence no per-backend dependency here) and no registration call
# for an app to forget — `swap_navigator::register` survives only as a
# documented no-op for historical bootstrap code.
description = "Swap navigator SDK — flat co-equal screens with author chrome around one outlet."

# No features. The MCP catalog's swap-navigator RECIPE is static data in
# `runtime_shared::recipes` (compile-checked against this crate's live
# surface by `crates/dev/newcore-app/tests/recipes_compile.rs`), so this
# crate's own sources emit nothing into the catalog and need no `catalog`
# switch.

[dependencies]
# The builders + glue re-exports (Element/Ref/Signal/inject) + prims
# (NavHandle/SwapNav/Screen/MountPolicy) the authored surface lowers to.
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# The shared host-mock recording substrate drives the authored surface
# end-to-end (tests/navigator.rs); backend-ssr renders it at a path and
# crawls the route set (tests/ssr.rs).
runtime-scene = { workspace = true }
runtime-world = { workspace = true }
runtime-shared = { workspace = true }
# COORDINATION (runtime-v2 deletion wave): `` is
# still required because backend-ssr's `newcore` render path is
# feature-gated. Drop the forward once it is unconditional.
backend-ssr = { workspace = true }
host-mock = { workspace = true }
