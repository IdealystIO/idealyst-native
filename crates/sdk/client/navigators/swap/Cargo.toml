[package]
name = "swap-navigator"
version.workspace = true
edition.workspace = true
license.workspace = true

# First-party **Swap** navigator SDK — a flat set of co-equal screens the
# user switches between (`Select`), with author-supplied chrome. Replaces
# the tab + drawer navigators: "tab bar" and "drawer" are now just author
# layout wrapped around the navigator's single outlet (`{nav.outlet}`),
# the analog of react-router's `<Outlet/>`.
#
# The handler is BACKEND-NEUTRAL: it drives everything through the
# framework's `NavigatorHost` callbacks (`build_layout_with_outlet`,
# `mount_screen`, `insert_node`, `clear_children`) + `schedule_microtask`,
# so ONE handler serves every backend. Per-backend modules only submit the
# self-registration inventory entry.
#
# App bootstrap: `swap_navigator::register(&mut backend)` (or automatic via
# the inventory registrar on web/macOS).

[features]
# Recording handler for the runtime-server sidecar's recorder backend.
# Host-side only; off by default. Mirrors tab/drawer.
runtime-server = ["dep:dev-server", "dep:wire"]
# Compile-checked usage recipes for the docs/MCP catalog. Off in every
# production build (the `recipe!` macro then expands to nothing). Must be
# THIS crate's own feature — the `#[cfg(feature = "catalog")]` gate on
# `src/recipes.rs` only sees this crate's features, not runtime-core's.
catalog = ["runtime-core/catalog"]

[dependencies]
# Forward the navigator gate: depending on this SDK re-enables the
# walker/backend navigator machinery even under default-features = false.
runtime-core = { workspace = true, features = ["prim-navigator"] }
# Self-registration of the per-backend navigator handler at construction.
inventory = "0.3"

# Recording handler deps (feature `runtime-server`, host-side only).
dev-server = { workspace = true, optional = true }
wire = { workspace = true, optional = true }

# The generic chrome/registration test registers the handler on a concrete
# SsrBackend; the handler itself is backend-neutral (no backend dep, no cfg).
[dev-dependencies]
backend-ssr = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true, features = ["prim-navigator"] }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
