[package]
name = "stack-navigator"
version.workspace = true
edition.workspace = true
license.workspace = true

# Stack navigator on the OUTLET model — the push/pop sibling of swap-navigator.
# Depth-changing (Push/Pop/Replace/Reset); the visible screen is the top of a
# back-stack, lower screens stay mounted so pop-back restores their state.
# Chrome (a header) is AUTHOR LAYOUT via `.layout(|nav| …)` wrapping the single
# outlet — the same StackHeader idea-ui-nav ships, rendered identically on
# every backend (native push-surface + bar-hidden is a later per-backend step).
#
# Built alongside the legacy `stack-navigator` (which keeps its native
# UINavigationController chrome); this is the outlet-model replacement.

[features]
runtime-server = ["dep:dev-server", "dep:wire"]
# Compile-checked usage recipes for the docs/MCP catalog. Off in every
# production build (the `recipe!` macro then expands to nothing). Must be
# THIS crate's own feature — the `#[cfg(feature = "catalog")]` gate on
# `src/recipes.rs` only sees this crate's features, not runtime-core's.
catalog = ["runtime-core/catalog"]

[dependencies]
# Forward the navigator gate: depending on this SDK re-enables the
# walker/backend navigator machinery even under default-features = false.
runtime-core = { workspace = true, features = ["prim-navigator"] }
inventory = "0.3"
dev-server = { workspace = true, optional = true }
wire = { workspace = true, optional = true }

[dev-dependencies]
# `tests/ssr.rs`: render-at-path + SSG crawl for the outlet-model stack.
backend-ssr = { workspace = true }

# Native-only: mock-backend transitively pulls dev-server/wire, whose
# getrandom doesn't build for bare wasm32 — and the wasm test target only
# needs backend-web/backend-ssr (tests/hydration_web.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mock-backend = { workspace = true }
# `tests/recipes.rs`: asserts the `stack_two_screens` recipe registers in the
# catalog with the extension-trait import line intact (feature `catalog`).
mcp-catalog = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true, features = ["prim-navigator"] }

# Browser-run hydration tests (`tests/hydration_web.rs`): SSR HTML is
# rendered in-test, injected, and hydrated by the real web backend.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
backend-web = { workspace = true, features = ["hydrate"] }
backend-ssr = { workspace = true }
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["History"] }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
# Native push surface (src/ios.rs): the shared UINavigationController
# engine, bar hidden, author StackHeader chrome.
ios-navigator-helpers = { workspace = true }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
# Native push surface (src/android.rs): the shared Kotlin RustNavigator
# engine, Toolbar hidden, author StackHeader chrome.
android-navigator-helpers = { workspace = true }
jni = "0.21"
