[package]
name = "stack-navigator"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Stack navigator on the OUTLET model — the push/pop sibling of swap-navigator.
# Depth-changing (Push/Pop/Replace/Reset); the visible screen is the top of a
# back-stack, lower screens follow `StackRetention` so pop-back can restore
# their state. Chrome (a header) is AUTHOR LAYOUT via `.layout(|nav| …)`
# wrapping the single outlet — the same StackHeader idea-ui-nav ships,
# rendered identically on every backend.
#
# The authored surface lowers to the vocabulary's `stack_navigator()`
# builder; the RUNTIME is the vocabulary's own stack handler, installed on
# every host by `register_builtins`. So there is no per-backend handler to
# register (hence no per-backend dependency here) and no registration call
# for an app to forget — `stack_navigator::register` survives only as a
# documented no-op for historical bootstrap code.
#
# A NATIVE PUSH SURFACE (real UINavigationController / RustNavigator under
# the outlet-model handler) is not implemented: that seam lives in the
# vocabulary navigator handler + the per-backend hosts, not here. The
# backend-neutral outlet handler runs on every platform meanwhile.
description = "Stack navigator SDK — push/pop depth with author chrome around one outlet."

# No features. The MCP catalog's stack-navigator RECIPE is static data in
# `runtime_shared::recipes` (compile-checked against this crate's live
# surface by `crates/dev/newcore-app/tests/recipes_compile.rs`), so this
# crate's own sources emit nothing into the catalog and need no `catalog`
# switch.

[dependencies]
# The builders + glue re-exports (Element/Ref/Signal/inject) + prims
# (NavHandle/StackNav/ScreenChrome/Screen/StackRetention) the authored
# surface lowers to.
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# `tests/navigator.rs` + `tests/stack_local.rs`: the shared host-mock
# recording substrate drives the authored surface end-to-end.
runtime-scene = { path = "../../../../runtime/scene" }
runtime-world = { path = "../../../../runtime/world" }
runtime-shared = { path = "../../../../runtime/shared" }
host-mock = { path = "../../../../dev/host-mock" }
# `tests/ssr.rs`: render-at-path + SSG crawl for the outlet-model stack.
#
# COORDINATION (runtime-v2 deletion wave): `` is
# still required because backend-ssr's `newcore` render path is
# feature-gated. Drop the forward once it is unconditional.
backend-ssr = { path = "../../../../backend/ssr" }

# Browser-run hydration test (`tests/hydration_web.rs`): SSR HTML is
# rendered in-test, injected, and adopted by the real web backend's
# `newcore::hydrate_in`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
backend-web = { path = "../../../../backend/web", features = ["hydrate"] }
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["History"] }

[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }

[target.'cfg(all(target_os = "macos", not(target_arch = "wasm32")))'.dependencies]
backend-macos = { workspace = true }

[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
# Native push surface (src/ios.rs): the shared UINavigationController
# engine, bar hidden, author StackHeader chrome.
ios-navigator-helpers = { workspace = true }

[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
# Native push surface (src/android.rs): the shared Kotlin RustNavigator
# engine, Toolbar hidden, author StackHeader chrome.
android-navigator-helpers = { workspace = true }
jni = "0.21"
