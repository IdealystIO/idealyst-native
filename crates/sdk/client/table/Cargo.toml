[package]
name = "table"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `Table` SDK — one crate, cfg-gated per-target lowering
# (same single-crate shape as the `form` SDK).
#
# # Why this is an SDK and not a core primitive
#
# A real HTML `<table>` is irreplaceable for cross-row column
# alignment on web: the browser's table layout algorithm sizes
# every column to fit the widest cell in that column, then applies
# that width to every row.
#
# Native platforms have no comparable structure (UITableView is a
# vertical list, not a multi-column grid; Android RecyclerView is
# the same; macOS has NSTableView but it's row-keyed not
# cross-column), so `Table` lowers per target:
#   * web    → real `<table>`/`<thead>`/`<tbody>`/`<tr>`/`<th>`/`<td>`
#              hierarchy through scene-registry handlers. The browser's
#              `table-layout: auto` handles column alignment for free.
#   * native → ONE shared-track CSS grid (rows flatten to cells), so
#              column `i` is one width across every row.
description = "Cross-platform table SDK — real <table> on web, shared-track CSS-grid on native."

[lib]
crate-type = ["rlib"]

[dependencies]
# The scene Element/Registry/item + the vocabulary glue (view builder,
# style attach, caps traits) both lowerings are expressed over.
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
# The permanent shared substrate: the style data model plus the event
# handler aliases (`TouchHandler` / `HoverHandler`) idea-ui's
# clickable-row feature installs on built cells.
runtime-shared = { workspace = true }

[dev-dependencies]
# The scene handlers are generic over the caps traits, so the SSR
# backend — a real caps-complete host — drives them on the host target
# (the navigator-SDK test pattern).
#
# COORDINATION: `` is still needed because
# backend-ssr's newcore render path is feature-gated. When that feature
# is made unconditional (backend flattening wave), drop the forward.
backend-ssr = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

# No wasm32-specific dependency: the web `<table>` handlers are generic
# over the vocabulary caps traits, so nothing here touches `web-sys` or
# the web backend directly. (They used to, when the web lowering went
# through a `WebBackend`-concrete external handler.)
