[package]
name = "charts-core"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Renderer-agnostic charting: a chart spec in, a vector mark IR + label placements out."

# STANDALONE BY CONTRACT. This crate has zero idealyst dependencies and is
# publishable on its own — that is the whole point of the layering, so keep
# it that way. `canvas-core` is NOT a permissible dependency here: it pulls
# `runtime-core` + `runtime-scene` + `runtime-vocabulary` + `media-stream`,
# which would drag the entire framework into what is meant to be a portable
# crate. The idealyst SDK (`charts`) owns the IR -> `canvas_core::Scene`
# adapter instead; the IR is designed to map onto it losslessly.
#
# Tick selection (nice-number linear steps, log decades, UTC-midnight-aligned
# time ticks) is in-house, in `src/ticks.rs` — a port of what this crate
# used to take from `plotters`, diffed against it for identical output.
# `plotters` was dropped because on wasm32 it links `wasm-bindgen` and
# `web-sys` unconditionally (target-specific deps, not behind any feature),
# and its `datetime` feature enables chrono with DEFAULT features —
# `clock` + `wasmbind`, i.e. `js-sys`/`wasm-bindgen` again. The framework
# owns its web boundary; a portable charting crate must not pull it in.
[dependencies]
# Calendar math (UTC midnight, day/week stepping) and strftime-style label
# formatting for time axes. Pure computation: NO `clock` (no "now", no
# local time zone — the `iana-time-zone` / `wasm-bindgen` path on wasm32),
# NO `wasmbind`, NO `std`. `alloc` is what `DateTime::format(..).to_string()`
# needs. Keep it that way: `cargo tree --target wasm32-unknown-unknown -i
# wasm-bindgen -p charts-core` must stay empty.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
