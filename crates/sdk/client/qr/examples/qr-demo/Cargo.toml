[package]
name = "qr-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Both halves of the qr SDK: a QrCode component drawing typed text as a vector QR, and a camera + scanner on one canvas with the code outline drawn over the frame (GPU via canvas-vello where available)."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[features]
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only.
idealyst = { workspace = true }
# `async-driver` for `spawn_then`; `runtime-vocabulary` for the `ui!`
# emission's absolute paths and the registration seam's bounds;
# `runtime-scene` for the `Registry` the seam takes.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
camera = { workspace = true }
qr = { workspace = true }
# The preview: one canvas that composites the camera as a texture and strokes
# the code outline over it. `canvas-native` is the baseline renderer on every
# target; `canvas-vello` (GPU) takes over where the GPU can run it — it
# self-gates, so no per-platform choice lives here.
canvas = { workspace = true }
canvas-native = { workspace = true }
canvas-vello = { workspace = true }
dev-server = { workspace = true, optional = true }

[package.metadata.idealyst.app]
name      = "QR"
bundle_id = "ai.truday.idealyst.qr"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos"]

[package.metadata.idealyst.app.permissions]
camera = "QR Scan reads QR codes from your camera feed."

# `tests/scan_loop.rs` drives `start_scan` against a real `MediaStream` in a
# `World` (`host-mock`'s Harness) with a hand-pumped async executor
# (`runtime-shared`'s install slot); `qrcode` renders the frame it scans.
[dev-dependencies]
host-mock = { workspace = true }
runtime-shared = { workspace = true }
media-stream = { workspace = true }
qrcode = { version = "0.14", default-features = false }
