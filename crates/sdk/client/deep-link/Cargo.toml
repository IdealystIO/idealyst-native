[package]
name = "deep-link"
version = "1.7.1"
edition.workspace = true
license.workspace = true

# Cross-platform inbound-URL (deep link / universal link) SDK.
#
# The framework routes inbound links itself: the hosts deliver them to
# `runtime_shared::inbound_link` (the launch link before the first mount,
# later links while running) and the navigators open the linked screen.
# This crate is the typed author face over that seam — parse, observe
# (`on_link`), claim (`intercept`), replay (`route_link`), plus the launch
# URL (`initial_link`).
#
# It also answers where the app is NOW — `current_url()` / `origin()` /
# `replace_url()` — on the one platform with an address bar (web); native
# targets answer `None` / no-op, since a native app is not "at" a URL.
#
# No runtime permission. The OS only sends links an app declares under
# `[package.metadata.idealyst.app.links]` — see docs/deep-links.md.

[dependencies]
# The inbound-link host seam (`runtime_shared::inbound_link`): the hosts
# deliver links there — the cold-start one before any app code runs — and
# the framework routes them through the navigators. This crate is the typed
# author face over that seam (parse, observe, intercept, route).
runtime-shared = { workspace = true }
# Robust URL parsing — scheme / host / path / query without a fragile hand
# parser. `default-features = false` keeps it lean (no IDNA tables needed
# for app deep links; we still get correct percent-decoding of queries).
url = { version = "2", default-features = false }

# Only pulled for the `catalog` feature's compile-checked recipes. The core
# SDK (parse + registry + feed_link) is pure Rust and needs nothing from
# the framework, so these stay optional and off in production — which is
# also why the `runtime_core` alias at the crate root carries a `catalog`
# cfg (it is an optional-dependency gate, not a core selector).
# `runtime-vocabulary` is direct because the recipes' `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths.
runtime-core = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }

# Web (wasm32): read window.location for the initial link and the live
# address (`current_url` / `origin`), and History for `replace_url` —
# web-glue bindings declared in `src/web.rs`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-glue = { workspace = true }

# Browser tests (`tests/location_web.rs`) — run with
# `cargo test -p deep-link --target wasm32-unknown-unknown` (the workspace
# runner supplies web-glue's JS; `wasm-pack test` cannot load it).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Compile-checked usage recipes for the docs / MCP catalog. Off in every
# production build (the recipes — and the framework deps — do not compile then).
[features]
catalog = ["dep:runtime-core", "dep:runtime-vocabulary", "runtime-core/catalog"]
