[package]
name = "kiosk-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "device-admin SDK demo: the kiosk the agent locks in — enters lock task on launch and is the home screen."
# A runnable example, not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
idealyst = { workspace = true }
# `async-driver` for `driver::spawn_async` (lock task and installs are
# async); `runtime-vocabulary` because the `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths; `runtime-scene` because
# `register_scene_extensions` is generic over the registry host.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
device-admin = { workspace = true }

[package.metadata.idealyst.app]
name      = "Kiosk"
bundle_id = "ai.truday.idealyst.kioskapp"
version   = "0.1.0"
targets   = ["android", "ios"]

# This app is the kiosk: the main activity enters lock task on launch once
# the agent allow-lists it, and is declared a home screen so the agent can
# make it the persistent launcher.
[package.metadata.idealyst.app.android]
lock_task_mode = "if_whitelisted"
home_launcher  = true
