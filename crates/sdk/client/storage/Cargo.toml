[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cross-platform INSECURE (plaintext) key-value storage for non-sensitive
# app data — preferences, UI state, caches. NOT for secrets; the
# `credentials` SDK owns that (Keychain/Keystore + httpOnly). This is the
# AsyncStorage half of the AsyncStorage-vs-SecureStore split.
#
# An async `Storage` trait + `platform_storage(name)` picking the native
# plaintext store per target:
#   - MemoryStorage          : in-process (tests, ephemeral) — all targets
#   - WebStorage             : localStorage                  — web (wasm32)
#   - UserDefaultsStorage    : NSUserDefaults                — iOS / macOS
#   - SharedPrefsStorage     : SharedPreferences             — Android
#   - FileStorage            : a JSON file on disk           — Windows / Linux

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

# Only pulled for the `reactive` / `catalog` features. The base key-value
# capability has no framework dependency — it's platform shims — which is why
# these are optional and why the `runtime_core` alias at the crate root is
# `reactive`-gated (an optional-dependency gate, not a core selector).
# `runtime-vocabulary` is direct because the recipes' `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths.
runtime-core = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }

# Compile-checked usage recipes for the docs/MCP catalog. Off in every
# production build (the `recipe!` macro then expands to nothing).
[features]
# `persisted_signal` — the storage↔signal rail (hydrate + persist-on-change
# with user-writes-win semantics). Opt-in so the base crate stays a
# dependency-free platform shim.
reactive = ["dep:runtime-core", "dep:runtime-vocabulary", "runtime-core/async-driver"]
catalog = ["reactive", "runtime-core/catalog"]

# Web (wasm): localStorage via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# iOS / macOS / tvOS: NSUserDefaults via the Obj-C runtime (objc2).
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }

# Android: SharedPreferences via JNI on the host Activity context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Drives the inline (native-fallback) async path in `persisted` tests.
pollster = "0.3"
