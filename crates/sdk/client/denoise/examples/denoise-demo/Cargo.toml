[package]
name = "denoise-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Noise-suppression SDK demo — opens the mic, runs it through `denoise` (DeepFilterNet 3), and shows raw-input vs. denoised level meters side by side. Make background noise without speaking: the denoised bar drops while the raw bar stays up."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

# Pure `rlib` app crate — platform-agnostic. `microphone` and `denoise` are
# both internally cfg-gated, so the app just calls them and the right backend
# compiles per target (denoise's DSP is identical on every native target).
[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper.
sidecar = ["dep:dev-server"]

[dependencies]
# The author surface. `runtime-core` is aliased to `runtime_core` at the
# crate root (see src/lib.rs) — one core, no feature switch;
# `async-driver` because the model preload + record/stop handlers use
# `driver::spawn_async`. `runtime-vocabulary` is needed because the `ui!`
# emission spells absolute `::runtime_vocabulary::glue::…` paths (and for
# the caps bounds the renderer/player `register`s ask for), and
# `runtime-scene` for the scene `Registry` in the registration seam.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
microphone = { workspace = true }
denoise = { workspace = true }
# Record each stream (raw + denoised) to an .m4a, and play them back
# in-app. `video::register` is composed into `register_scene_extensions`
# (the scene registry has no self-registration — an unregistered payload
# panics at realize).
media-writer = { workspace = true }
files = { workspace = true }
video = { workspace = true }
# GPU waveform scrubber. `canvas` is the SDK; `canvas-native` is the CPU
# base renderer (registered first, on every target); `canvas-vello`
# (target-gated below) is the GPU renderer registered SECOND, so it wins
# on the payload key where it can run and self-gates off where it can't
# (no WebGPU in the browser, Vulkan without f16 on the Android emulator).
canvas = { workspace = true }
canvas-native = { workspace = true }
dev-server = { workspace = true, optional = true }

[target.'cfg(any(target_arch = "wasm32", all(not(target_arch = "wasm32"), any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
# GPU canvas: vello over WebGPU (web) / Metal (macOS, iOS) / Vulkan
# (Android). Its `register` is caps-generic (`GraphicsOps +
# StyleServices`) and self-gating, so the seam calls it unconditionally on
# these targets. Desktop Linux/Windows stay on canvas-native.
canvas-vello = { workspace = true }

# Web only: the DeepFilterNet model isn't bundled into the wasm binary (that's
# the `denoise` SDK's small-bundle design). Instead it rides in a lazily-loaded
# `wasm-split` chunk: `include_bytes!(model)` lives behind a `lazy_loader!`
# function, so the splitter moves the 7.6 MB data segment into a separate
# `chunk_N_split.wasm` that's fetched only on first denoiser use — the main
# bundle stays small. Native uses the embedded `Denoiser::new()` (no chunk).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-split = { workspace = true }
# The concrete `WebBackend` — `video::register` is
# `Registry<WebBackend>`-concrete on wasm32 (the real `<video>` element),
# so the registration seam specializes there.
backend-web = { workspace = true }

# The mic capability + its OS prompt reason. `denoise` declares no capability
# of its own (it consumes an existing stream), so the only permission injected
# is the microphone one, sourced from the `microphone` dependency.
[package.metadata.idealyst.app]
name      = "Denoise Demo"
bundle_id = "ai.truday.idealyst.denoisedemo"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos"]

[package.metadata.idealyst.app.permissions]
microphone = "Denoise Demo cleans your microphone input with on-device noise suppression."
