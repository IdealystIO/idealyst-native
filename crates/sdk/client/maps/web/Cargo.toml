[package]
name = "maps-web"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Web leaf for the `maps` umbrella. Provides
# `pub fn build_map_iframe(&Rc<MapViewProps>) -> web_sys::Element`, the
# node builder the umbrella's scene handler mounts. Renders an
# OpenStreetMap embed iframe — simple proof of the pipeline without an
# FFI binding story for Leaflet / MapLibre.

[dependencies]
maps-core = { workspace = true }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlIFrameElement", "Window"] }
