[package]
name = "keep-awake-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Keeps the display on with the keep-awake SDK: two counted holds and a component-scoped one."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[features]
# `sidecar`: enabled ONLY by the CLI-generated native sidecar wrapper.
sidecar = ["dep:dev-server"]

[dependencies]
# The platform surface, used by `src/main.rs` only.
idealyst = { workspace = true }
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
keep-awake = { workspace = true }
dev-server = { workspace = true, optional = true }

[package.metadata.idealyst.app]
name      = "Keep Awake"
bundle_id = "io.idealyst.keepawakedemo"
version   = "0.0.1"
targets   = ["android", "ios", "web", "macos", "windows", "linux"]
