[package]
name = "markdown"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party `Markdown` primitive — renders a CommonMark/GFM document
# as semantic DOM through ONE caps-generic scene handler, so every
# caps-complete host (web, SSR, native) mounts the identical tree.
#
# Rationale (see README): a markdown document is a deeply nested tree of
# blocks and inline runs. Lowering it to framework primitives would emit
# one styled `text`/`view` node per inline run — the exact per-token
# explosion the `codeblock` SDK was carved out to avoid (100–300× more
# backend ops per render). Instead the SDK resolves the document
# author-side and hands ONE payload to the scene registry, whose handler
# builds the host element tree directly.
#
# Parsing + theme resolution happen author-side (in the `Markdown` tag's
# reactive region) and produce a fully-resolved, serializable
# `MarkdownDoc`. The handler is "dumb": it lowers concrete runs into
# styled host nodes. Theme toggles re-resolve the doc → the node is
# rebuilt.

[dependencies]
# The scene registry (`item` + `MountCx`/`Registry`) + the vocabulary
# caps the mount handler drives (`DocumentOps::create_element`,
# `TextOps::create_text`, `StyleOps::apply_style`) + `style_attach` for
# the author-style channel + `glue` for the manual
# `BuildElement`/`Reactive`/`switch` tag. `runtime-shared` supplies the
# style vocabulary (`StyleRules`, `Tokenized`, …) + `Ref`.
runtime-scene = { workspace = true }
runtime-shared = { workspace = true }
runtime-vocabulary = { workspace = true }

# CommonMark + GFM (strikethrough, task lists) pull parser. Pure Rust,
# compiles on every target incl. wasm32. `default-features = false`
# drops the `html` renderer and the `getopts`-backed CLI bits we don't
# use — we only consume the event stream.
pulldown-cmark = { version = "0.12", default-features = false }

# Wire serde for `MarkdownDoc` so a resolved document can cross the
# runtime-server wire (recorder serializes it; the device deserializes).
serde = { workspace = true }

# Web handler self-registers a `WebExternalRegistrar` (the generic
# `register` monomorphized to `WebBackend`), so the web backend must be a
# named dependency on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

# Android handler builds a plain `android.widget.TextView` + a
# `SpannableStringBuilder` directly via JNI (no custom Kotlin class — a
# plain TextView gets width-aware wrapping measurement automatically;
# see android.rs). Target-gated so non-Android targets don't link the
# Android backend.
[target.'cfg(all(target_os = "android", not(target_arch = "wasm32")))'.dependencies]
backend-android-mobile = { workspace = true }
jni = "0.21"

# Linux (GTK4) handler builds one `gtk::Label` whose per-segment styling
# is carried as `pango::Attr*` ranges on a single `pango::AttrList` (the
# GTK analogue of the iOS `NSAttributedString` path). Depends on the Linux
# backend's `register_external` / `register_external_view` inherent methods
# plus `gtk4` for the Label + Pango attributes. Target-gated so non-Linux
# targets don't link GTK.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dependencies]
backend-linux = { workspace = true }
gtk4 = { version = "0.9", features = ["v4_12"] }
runtime-core = { workspace = true }

# iOS handler builds one UILabel whose attributedText is an
# NSAttributedString with per-range font/size/color/background/underline
# attributes, plus objc2 for the message sends.
[target.'cfg(all(target_os = "ios", not(target_arch = "wasm32")))'.dependencies]
backend-ios-mobile = { workspace = true }
backend-ios-core = { workspace = true }
objc2 = "0.5"
# `NSAttributedString` feature also gates `NSMutableAttributedString`
# (same module). Paragraph styling is NOT used — block spacing is blank
# lines, list indent is leading spaces — so no `NSParagraphStyle`.
objc2-foundation = { version = "0.2", features = [
    "NSAttributedString",
    "NSDictionary",
    "NSString",
    "NSRange",
] }
objc2-ui-kit = { version = "0.2", features = [
    "UILabel",
    "UIColor",
] }
# tests/markdown.rs mounts markdown through the scene registry
# end-to-end on the shared host-mock recording substrate.
[dev-dependencies]
host-mock = { workspace = true }
