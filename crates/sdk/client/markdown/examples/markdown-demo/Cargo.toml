[package]
name = "markdown-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Markdown SDK demo — renders a CommonMark/GFM document through the SDK's one caps-generic scene handler (semantic host DOM on every backend), with a live light/dark theme toggle proving styles re-apply on theme change."

[lib]
crate-type = ["rlib"]

[dependencies]
# The author surface. `runtime-core` is aliased to `runtime_core` at the
# crate root (see src/lib.rs) — one core, no feature switch.
# `runtime-vocabulary` is needed because the `ui!` emission spells
# absolute `::runtime_vocabulary::glue::…` paths, and `runtime-scene`
# because `register_scene_extensions` is generic over the scene `Registry`
# host.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
markdown = { workspace = true }

# No backend deps: `markdown::register` is ONE caps-generic registration
# valid for every host (`H: StyleServices + TextOps`), so this crate stays
# fully platform-agnostic — the CLI-generated wrappers bring their own
# concrete backend and pin `H` at the call site.

[package.metadata.idealyst.app]
name      = "Markdown Demo"
bundle_id = "ai.truday.idealyst.markdowndemo"
version   = "0.0.1"
targets   = ["web", "ios", "android"]
