[package]
name = "audio"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Cross-platform sound PLAYBACK SDK — the playback peer of the capture SDKs
# (`microphone` / `camera`). One small API:
#
#   let sound = audio::load(AudioSource::path("ding.wav")).await?;
#   let playback = sound.play();      // returns a controllable handle
#   playback.set_volume(0.5);
#   // drop(playback) — or playback.stop() — stops the sound
#
# Load (decode/prepare) a sound from bytes / a file path / a URL, then play
# it, getting back a thin RAII `Playback` handle you control (pause/resume/
# stop/volume/looping) and whose Drop stops the sound. Deliberately
# unopinionated: foreground playback of loaded sounds, nothing more. Mixing,
# effects, spatialization, playlists, and background audio are later layers.
#
# Per-platform mechanism (one author API, identical observable behavior):
#   - web (wasm32):                HTMLAudioElement (`new Audio()` + src)
#   - iOS / macOS / tvOS:          AVAudioPlayer (objc2)
#   - Android:                     MediaPlayer (JNI)
#   - Linux / desktop ALSA·PipeWire: GStreamer (streams remote URLs, like mobile)
#   - Windows / other native:      NotSupported fallback (no heavy dep pulled in)
#
# No permissions required for foreground playback. Background audio (keeping
# sound going when the app is backgrounded) needs app config and is out of
# scope — see README.

[dependencies]
# Pure-Rust surface + the `runtime_core::recipe!` macro for the catalog.
# The author surface, aliased to `runtime_core` at the crate root (see
# src/lib.rs). `runtime-vocabulary` is a direct dep because the `ui!`
# emission inside the recipes spells absolute `::runtime_vocabulary::glue::…`
# paths.
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }

# Web (wasm): HTMLAudioElement via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "HtmlAudioElement",
    "HtmlMediaElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }

# iOS / macOS / tvOS: AVAudioPlayer via the Obj-C runtime (objc2), matching
# the `microphone` / `camera` house style (no typed framework crate).
[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos"))'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSData", "NSURL"] }

# Android: MediaPlayer via JNI on the host Activity context, mirroring the
# `microphone` Android backend (`ndk-context` exposes the JavaVM).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Linux / desktop native: GStreamer (the native Linux media stack). Unlike the
# previous `rodio` backend it PROGRESSIVELY STREAMS remote http(s) URLs via
# `souphttpsrc` — restoring parity with Android/Apple/web, which all stream
# remote URLs. We drive a small hand-built pipeline (decodebin → audioconvert →
# audioresample → volume → autoaudiosink) for volume/pause/resume/stop/looping.
# In-memory `Bytes` are fed via `giostreamsrc` + a `gio::MemoryInputStream` (no
# temp file). gstreamer-rs 0.23.x targets the GStreamer 1.x C API and works
# against the system's 1.28 at runtime (no `v1_24`-style feature gates needed —
# only base 1.0 APIs are used). glib/gio 0.20 match gstreamer-rs 0.23.
#
# This is the pattern-setter for the upcoming GStreamer "media cluster"
# (camera / media-writer / video-decode / screen-recorder): the idempotent
# `gst::init` guard, the dedicated bus-message thread (no GLib main loop
# assumed), and the StreamError→Decode / else→Backend error split are meant to
# be reused there.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.23"
glib = "0.20"
gio = "0.20"

# Recipes (compile-checked usage examples) compile only under `catalog`.
# Forwards `async-driver` so the recipe can use the real
# `runtime_core::driver::spawn_async` pattern (load() is async). Off in
# production: `recipe!` expands to nothing.
[features]
catalog = ["runtime-core/catalog", "runtime-core/async-driver"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
