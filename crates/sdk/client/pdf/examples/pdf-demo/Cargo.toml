[package]
name = "pdf-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "PDF SDK demo — renders a PDF page on the GPU. The page is interpreted (hayro) into a renderer-agnostic canvas Scene (text → glyph runs, vectors → fills, images → blits) and drawn by canvas-vello (vello/Metal/Vulkan/WebGPU), falling back to canvas-native (CPU) where the GPU can't run."
# Not published to the idealyst registry: this crate is a runnable example,
# not a library consumers depend on.
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# The platform surface, used by `src/main.rs` only — it carries whatever
# the target needs, so this manifest names no backend directly. An
# idealyst app IS its binary; there is no generated wrapper crate.
idealyst = { workspace = true }
# `async-driver`: file picking is async (`spawn_async`); without it the macOS
# run loop would block on the await.
runtime-core = { workspace = true, features = ["async-driver"] }
# The `ui!`/`#[component]` expansions spell absolute
# `::runtime_vocabulary::glue::…` paths, so this is a direct dep.
runtime-vocabulary = { workspace = true }
# The registration seam is generic over `runtime_scene::Registry<H>`.
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
canvas = { workspace = true }
# The CPU renderer (Canvas2D / CoreGraphics / android.graphics) — the
# fallback wherever vello cannot run.
canvas-native = { workspace = true }
# The GPU renderer this demo exists to show; it steps aside by itself where
# the GPU cannot run it (see `register_scene_extensions`).
canvas-vello = { workspace = true }
pdf = { workspace = true }
file-picker = { workspace = true }

[package.metadata.idealyst.app]
name      = "PDF Demo"
bundle_id = "ai.truday.idealyst.pdfdemo"
version   = "0.0.1"
targets   = ["macos", "web", "ios", "android"]
