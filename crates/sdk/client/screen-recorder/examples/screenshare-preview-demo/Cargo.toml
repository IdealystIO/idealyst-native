[package]
name = "screenshare-preview-demo"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Screen share → Video demo — the screen-recorder SDK yields a MediaStream (ReplayKit on iOS) and the video SDK displays it. In-app capture records the app's own screen, so the Video shows a recursive 'hall of mirrors' that proves the capture → MediaStream → display path end to end. Sibling of camera-preview-demo for the other MediaStream producer."

[lib]
crate-type = ["rlib"]

[dependencies]
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `async-driver` for the `driver::spawn_async` capture start.
# `runtime-vocabulary` for the `ui!` emission's absolute
# `::runtime_vocabulary::glue::…` paths AND the `caps::ExternalOps` /
# `style_attach::StyleServices` bounds the native registration seam names;
# `runtime-scene` for the `Registry` the seam takes.
runtime-core = { workspace = true, features = ["async-driver"] }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
screen-recorder = { workspace = true }
video = { workspace = true }

# Web's `video::register` / `screen_recorder::register` seam is
# registry-CONCRETE (`Registry<WebBackend>`), so the wasm32 leg of
# `register_scene_extensions` needs the backend's `Host` impl. The native
# legs are registry-generic and type-dispatch inside the SDKs, so no
# per-platform backend dep is needed there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
backend-web = { workspace = true }

[package.metadata.idealyst.app]
name      = "Screen Share"
bundle_id = "ai.truday.idealyst.screenshare"
version   = "0.0.1"
targets   = ["web", "ios", "android", "macos"]

# ReplayKit (iOS) and getDisplayMedia (web) need no Info.plist usage string —
# consent is a runtime prompt. Android MediaProjection's permission lands when
# that backend does. So no `[package.metadata.idealyst.app.permissions]` block.
