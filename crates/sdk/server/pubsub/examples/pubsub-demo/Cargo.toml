[package]
name = "pubsub-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Full-stack pub/sub on the `pubsub` SDK. A `#[server] say` publishes to a topic; a `#[subscription] room_feed` bridges that topic to a WebSocket, so every connected client — on ANY server instance sharing the backend — sees the message. Demonstrates decentralized WebSocket fan-out."

[lib]
crate-type = ["rlib"]

[features]
default = []
# Server build: `#[server]`/`#[subscription]` bodies + the axum host + the
# pubsub backend. `pubsub` is a server-only dep so the wasm client never
# compiles it (all pubsub references live behind this feature).
server = [
    "server/server",
    "dep:pubsub",
    "dep:idealyst-config",
    "dep:tokio",
    "dep:axum",
    "dep:tower-http",
    "dep:futures-util",
]

[dependencies]
server = { workspace = true }
runtime-core = { workspace = true, features = ["async-driver"] }
# The `ui!`/`#[component]` expansions spell absolute
# `::runtime_vocabulary::glue::…` paths, so this is a direct dep.
runtime-vocabulary = { workspace = true }
# The registration seam is generic over `runtime_scene::Registry<H>`.
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
serde = { workspace = true }

# Server-only: all backends enabled so `dev.toml`'s `[pubsub] backend` can pick
# memory / redis / postgres without a rebuild.
pubsub = { workspace = true, optional = true, features = ["redis", "postgres"] }
# Unified config: `configure_all()` reads idealyst.toml and wires pubsub.
# `redis`/`postgres` forwarded so a `[pubsub] backend` can pick either.
idealyst-config = { workspace = true, optional = true, features = ["pubsub", "redis", "postgres"] }
futures-util = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Location"] }

[dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "net"]
optional = true

[dependencies.axum]
version = "0.7"
optional = true

[dependencies.tower-http]
version = "0.6"
features = ["fs"]
optional = true

# End-to-end WS fan-out test (run with --features server).
[dev-dependencies]
net = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[package.metadata.idealyst.app]
name = "PubSub Demo"
bundle_id = "ai.truday.idealyst.pubsubdemo"
version = "0.0.1"
targets = ["web"]
server_bin = "server"
server_port = 3000
