[package]
name = "backend-ios-core"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Shared iOS/tvOS substrate. Holds the FFI plumbing, view-tree
# bookkeeping, rendering, and Foundation/UIKit base bits that both
# `backend-ios-mobile` (touch / phone+tablet) and `backend-ios-tv`
# (focus engine / TVUIKit) depend on. Currently a skeleton — code is
# carved out of `backend-ios-mobile` incrementally as the TV target
# forces the abstraction.

[lib]
crate-type = ["rlib"]

[features]
# Compile in the NSTimer-based `RenderLoopDriver`. Forwards to
# `runtime-shared/async-driver` so `runtime_shared::driver::*` is
# in scope. The leaf crates' `async-driver` feature turns this on.
# Also forwards to `backend-apple-core/async-driver` so the cooperative
# main-thread async executor compiles and `install_scheduler` installs it.
async-driver = ["runtime-shared/async-driver", "backend-apple-core/async-driver"]
# Opt-in `PhaseTimer` instrumentation. Mirrors `backend-web`'s
# feature of the same name — enables a thin `phase_record::scope`
# guard that the leaf `backend-ios-mobile` crate bridges into
# `runtime_shared::debug::record_apply_phase`. Off by default; consumers
# turn it on for one measurement run.
debug-stats = ["runtime-shared/debug-stats"]

[dependencies]
runtime-shared = { workspace = true }
runtime-layout = { workspace = true }
# Cross-Apple substrate (NSLog, scheduler, CoreText font registry,
# color parsing). The UIKit-flavored shims in this crate (font.rs's
# UIFont construction, style.rs's color_to_uicolor) sit on top of
# the apple-core primitives.
backend-apple-core = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
block2 = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSArray",
    "NSEnumerator",
    "NSObject",
    # Enables the safe `MainThreadMarker::new()` (checked, returns Option)
    # instead of the unchecked fabricator.
    "NSThread",
] }
objc2-ui-kit = { version = "0.2", features = [
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIColor",
    # `UIView::layer()` is gated behind this feature: the `UIView` feature
    # only declares `objc2-quartz-core?/CALayer`, an OPTIONAL activation
    # that stays off until `objc2-quartz-core` itself is enabled. Without
    # it `view.layer()` does not exist and `style.rs`'s glyph-shadow path
    # (`text_shadow`, mirroring macOS's `apply_text_shadow`) fails to
    # compile — which is exactly how the iOS build broke.
    "objc2-quartz-core",
] }
raw-window-handle = "0.6"
