# iOS runtime-server SHELL crate.
#
# This is the fixed, app-agnostic staticlib the Swift glue links when
# you run `idealyst dev --ios` (default = runtime-server).
#
# It used to sit above `backend-ios-mobile` so it could bundle the
# first-party SDK crates and register their handlers on the RS client
# backend. Runtime v2 removed that need: SDK scene handlers install on
# the HOST's `Registry<WireRecordingBackend>` (the dev-server sidecar's
# `register_scene_extensions_recorder` seam) and what crosses the wire is
# already ordinary primitive commands. The SDK dependencies are gone; see
# src/lib.rs module docs for the full rationale and the one behavior
# delta it implies.
#
# It re-exports the same `#[no_mangle] ios_main` / `ios_teardown` C
# symbols the Swift host references, so `run-ios` just repoints
# `IOS_AAS_SHELL_PACKAGE` here. The `[lib] name = "backend_ios"` keeps
# the Swift `-lbackend_ios` link flag unchanged.
[package]
name = "backend-ios-rs-shell"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Preserve the staticlib filename the Swift link step expects
# (`libbackend_ios.a`) so `run-ios` only has to change the package,
# not the `-l` flag.
name = "backend_ios"
crate-type = ["staticlib", "rlib"]

[target.'cfg(target_os = "ios")'.dependencies]
backend-ios-mobile = { workspace = true, features = ["runtime-server"] }
