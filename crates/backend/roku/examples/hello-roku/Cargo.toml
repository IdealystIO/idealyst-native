[package]
name = "hello-roku"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

# Plain library — `idealyst build roku` generates the snapshot
# binary that calls `app()` on its own. Authors don't have to write
# a bin target themselves.
[lib]
crate-type = ["rlib"]

[features]
# `robot` mirrors `runtime-core/robot` — when the workspace test
# build activates the framework's `robot` feature transitively (via
# `dev-server`'s dev-deps), the `ui!` macro's `#[cfg(feature =
# "robot")]` gate evaluated in this crate's context needs to see
# `robot` enabled too, otherwise the lowered struct-literal omits
# the view's `test_id` while the struct definition includes it.
default = ["robot"]
robot = ["runtime-core/robot"]

[dependencies]
# `runtime-core` is aliased to `runtime_core` at the crate root (see
# src/lib.rs); `runtime-vocabulary` because the `ui!` / `stylesheet!`
# emissions spell absolute `::runtime_vocabulary::glue::…` paths;
# `runtime-scene` because `register_scene_extensions` is generic over the
# registry host (the snapshot wrapper `idealyst build roku` generates
# passes it a `Registry<RokuBackend>`).
runtime-core = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-scene = { workspace = true }
idea-ui = { workspace = true }
backend-roku = { workspace = true }
