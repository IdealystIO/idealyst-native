[package]
name = "backend-roku"
version.workspace = true
edition.workspace = true
license.workspace = true

# Pure Rust crate: emits a serializable command stream that a
# BrightScript / SceneGraph thin client on the Roku device consumes.
# There is no platform-cfg gating because Roku has no Rust target —
# the backend always compiles, always runs on the host, and the wire
# transport (TCP, WebSocket, file, ...) is supplied by the embedder.
[lib]
crate-type = ["rlib"]

[features]
# New-core (idea-lite) adoption: `newcore::start` mounts a scene-element
# tree on a `runtime_world::World` through the vocabulary's builtin
# handlers, with `RokuBackend` implementing `runtime_scene::Host` + all
# 30 capability traits directly, and an embedder-driven flush driver
# (device event -> HandlerTable dispatch -> staged writes ->
# `newcore::settle()` -> emitted commands). Additive — the old-core
# snapshot/render path is untouched with or without this feature (same
# convention as backend-terminal's `new-core`).
new-core = [
    "dep:runtime-world",
    "dep:runtime-scene",
    "dep:runtime-vocabulary",
    # `create_navigator` (old-Element-typed NavigatorHost) is behind the
    # vocabulary's `legacy-bridge` gate; this backend's newcore.rs
    # implements it by delegating to the old Backend impl.
    "runtime-vocabulary/legacy-bridge",
]

[dependencies]
runtime-core = { workspace = true }
backend-roku-macros = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
# New-core migration crates — only compiled under the `new-core` feature.
runtime-world = { workspace = true, optional = true }
runtime-scene = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
