[package]
name = "backend-roku"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Pure Rust crate: emits a serializable command stream that a
# BrightScript / SceneGraph thin client on the Roku device consumes.
# There is no platform-cfg gating because Roku has no Rust target —
# the backend always compiles, always runs on the host, and the wire
# transport (TCP, WebSocket, file, ...) is supplied by the embedder.
[lib]
crate-type = ["rlib"]

[features]

[dependencies]
# The permanent substrate both cores compiled against (style engine,
# tokens, prop/handle structs, scheduling, viewport). `runtime-core` is
# NOT a dependency: this backend has no `Element`/`Backend` surface left.
runtime-shared = { workspace = true }
backend-roku-macros = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# Frozen old-core output for the cross-core parity corpus, so the gate
# survives the deletion of the old core. See tests/goldens/README.md.
parity-goldens = { path = "../../dev/parity-goldens" }
