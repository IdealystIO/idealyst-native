[package]
name = "backend-web"
version = "2.0.2"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The `prim-*` / `style-dynamic` bundle-size gates are GONE (runtime v2).
# They compiled out walker arms, builder fns and `Backend` methods — none
# of which exist any more; the vocabulary has no per-primitive gating
# model, so keeping them only made the capability impls call mechanism
# functions that a non-default build had removed. Same cleanup idea-ui
# made. A consumer's `features = ["prim-…"]` is an unknown-feature error
# now, which is the honest signal.
hydrate = []
# The dev-time UI overlay's PAGE half: `__idealyst_overlay_patch`, the
# entry point the livereload script calls when the dev loop decided a
# save needs no rebuild.
#
# Forwards to the crates that own the gate (rule 6) — `runtime-vocabulary`
# for the applier and the per-node tag, `wire` for the payload shape,
# which is the same one the runtime-server path puts on the socket so one
# format serves both dev shapes. The EMISSION half
# (`runtime-macros/ui-overlay`) is not reachable from here and comes from
# the app crate enabling `runtime-core/ui-overlay`, which is what
# `idealyst dev --web` passes. `build --web` never does.
ui-overlay = ["runtime-vocabulary/ui-overlay", "dep:wire", "wire/runtime-patch", "dep:runtime-template"]
# Forwards to runtime-core's `debug-stats`. When on, the web
# backend reports per-phase timings (`set_attribute`, `insert_rule`,
# etc.) into the framework's phase-counter aggregator so apply-style
# hot paths can be profiled from JS via `dump_debug_events`.
debug-stats = ["runtime-shared/debug-stats"]
# Compile in this backend's `requestAnimationFrame`-based
# `RenderLoopDriver` and web-glue-based `AsyncExecutor`. Forwards to
# `runtime-shared/async-driver` so `render_loop` / `spawn_async` resolve.
# Host calls `install_render_loop()` and `install_async_executor()` once
# at init.
async-driver = ["runtime-shared/async-driver"]
# Compile in the runtime-server-client browser transport (`connect_web` +
# `WebClientHandle`). Forwards to `dev-client/dev-hot-reload` so the
# `WireBackend` replay engine is available. Off by default — the
# native-rendering build path pays no cost.
runtime-server = ["dep:dev-client", "dep:wire", "dev-client/dev-hot-reload"]
# The wasm hot-patch tier's PAGE half: `__idealyst_hot_patch`, which the
# livereload script calls with a patch module's URL and a serialized
# `subsecond_types::JumpTable`. It applies the patch and rebuilds the tree
# against it, carrying signal values through `runtime_world::hot_state`.
#
# Forwards to `dev-hot/hot` (the subsecond facade) and
# `runtime-world/hot-reload` (the state carry). The SPLIT half — the
# `__*_hot_impl` functions a jump table redirects — is not reachable from
# here and comes from the app crate enabling `runtime-core/hot-reload`,
# which is what `idealyst dev --web --local` passes. `build --web` never
# does, so a shipped bundle carries none of it.
hot-reload = [
    "dep:dev-hot",
    "dev-hot/hot",
    "dep:subsecond-types",
    "runtime-world/hot-reload",
]
# Stamp a `data-idealyst-id="N"` attribute on every Element the
# framework has minted a node id for. Pure developer ergonomic —
# makes the per-node id visible in browser devtools and e2e
# selectors. Off by default so production builds don't pollute the
# DOM. Identity itself doesn't depend on this attribute (a JS-side
# `WeakMap` is the source of truth either way); this just mirrors
# the id outwards for inspection.
debug-node-ids = []
# Compile in the web Robot transport (`install_robot_relay_client`): a
# WebSocket dial-out to a `robot-relay` so a browser app exposes the Robot
# bridge it can't host itself. Forwards to `runtime-shared/robot` for the
# dispatch core. Off by default; `idealyst dev --web` enables it.
# `runtime-vocabulary?/robot`: when the `new-core` boot path is ALSO
# compiled, the transport routes verbs to the vocabulary registry for a
# new-core app (see robot_transport::dispatch_verb) — the `?/` forward
# turns that registry on without dragging runtime-vocabulary into
# old-core-only robot builds.
robot = ["runtime-shared/robot", "runtime-vocabulary/robot"]

[dependencies]
# PATH dep with `default-features = false`, NOT `workspace = true`: the
# workspace spec carries runtime-core's default (all-prim) feature set, and
# cargo ignores `default-features = false` on workspace-inherited deps — a
# plain `workspace = true` here would force every `prim-*` feature back ON
# for any app that disabled them (feature unification), silently defeating
# the whole gating scheme. The `prim-*` forwards above re-enable exactly
# the families this crate's own features select; this crate's defaults
# cover all of them, so consumers with default features see no change.
# (Same precedent as canvas-vello → canvas-native `self-register`.)
runtime-shared = { workspace = true }
# The runtime the backend renders: world (signal arenas), scene (Host +
# Registry) and vocabulary (the capability traits + builtin handlers).
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }
runtime-template = { workspace = true, optional = true }
css = { workspace = true }
inventory = "0.3"
# The framework-owned JS boundary (docs/proposals/own-web-bindings.md):
# every DOM operation, listener, timer and shim call in this crate goes
# through it (phase 2b).
# A dropped file reaches the file-picker SDK as a `web_glue::dom::File` in
# `DroppedFile::source`; no crate boundary here names web-sys.
web-glue = { workspace = true }
serde_json = { workspace = true }
# runtime-server dev-client replay engine + wire protocol. Only pulled in when
# the `runtime-server` feature is on; the WebSocket transport itself
# lives in this crate's `dev_transport` module.
dev-client = { workspace = true, optional = true }
# The subsecond facade. Optional so a bundle without the hot-patch tier
# links none of it; `dev-hot`'s own `hot` feature is what pulls subsecond
# in, and with it off the crate is a pass-through with no runtime cost.
dev-hot = { workspace = true, optional = true }
# `JumpTable` — subsecond's own type, deserialized straight off the wire
# so the dev server and the runtime cannot disagree about its shape.
subsecond-types = { version = "0.7", optional = true }
wire = { workspace = true, optional = true }
# Used by the Graphics primitive to expose the `<canvas>` as a
# standard `WebCanvasWindowHandle` + `WebDisplayHandle` for any GPU
# library the author chooses (wgpu, glow, vello, ...). Tiny dep
# (a handful of enums + traits, no platform code).
raw-window-handle = "0.6"

[dev-dependencies]
# Browser-side test harness for `WebBackend` unit tests. Runs via
# `wasm-pack test --headless --chrome --package backend-web`. Required
# for tests that need real DOM (the `node_id` identity invariant
# can't be verified without it).
wasm-bindgen-test = "0.3"
