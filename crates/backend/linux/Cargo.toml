[package]
name = "backend-linux"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# Native GTK4 backend for `runtime_core::Backend`. Uses `gtk4-rs` to
# create real GTK widgets — a custom `IdealystView` (GtkFixed subclass
# that paints background/gradient/border/clip via GSK) for `view` /
# `pressable`, `gtk::Label` (Text, styled via Pango), `gtk::Button`,
# `gtk::Entry` (TextInput), `gtk::Switch` (Toggle), `gtk::Scale`
# (Slider) — parented under a `gtk::Window` owned by the host shell
# (see the `host-gtk` crate). Layout is a Taffy pass; styling +
# transforms + the per-frame animation fast-path are implemented, so
# an animated app (the `welcome` example) renders natively.
#
# The lib body is gated on `cfg(target_os = "linux")` so workspace
# builds on macOS / Windows hosts compile this to an empty rlib
# without pulling `gtk4` into the dep graph.
#
# Requirements (Linux host): GTK ≥ 4.12 dev headers (`libgtk-4-dev` /
# `gtk4-devel`) and Pango ≥ 1.56 — the latter for
# `PangoFontMap::add_font_file`, used to register embedded `face!`
# fonts at runtime (Pango 1.56 shipped with GNOME 48 / early 2025;
# GTK 4.14+ distros ship it).
#
# Scope: `view` / `text` / `icon` / layout / styling / animation are
# complete (icon strokes/fills Lucide glyph paths via GSK; stroke draw-on
# animation is the one gap — icons render fully drawn); image /
# virtualizer / navigator / portal / external render a labeled
# placeholder (never panic) pending a general-purpose pass.

[lib]
crate-type = ["rlib"]

[features]
# Robot/automation surface. Turns on the vocabulary's element REGISTRY (which
# the walker registers every mounted primitive into) and the shared bridge
# TRANSPORT, and compiles `newcore::install_robot_env` into the boot path.
#
# Both halves are needed and neither implies the other: with only the transport
# the bridge binds and answers every verb from the OLD (empty) registry, so
# `find_element` returns `null` and `get_snapshot` returns `[]` for a perfectly
# healthy app — a silently blinded driver rather than an error. See
# `newcore::install_robot_env`.
robot = ["runtime-vocabulary/robot", "runtime-shared/robot"]

[dependencies]
# The permanent substrate both cores compiled against (style engine,
# tokens, prop/handle structs, scheduling, viewport). `runtime-core` is
# NOT a dependency: this backend has no `Element`/`Backend` surface left.
runtime-shared = { workspace = true }
runtime-layout = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

# `gtk4-rs` provides the safe Rust bindings to GTK4. The `v4_X` feature
# flags gate API coverage by GTK version. `v4_14` is the floor: the icon
# primitive strokes/fills glyph paths through `gsk::PathBuilder` +
# `gtk::Snapshot::append_stroke`/`append_fill`, all of which landed in
# GTK 4.14 (the retained-mode `GskPath` API). Everything else this
# backend calls (GskFixed transforms, GSK snapshot nodes, subclassing)
# is ≤ 4.12. `pango` is re-exported by `gtk4`, but its `add_font_file`
# binding is gated behind `v1_56`, which `gtk4/v4_14` doesn't enable —
# so we depend on `pango` directly with `v1_56` to unify the feature on.
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
pango = { version = "0.20", features = ["v1_56"] }
# The `graphics` primitive resolves GL entry points out of libepoxy (which GTK
# already links for its own GL renderer) via `dlopen`/`dlsym`. libepoxy exports
# GL functions as DATA symbols (`epoxy_glClear`, a lazily-resolved dispatch
# pointer), not as callable symbols, so the lookup has to read the pointer out
# of the variable. `libc` is already in the workspace lock (a transitive dep),
# so this adds no new external crate. See `src/gl_loader.rs`.
libc = "0.2"
# Link-time self-registration of SDK `Element::External` handlers
# (`LinuxExternalRegistrar`), matching the macOS/iOS/Android backends. An
# SDK submits a registrar; `LinuxBackend::new` drains them.
inventory = "0.3"

# Proof that the `GlTarget` this backend hands out is actually adoptable by a
# real GPU library — `tests/gl_target_adoption.rs` stands up a live GtkGLArea,
# adopts its context through wgpu's GLES HAL exactly the way a consumer would,
# renders, and reads the pixels back. Dev-only: nothing in the shipped backend
# links wgpu. Same wgpu major (29) every other GPU consumer in the workspace
# pins, so `new_external`/`create_adapter_from_hal` match what they'd call.
# `wgpu-hal` is a direct dep because `wgpu::hal` re-exports only the generic
# API, not the `gles::Adapter::new_external` constructor.
[target.'cfg(target_os = "linux")'.dev-dependencies]
wgpu = { version = "29", default-features = false, features = ["gles", "wgsl"] }
wgpu-hal = { version = "29", features = ["gles"] }
wgpu-types = "29"
pollster = "0.4"
