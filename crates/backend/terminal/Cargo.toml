[package]
name = "backend-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

# ASCII / terminal backend for `runtime_core::Backend`. Renders the
# UI tree into a character grid that the `host-terminal` crate paints
# to stdout with ANSI colors via crossterm. Mouse + keyboard input
# are forwarded back into the framework through `Action`/`on_click`
# callbacks and the per-primitive key handlers.
#
# It is a flex (the joke kind, not the layout kind) — but also a
# legit testbed: no GPU, no native widgets, no window system. Just
# `cargo run`.

[lib]
crate-type = ["rlib"]

[features]
# New-core (idea-lite) adoption: `newcore::start` mounts a scene-element
# tree on a `runtime_world::World` through the vocabulary's builtin
# handlers, with `TerminalBackend` implementing `runtime_scene::Host` +
# all 30 capability traits directly, and a dispatch-hook flush driver
# (input events -> staged writes -> one deduped flush; timers through
# the host scheduler, which fires `dispatch_hook` after author
# callbacks). Additive — the old-core mount path is untouched with or
# without this feature (same convention as backend-ssr's `new-core`).
new-core = [
    "dep:runtime-world",
    "dep:runtime-scene",
    "dep:runtime-vocabulary",
    # `create_navigator` (old-Element-typed NavigatorHost) is behind the
    # vocabulary's `legacy-bridge` gate; this backend's newcore.rs
    # implements it by delegating to the old Backend impl.
    "runtime-vocabulary/legacy-bridge",
]

[dependencies]
runtime-core = { workspace = true }
runtime-layout = { workspace = true }
inventory = "0.3"
# New-core migration crates — only compiled under the `new-core` feature.
runtime-world = { workspace = true, optional = true }
runtime-scene = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
