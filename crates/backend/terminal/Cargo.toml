[package]
name = "backend-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true

# ASCII / terminal backend for `runtime_core::Backend`. Renders the
# UI tree into a character grid that the `host-terminal` crate paints
# to stdout with ANSI colors via crossterm. Mouse + keyboard input
# are forwarded back into the framework through `Action`/`on_click`
# callbacks and the per-primitive key handlers.
#
# It is a flex (the joke kind, not the layout kind) — but also a
# legit testbed: no GPU, no native widgets, no window system. Just
# `cargo run`.

[lib]
crate-type = ["rlib"]

[features]

[dependencies]
# The permanent substrate both cores compiled against (style engine,
# tokens, prop/handle structs, scheduling, viewport). `runtime-core` is
# NOT a dependency: this backend has no `Element`/`Backend` surface left.
runtime-shared = { workspace = true }
runtime-layout = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# Frozen old-core output for the cross-core parity corpus, so the gate
# survives the deletion of the old core. See tests/goldens/README.md.
parity-goldens = { workspace = true }
