[package]
name = "backend-terminal"
version = "2.2.0"
edition.workspace = true
license.workspace = true

# ASCII / terminal backend (scene `Host` + capability traits). Renders the
# UI tree into a character grid that the `host-terminal` crate paints
# to stdout with ANSI colors via crossterm. Mouse + keyboard input
# are forwarded back into the framework through `Action`/`on_click`
# callbacks and the per-primitive key handlers.
#
# It is a flex (the joke kind, not the layout kind) — but also a
# legit testbed: no GPU, no native widgets, no window system. Just
# `cargo run`.

[lib]
crate-type = ["rlib"]

[features]

[dependencies]
# The shared substrate (style engine, tokens, prop/handle structs,
# scheduling, viewport). Backends never depend on `runtime-core` (the
# author surface).
runtime-shared = { workspace = true }
runtime-layout = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

[dev-dependencies]
# Committed golden output the parity tests compare against. See
# tests/goldens/README.md.
parity-goldens = { path = "../../dev/parity-goldens" }
