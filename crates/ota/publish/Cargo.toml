# ota-publish — writes over-the-air releases of remote-component bundles to a
# release location (an S3 prefix, or a directory): the bundles, then the
# index apps read. What `idealyst ota publish` / `rollback` / `status` run.

[package]
name = "ota-publish"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Publishes idealyst over-the-air remote-component releases to S3 or a directory"

[dependencies]
anyhow = "1"
ota-index = { workspace = true }
remote-bundle = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
