# ota-publish — writes over-the-air releases of remote-component bundles to a
# release location (an S3 prefix, or a directory): the bundles, then the
# index apps read. What `idealyst ota publish` / `rollback` / `status` run.

[package]
name = "ota-publish"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Publishes idealyst over-the-air remote-component releases to S3 or a directory"

[features]
# S3 over HTTP with configured keys, signed in-process: what a server (the
# console) uses instead of the `aws` CLI.
s3-http = ["dep:reqwest", "dep:hmac", "dep:sha2"]

[dependencies]
anyhow = "1"
ota-index = { workspace = true }
remote-bundle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
