[package]
name = "idea-ui-nav"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Themed navigation chrome (TabBar / Drawer / StackHeader) for the idealyst swap & stack navigators — the author-layout that wraps a navigator's outlet."

[lib]
crate-type = ["rlib"]

[features]
# Mirror idea-ui: reflective doc-control panels for idea-ui-docs.
docs = ["idea-ui/docs"]
# Forward a `test_id` to the root interactive primitive for robot/E2E.
robot = ["runtime-core/robot", "idea-ui/robot"]

[dependencies]
# The framework author surface, reached under the historical `runtime_core`
# name via the crate-root `extern crate runtime_core as runtime_core;`
# alias in lib.rs.
runtime-core = { workspace = true }
# The `ui!` / `#[component]` emission spells absolute
# `::runtime_vocabulary::glue::…` paths.
runtime-vocabulary = { workspace = true }
# Same theme as idea-ui, and piggybacks on its components (Tabs strip, Icon,
# Button) rather than reimplementing chrome from primitives.
idea-theme = { workspace = true }
idea-ui = { workspace = true }

[dev-dependencies]
# Theme install + resolve for component tests.
idea-theme = { path = "../idea-theme" }
# The recording scene `Host` + capability mock every render test mounts on
# (`crates/dev/host-mock`).
host-mock = { path = "../../dev/host-mock" }
