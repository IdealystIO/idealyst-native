[package]
name = "idea-theme"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Theming abstraction + extensibility for the idealyst design system"

[lib]
crate-type = ["rlib"]

[dependencies]
# PATH dep with `default-features = false` (cargo ignores that flag on
# `workspace = true` lines): idea-theme sits under idea-ui in every app's
# dep tree, and a workspace dep would silently re-enable all `prim-*`
# defaults, defeating idea-ui's per-component gating. Themes only touch
# style/token types, which are ungated.
runtime-core = { path = "../../runtime/core", default-features = false }

# Compile-checked usage recipes for the docs/MCP catalog (see
# src/recipes.rs). Off in every production build — the `recipe!` macro
# expands to nothing without it, so recipes cost zero in shipped apps.
[features]
catalog = ["runtime-core/catalog"]
