[package]
name = "idea-theme"
version = "1.6.1"
edition.workspace = true
license.workspace = true
description = "Theming abstraction + extensibility for the idealyst design system"

[lib]
crate-type = ["rlib"]

[dependencies]
# The framework author surface. `lib.rs` declares `extern crate
# runtime_core as runtime_core;` at its root, which shadows the
# extern-prelude for the whole crate — so every `runtime_core::X` path
# in this crate resolves against `runtime_vocabulary::glue`'s author
# surface. The alias (rather than a tree-wide rename) keeps `runtime_core::…`
# spellings stable in this crate, in idea-ui, and in the docs that
# quote them.
runtime-core = { workspace = true }
# Pulled in only with `catalog`, and never named in code: the
# `#[schema(value_of = …, via = …)]` annotations on the built-in markers
# are read by the catalog crate (`ValueEntry::spelled` / `import` parse
# `via`), so this crate's PUBLISHED manifest must carry the catalog
# version its annotations were written for. Without this line the
# requirement only reached consumers through runtime-core's floors,
# and a locked consumer kept an older catalog that spelled the values
# wrong or dropped them.
mcp-catalog = { workspace = true, optional = true }
# `recipe!` (and every other catalog-capturing macro) emits absolute
# `::runtime_vocabulary::glue::…` paths, so the vocabulary must be a DIRECT
# dependency, not only a transitive one through the facade. Unconditional
# rather than `optional = true` + `catalog = ["dep:…"]`: the catalog feature
# is turned on graph-wide by whichever tool wants capture, and a missing
# direct dep here surfaced as `cannot find runtime_vocabulary in the crate
# root` when it was.
runtime-vocabulary = { workspace = true }

[features]
# Compile-checked usage recipes for the docs/MCP catalog (see
# src/recipes.rs). Off in every production build — the `recipe!` macro
# expands to nothing without it, so recipes cost zero in shipped apps.
# No `default`: this crate has no core selector any more, so a plain
# `idea-theme = "…"` dep is the whole surface.
catalog = ["runtime-core/catalog", "dep:mcp-catalog"]
