[package]
name = "idea-ui-layout"
version = "1.3.1"
edition.workspace = true
license.workspace = true
description = "Responsive screen layouts for idea-ui: page variants, split views, flows and overlays that pick their own phone, tablet and desktop form."

[lib]
crate-type = ["rlib"]

[features]
# Forward a `test_id` to the interactive primitives for robot/E2E.
robot = ["runtime-core/robot", "idea-ui/robot"]

[dependencies]
runtime-core = { workspace = true }
# The `ui!` / `#[component]` emission spells absolute
# `::runtime_vocabulary::glue::…` paths.
runtime-vocabulary = { workspace = true }
# Same theme as idea-ui, and built from its components (Modal, Menu,
# Popover, Button) rather than from primitives.
idea-theme = { workspace = true }
idea-ui = { workspace = true }
# The sidebar's three seats (`AppFrame` is a look over `AppShell`).
idea-ui-nav = { workspace = true }
# The glyphs the layouts draw themselves: the header's ⋮, a dialog's ✕,
# a sheet's chevrons, the blank and no-match states.
icons-lucide = { workspace = true }

[dev-dependencies]
# The recording scene `Host` + capability mock the mount tests run on.
host-mock = { path = "../../dev/host-mock" }
runtime-scene = { path = "../../runtime/scene" }
# The native layout engine, to lay out a kit token the way a native
# backend does.
runtime-layout = { path = "../../runtime/layout" }
# The app-key dispatcher, to press Ctrl-F at a mounted search.
runtime-shared = { path = "../../runtime/shared" }
# The robot registry, to find a control by its accessible name.
runtime-vocabulary = { path = "../../runtime/vocabulary", features = ["robot"] }
