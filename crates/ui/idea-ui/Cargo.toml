[package]
name = "idea-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform UI component library for the idealyst framework"

[lib]
crate-type = ["rlib"]

[features]
default = ["table"]

# Off by default. When on, every component's `*Props` gets a
# `DocControls` impl + supporting types that the idea-ui-docs app
# uses to auto-generate live control panels. Production apps that
# don't need reflective tooling leave this off — the derive
# expansion is dead code without it but a few hundred kilobytes of
# generated impls aren't free.
docs = ["dep:idea-ui-docs-derive"]

# Off by default. When on, components forward an optional `test_id` prop to
# their root interactive primitive, so a robot/E2E suite can locate them.
# Mirrors `runtime-core/robot`; production apps leave it off (the
# forwarding compiles out).
robot = ["runtime-core/robot"]

# Off by default. Exposes the premint delta-introspection accessors
# (`premint_variant_axes`, `premint_base`, …) that `runtime-core` gates
# behind `style-dump`. Declared HERE rather than only on the dep line
# because the `examples/dump_premint_manifest.rs` converter calls those
# accessors directly, and a feature enabled only on a dependency is not
# visible to this crate's own build. Same rule as the `debug-stats`
# forwarding documented in CLAUDE.md §6.
style-dump = ["runtime-core/style-dump"]

# Off by default. Compiles the `recipe!` usage examples in `src/recipes.rs`
# (they self-gate on the catalog feature and expand to nothing without it).
# The design-sync renderer calls those fns to produce its stories, so it
# needs them present; production builds leave this off and pay nothing.
catalog = ["runtime-core/catalog", "idea-theme/catalog"]

# The themed `Table` component + its `table` SDK dep (ON by default).
# The only feature on this crate that still removes linked code: without
# it the `table` crate never enters the graph.
table = ["dep:table"]

# ---------------------------------------------------------------------------
# WHY THERE IS NO PER-COMPONENT `prim-*` GATING ANY MORE
# ---------------------------------------------------------------------------
# This crate used to carry six `prim-icon` / `prim-image` /
# `prim-text-input` / `prim-activity` / `prim-portal` / `prim-presence`
# features that `#[cfg]`-deleted every component rendering the matching
# primitive family. They existed to be the *author-facing half* of the old
# core's `runtime-core/prim-*` features, which compiled out three real
# things: the render walker's per-`Element`-variant dispatch arms, the
# authoring builder fns, and the `Backend` trait's per-primitive methods.
# Turning a family off on both crates measurably shrank a wasm bundle, and
# using a gated-out component was a compile error naming the missing
# feature instead of a runtime placeholder.
#
# That lever does not exist on the current runtime. There is no walker and
# no `Backend` mega-trait: `runtime_vocabulary::handlers::register_builtins`
# installs one handler per primitive into a `runtime_scene::Registry`, and
# reachability — not a cargo feature — decides what links.
# `runtime-vocabulary` has no `prim-*` features at all, so these features had
# nothing left to forward to. Keeping them would have kept deleting
# components from this crate's public API while shrinking nothing, which is
# strictly worse than not having them: the size win WAS the whole point.
#
# The bundle lever on this runtime is the boot seam. `register_builtins` holds
# the only reference to each prim module and its caps calls, so it is what
# makes every builtin handler reachable from `main`. A per-family gate
# therefore belongs THERE (plus each backend's caps impls) — a size-restricted
# app's route to a smaller binary is a narrower registration set, with LTO
# dropping whatever nothing registers, not a compile-time amputation of the
# component library. If that split lands, restoring this crate's author-facing
# half is mechanical: the per-component family map is preserved in the crate
# docs (`src/lib.rs`, "Primitive families per component") precisely so it can
# be.

[dependencies]
# The framework author surface, reached under the historical `runtime_core`
# name via the crate-root `extern crate runtime_core as runtime_core;`
# alias in lib.rs (see the note there).
runtime-core = { workspace = true }
# The `ui!` / `#[component]` emission spells absolute
# `::runtime_vocabulary::glue::…` paths, and `test_support` downcasts the
# scene payloads (`runtime_vocabulary::prims`), so the vocabulary is a
# direct dependency, not only a transitive one.
runtime-vocabulary = { workspace = true }
idea-theme = { workspace = true }
idea-ui-docs-derive = { workspace = true, optional = true }
# Themed `Table` component layers on the cross-platform `table` SDK
# (real HTML `<table>` on web, shared-track CSS-grid on native). idea-ui
# wraps it the same way it wraps `activity_indicator` (as `Spinner`)
# and `toggle` (as `Switch`). Optional so a size-restricted build can
# drop it (the `table` feature).
table = { workspace = true, optional = true }

[dev-dependencies]
# Integration tests that MOUNT a component (not just resolve its
# stylesheets) need a native `Host`. `host-mock` implements `Host` plus
# every capability trait over a recording op log — it exists for exactly
# this. Used by `collapsible_direct_mount.rs`.
host-mock = { workspace = true }
# The CSS-emission half of the design-sync converter
# (`examples/design_sync_dump.rs`). Turns the PREMINT_SHEETS registry
# this crate's `stylesheet!` blocks register into (under
# `--cfg idealyst_premint_dump`) into the shipped .css text. Dev-only:
# examples never link into a shipped app.
premint-dump = { workspace = true }
# The HTML-emission half of the design-sync converter
# (`examples/design_sync_render.rs`). Rendering each component through the
# real SSR backend is what makes the exported markup ground truth: the
# framework decides the DOM shape and the preminted class list, rather
# than the converter inferring either. Dev-only.
backend-ssr = { workspace = true }
runtime-scene = { workspace = true }
# `tests/loading_button_spawn.rs` drives `spawn_then` through a manually
# pumped test executor (the `tests/scoped_spawn.rs` pattern in
# runtime-vocabulary): the executor install seam lives in
# runtime-shared's driver, and `runtime_core::spawn_then` only exists
# with `async-driver` on (feature unification covers the lib build).
runtime-shared = { workspace = true, features = ["async-driver"] }
runtime-core = { workspace = true, features = ["async-driver"] }
