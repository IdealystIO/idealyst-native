[package]
name = "idea-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cross-platform UI component library for the idealyst framework"

[lib]
crate-type = ["rlib"]

[features]
# Every prim family idea-ui components render through, ON by default so
# `idea-ui = { workspace = true }` keeps the full component set — the
# pre-gating behavior. A size-restricted app disables default features
# here AND on runtime-core/backend-web (`idealyst build --primitives …`),
# then re-enables only the families it uses; components whose required
# families are off are compiled out entirely, so using one is a compile
# error naming the missing feature instead of a runtime placeholder.
default = [
    "prim-icon", "prim-image", "prim-text-input", "prim-activity",
    "prim-portal", "prim-presence", "table",
]
# Each feature mirrors the same-named runtime-core family and gates the
# components that (transitively) render it:
#   prim-icon        Icon, IconButton, Breadcrumbs, Checkbox, Switch,
#                    Slider, Pagination (+ contributes to Button/Alert/
#                    Field/Select/Toast)
#   prim-image       Image, Avatar
#   prim-text-input  Textarea (+ Field, Autocomplete)
#   prim-activity    Spinner (+ Button's loading state, Alert, Field, Toast)
#   prim-portal      Menu, Popover, Tooltip (+ Select, Autocomplete,
#                    Modal, Toast)
#   prim-presence    (+ Modal, Toast)
# Multi-family components require ALL their families (the cfg(all(...))
# gates in components/mod.rs are the authoritative per-component map).
prim-icon = ["runtime-core/prim-icon"]
prim-image = ["runtime-core/prim-image"]
prim-text-input = ["runtime-core/prim-text-input"]
prim-activity = ["runtime-core/prim-activity"]
prim-portal = ["runtime-core/prim-portal"]
prim-presence = ["runtime-core/prim-presence"]

# Off by default. When on, every component's `*Props` gets a
# `DocControls` impl + supporting types that the idea-ui-docs app
# uses to auto-generate live control panels. Production apps that
# don't need reflective tooling leave this off — the derive
# expansion is dead code without it but a few hundred kilobytes of
# generated impls aren't free.
#
# Requires the full prim set: the docs runtime (`doc_controls`) renders
# its control panels out of Field/Select/Switch, and the docs app
# showcases every component.
docs = [
    "dep:idea-ui-docs-derive",
    "prim-icon", "prim-image", "prim-text-input", "prim-activity",
    "prim-portal", "prim-presence",
]

# Off by default. When on, components forward an optional `test_id` prop to
# their root interactive primitive via `Element::with_test_id`, so a robot/
# E2E suite can locate them. Mirrors `runtime-core/robot`; production apps
# leave it off (the forwarding compiles out).
robot = ["runtime-core/robot", "runtime-facade?/robot"]

# idea-lite core migration (P6 SDK retarget): compile this crate's SAME
# source against the new core via the `extern crate runtime_facade as
# runtime_core;` alias in lib.rs (shadows the extern-prelude runtime-core
# crate-wide). Default-off; one core per build graph (runtime-facade
# enables `runtime-macros/new-core`, which unifies — see the hazard note
# in runtime-macros/Cargo.toml). `dep:runtime-vocabulary` because the
# retargeted `ui!` emission spells absolute
# `::runtime_vocabulary::glue::…` paths.
#
# Combine with `--no-default-features` + the prim features you need:
# the `table` component feature (a default) cannot join a new-core graph
# — the table SDK is old-core-authored and macro unification would
# retarget ITS ui! sites too (compile_error guard in lib.rs).
new-core = [
    "idea-theme/new-core",
    "dep:runtime-facade",
    "dep:runtime-vocabulary",
]

# The themed `Table` component + its `table` SDK dep (ON by default —
# the pre-gating behavior). A feature so the new-core graph can exclude
# the old-core-authored SDK; see `new-core`.
table = ["dep:table"]

[dependencies]
# PATH dep with `default-features = false`, NOT `workspace = true`: cargo
# ignores `default-features = false` on workspace-inherited lines, so a
# workspace dep would force every `prim-*` family back ON for any app
# that disabled them (feature unification), defeating the component
# gating above. The `prim-*` features forward exactly the families this
# crate's own features select. (Same contract as backend-web; idea-theme
# and the table SDK carry the same no-defaults dep lines so this crate's
# whole subtree is unification-clean.)
runtime-core = { path = "../../runtime/core", default-features = false }
idea-theme = { workspace = true }
idea-ui-docs-derive = { workspace = true, optional = true }
# Themed `Table` component layers on the cross-platform `table` SDK
# (real HTML `<table>` on web, flex passthrough on native). idea-ui
# wraps it the same way it wraps `activity_indicator` (as `Spinner`)
# and `toggle` (as `Switch`). Optional only for the `new-core` graph
# (see the `table` feature) — the default build keeps it on.
table = { workspace = true, optional = true }
# The new-core alias target (see the `new-core` feature).
runtime-facade = { workspace = true, optional = true }
runtime-vocabulary = { workspace = true, optional = true }
