[package]
name = "render-wgpu"
version = "2.4.0"
edition.workspace = true
license.workspace = true
# Retained stub — see `build.rs`. No custom cfgs surfaced today.
build = "build.rs"

# Wgpu renderer + interaction host. The platform-agnostic half of
# the desktop-preview stack.
#
# Implements the scene `Host` + capability traits for `WgpuBackend`, owns
# the tween engine, the interaction `Host`, and a wgpu-bound
# `Renderer`. **No winit, no event-loop, no browser deps** — those
# live in the host shells (`host-winit`, `host-web`).

[features]
default = []
async-driver = ["runtime-shared/async-driver"]
# `headless`: offscreen screenshot rendering with no window. Spins up a
# wgpu device (hardware, falling back to a software adapter like Mesa
# lavapipe on GPU-less servers — same shaders either way, so software
# output matches GPU output), renders the scene to an offscreen texture,
# and reads pixels back as RGBA / PNG. Powers the headless dev-server +
# Robot/MCP "screenshot the app even when mocked" path. Pulls `pollster`
# to block on the async device/readback, and `embed-font-bytes` so text
# shapes against the bundled font on a server with no system fonts.
# The screenshotter mounts through `newcore::start`, so the
# headless pipeline needs the scene/world crates the boot path uses.
headless = ["dep:pollster", "embed-font-bytes"]
# `embed-font-bytes`: the wgpu Simulator shapes text with cosmic-text,
# which needs the raw font bytes. NATIVE hosts (`host-winit`, the
# mobile sims) enable this so `face!` fonts are `include_bytes!`-baked
# and `register_asset` loads them synchronously — those backends have
# no async loader. The WEB host (`host-web`) leaves it OFF: there
# `face!` emits a bundle *path*, the same `/fonts/*.ttf` the DOM
# backend serves, and host-web fetches it at runtime (see its `mount`).
# Keeping it off-by-default stops the feature from unifying ON across
# the whole wasm graph and double-paying for fonts (embedded + served).
embed-font-bytes = ["runtime-shared/embed-font-bytes"]

[dependencies]
render-api = { workspace = true }
runtime-shared = { workspace = true }
runtime-layout = { workspace = true }
runtime-world = { workspace = true }
runtime-scene = { workspace = true }
runtime-vocabulary = { workspace = true }

# Wgpu pipelines + glyph atlas. No platform deps come along.
# `wgpu 29` is required for Blitz's vello renderer; bumping
# `glyphon` to 0.11 keeps it on the same wgpu major.
wgpu = "29"
glyphon = "0.11"

# Vertex / uniform buffer POD encoding.
bytemuck = { version = "1.18", features = ["derive"] }

# Logging — lightweight; the shell wires up an env_logger or similar.
log = "0.4"

# `RgbaImage` (the decoded-pixel type the image pipeline uploads) and
# `imageops::resize` (downscaling past the GPU's max texture edge) on every
# target. NO decoders here: the format features are added per target below.
# On wasm32 the browser decodes (`image_load/web.rs`), so the decoders and
# resvg stay out of the web bundle. Measured 2026-10-14 on the fiddle
# simulator bundle (host-web + ios-sim; release opt-level "z", LTO,
# codegen-units 1; then wasm-opt -Oz): 6,829,264 B (2,563,445 gzip) with
# resvg + png/jpeg/gif/webp linked, 5,936,319 B (2,213,483 gzip) with the
# browser decoding — −893 KB. Raw twiggy attribution before the switch:
# resvg/usvg/tiny-skia ~559 KB, webp ~109 KB, jpeg ~82 KB, png ~31 KB,
# gif ~17 KB.
image = { version = "0.25", default-features = false }

# HTTP for `image()` `http(s)://` srcs (and `Remote` image assets): the
# framework's cross-platform client — NSURLSession on Apple, JNI on
# Android, `fetch` on the web, reqwest elsewhere.
net = { workspace = true }

# Block on async wgpu device-request + buffer-map during headless
# screenshot capture. Only pulled in by the `headless` feature — the
# windowed hosts drive their own event loop and don't need it.
pollster = { version = "0.4", optional = true }


# On the web the image fetch is a future driven by the page's executor
# (`runtime_shared::driver::spawn_async`, installed by `backend-web`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
runtime-shared = { workspace = true, features = ["async-driver"] }
# Browser image decoding (`image_load/web.rs`): `createImageBitmap` for
# rasters, an `HTMLImageElement` + canvas for SVG — bound through the
# framework's own web boundary, not wasm-bindgen / web-sys.
web-glue = { workspace = true }

# Native image decode. The `image` format set is exactly what
# `docs/image-src.md` promises on every backend: PNG, JPEG, GIF (first
# frame) and WebP. SVG goes through `backend-image-source` (sniffing + resvg,
# shared with the Apple and Android backends). Both are native-only: on the
# web the browser decodes every one of these formats itself — see the
# `image` comment above and `image_load/web.rs`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
backend-image-source = { workspace = true }


# Browser tests for the wasm32 image decode path (`image_load::web_tests`):
# `cargo test -p render-wgpu --target wasm32-unknown-unknown --lib` with
# CHROMEDRIVER set (the workspace runner supplies web-glue's JS).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
