[package]
name = "variant-tablet"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published to the idealyst registry: this crate is workspace-internal
# (tooling, demo, smoke test, or benchmark). Consumers never name it.
publish = false

# Tablet-sized preview variant.

[dependencies]
host-winit = { workspace = true }
render-wgpu = { workspace = true }
# Style/host vocabulary (`ColorScheme`). `runtime-core` (the
# author surface) is NOT a dependency.
runtime-shared = { workspace = true }

[features]
default = []
runtime-server = ["host-winit/runtime-server"]
