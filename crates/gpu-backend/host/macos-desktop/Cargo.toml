[package]
name = "host-macos-desktop"
version = "1.5.2"
edition.workspace = true
license.workspace = true

# macOS native shell for the wgpu render backend.
#
# The AppKit sibling of `host-ios-mobile`: takes the framework's
# `Graphics`-allocated CAMetalLayer-backed NSView surface (via the
# macOS backend's `MacosSurfaceProvider`), runs the wgpu init against
# the Metal backend, constructs the `render_wgpu::Host` + `Renderer`,
# mounts the caller's UI, and drives per-frame paint through
# `runtime_shared::driver::render_loop` — the NSTimer driver
# `host-appkit` installs at boot (`backend_macos::install_render_loop`).
#
# Used to embed a live preview of an idealyst app (the welcome
# scaffold, a third-party SDK component) inside another idealyst
# app's UI on macOS — e.g. the website's home-page Simulator.
#
# Note on inputs: like the iOS host, this does NOT install pointer
# handlers — the embedded preview is read-only (the outer macOS
# backend owns hit testing for the surrounding NSView tree).

[dependencies]
# The scene-element vocabulary `mount`'s build closure returns.
runtime-scene = { workspace = true }
render-api = { workspace = true }
render-wgpu = { workspace = true }
# `async-driver`: the crate's `spawn_async` executor, used by the
# async wgpu init.
runtime-shared = { workspace = true, features = ["async-driver"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The embedding app host — `mount` reads its mounted world (the
# `newcore` boot's accessor) and installs its render-loop driver
# (behind the backend's `async-driver`).
backend-macos = { workspace = true, features = ["async-driver"] }
# Match host-ios-mobile's wgpu major (29), Metal backend.
wgpu = { version = "29", default-features = false, features = ["metal", "wgsl"] }
raw-window-handle = "0.6"
log = "0.4"
# Used by the per-frame visibility check (`view.window != nil` +
# recursive `!isHidden` / `alphaValue > 0`) so the wgpu render loop
# stops submitting Metal frames for an NSView hidden behind a
# navigator's persistent-but-not-visible screen.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSObject"] }
