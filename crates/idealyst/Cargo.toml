# The app-facing facade: one dependency line that carries whatever the
# target needs.
#
# This crate exists so an app's Cargo.toml doesn't have to name
# `backend-web` + `wasm-bindgen` + `console_error_panic_hook` +
# `lol_alloc` + `js-sys` + `web-sys` on wasm, `host-terminal` on a TTY,
# `host-macos` on desktop, and so on — the per-target dependency blocks
# below do that. Previously those lines lived in a CLI-generated wrapper
# crate, which is what made the app crate un-buildable by plain `cargo
# build` and what let the wrapper's dependency resolution drift from the
# app's (two `runtime-core` instances → "expected `Element`, found
# `Element`").
[package]
name = "idealyst"
version = "1.5.2"
edition.workspace = true
license.workspace = true
description = "Build and run idealyst apps with plain `cargo build` — no generated wrapper crate"

[features]
default = []

# --- Native shell selection -------------------------------------------
#
# The target triple settles web/iOS/Android on its own. It does NOT
# settle the *native* shells: a terminal app and a desktop-window app on
# a Mac are both `target_os = "macos"`, so something has to choose. That
# something is a feature.
#
# HAZARD: cargo features are additive and unify across a workspace. Two
# apps in one workspace asking for different shells will both get both.
# `boot::run` rejects that at compile time rather than silently booting
# the wrong one — see `boot::run`'s `compile_error!` arms.
terminal = ["dep:host-terminal"]

# --- Dev / tooling ----------------------------------------------------

# Runtime-server ("aas") mode: the framework runtime lives in a native
# sidecar and this process is a thin replay client. Web only for now.
runtime-server = ["dep:dev-client", "backend-web/runtime-server"]
# Robot bridge — the MCP server's remote-control transport.
robot = ["backend-web/robot"]
# Adopt server-rendered DOM instead of mounting fresh. Set by the build
# when the app is paired with an SSR/SSG server binary; `boot::web`'s
# `page_is_prerendered` check picks the path at runtime, but the backend
# needs the machinery compiled in.
hydrate = ["backend-web/hydrate"]

# --- Allocator --------------------------------------------------------
#
# There is deliberately NO allocator feature here. The wasm global
# allocator is selected per app, in the app's own manifest:
#
#     [package.metadata.idealyst.app]
#     allocator = "small"     # "default" (dlmalloc) | "small" (free list)
#
# `entry!` reads that key and emits the matching `#[global_allocator]`
# into the app's `main.rs`; `src/alloc.rs` holds the types and the
# rationale.
#
# Why not a feature: a `#[global_allocator]` is process-wide, and cargo
# features are additive and unify across a workspace — so ONE crate
# asking for the small allocator would silently hand it to every app in
# that workspace, with nothing able to reject it at compile time the way
# `boot::run` rejects two shells. Manifest metadata is read from the
# crate that owns `main`, which is the granularity a global allocator
# actually has.

[dependencies]
idealyst-macros = { path = "../idealyst-macros", version = "1.5", registry = "idealyst" }
# `async-driver` here is the other half: it forwards to the
# vocabulary so `driver::spawn_async` / `render_loop` resolve.
runtime-core = { path = "../runtime/core", features = ["async-driver"], version = "1.5", registry = "idealyst" }
runtime-vocabulary = { path = "../runtime/vocabulary", version = "1.5", registry = "idealyst" }
runtime-scene = { path = "../runtime/scene", version = "1.5", registry = "idealyst" }

# --- Web --------------------------------------------------------------
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `async-driver` compiles in the rAF render-loop driver and the
# `wasm_bindgen_futures` executor, and is what makes
# `install_render_loop()` / `install_async_executor()` exist at all.
# Without it the app renders and then panics at the first `spawn_async`
# — i.e. the first server-fn call or resource fetch.
backend-web = { path = "../backend/web", features = ["async-driver"], version = "1.5", registry = "idealyst" }
console_error_panic_hook = "0.1"
# Backs `alloc::Small`, the opt-in small-bundle allocator. NOT optional
# and NOT the default: the type is only instantiated by the
# `#[global_allocator]` `entry!` emits for `allocator = "small"`, so an
# app that doesn't ask for it never reaches this code and nothing is
# emitted. Measured on `examples/baseline` (release wasm, pre-wasm-opt):
# 1,584,604 bytes with this dep present and unused, and 1,584,604 with
# the dep deleted outright — byte-identical. Selecting it drops that to
# 1,575,878 (dlmalloc out, free list in).
lol_alloc = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "console"] }
dev-client = { path = "../dev/client", optional = true, version = "1.5", registry = "idealyst" }

# --- Native -----------------------------------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
host-terminal = { path = "../gpu-backend/host/terminal", optional = true, version = "1.5", registry = "idealyst" }
