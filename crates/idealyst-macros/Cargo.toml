# The `entry!` macro behind the `idealyst` facade crate.
#
# Separate from `runtime-macros` (the authoring macros: `ui!`, `lazy!`,
# `recipe!`) because this one exists for a different reason: it is the
# only part of the app-entry story that MUST run at compile time, since
# it reads the consuming crate's `Cargo.toml` metadata. The rest of app
# boot is plain library functions in `idealyst::boot`.
[package]
name = "idealyst-macros"
version = "1.5.3"
edition.workspace = true
license.workspace = true
description = "Entry-point macro for idealyst apps"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml = "0.8"
