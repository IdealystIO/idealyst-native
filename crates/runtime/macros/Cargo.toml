[package]
name = "runtime-macros"
version = "1.18.0"
edition.workspace = true
license.workspace = true
# `ui!`/`jsx!` distinguish rustc from IDE proc-macro servers by whether
# token spans carry real line/column info (`host_has_no_span_lines` in
# ui.rs). Span locations stabilized in rustc 1.88; on older toolchains
# every span is degenerate and the macro would wrongly emit its
# analysis-only salvage shell into real builds. Fail loudly instead.
rust-version = "1.88"

[lib]
proc-macro = true

[features]
# Every feature is the expansion crate's (`runtime-macros-expand`, where
# the code and the reasoning for each switch live), forwarded one-for-one.
# This crate is only the proc-macro boundary: one shim per macro that
# converts `proc_macro` <-> `proc_macro2` token streams and calls in. See
# that crate's manifest for why the split exists.
#
# A proc-macro crate compiles once per build graph, so a feature turned on
# here anywhere flips the expansion for every crate in that cargo
# invocation — the same as before the split.
ui-overlay = ["runtime-macros-expand/ui-overlay"]
debug-stats = ["runtime-macros-expand/debug-stats"]
hot-reload = ["runtime-macros-expand/hot-reload"]
catalog = ["runtime-macros-expand/catalog"]
# Backward-compatible alias for `catalog`.
mcp = ["catalog"]
strict-docs = ["runtime-macros-expand/strict-docs"]
strict-naming = ["runtime-macros-expand/strict-naming"]

[dependencies]
runtime-macros-expand = { workspace = true }
