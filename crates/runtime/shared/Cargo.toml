# runtime-shared — the shared substrate under runtime-vocabulary,
# runtime-core, the backends and the style pipeline (crates/css,
# runtime-layout). It does not depend on runtime-world or runtime-scene.
#
# What lives here: the style engine + data model, colors, assets/fonts
# (`typeface!` / `face!`), accessibility props, the animation system,
# touch/hover/wheel/file-drop event types + recognizers, an older
# reactive arena (Signal/Effect/Ref — several modules here are built on
# it, see lib.rs), scheduling/time/session, viewport/breakpoint/
# safe-area TLS state, logging/debug counters, the robot automation
# registry + bridge, introspection, and the per-primitive prop/handle
# STRUCTS (handles, navigator substrate, virtualizer callbacks, …).
#
# TLS-authority rule: every thread-local here (viewport signal, touch
# claims, robot registries, phase counters, platform/color-scheme/
# url-opener slots, cached stylesheets, …) has exactly ONE definition —
# this crate's. Crates above re-export; they never duplicate a TLS
# static (two copies would silently split state).

[package]
name = "runtime-shared"
version = "2.0.0"
edition.workspace = true
license.workspace = true
description = "Idealyst shared runtime substrate: style engine, assets, animation, input types, scheduling, robot — the non-walker half of runtime-core."

[features]
default = []

# Serde for the style data model (`StyleRules`, `VariantSet` and everything
# they reach), so a remote component's styles can cross to the host app with
# token names intact. Off for every app that doesn't host remote components.
remote-serde = []

# No `style-dynamic` feature: the style engine
# (`runtime-vocabulary/src/style_attach.rs`) handles every `StyleProp`
# arm unconditionally. See docs/styling.md.

# Premint style-dump registry (`premint` module): only the CLI's
# ephemeral dump build enables it.
style-dump = ["dep:linkme"]

# Phase counters + component timing log (`debug` module). Off by
# default; zero code when off (a no-op `debug` shim in this crate's
# lib.rs keeps call sites compiling).
debug-stats = []

# Programmatic introspection + control of the running UI: the robot
# registry, watch/components/logs registries, and the bridge transport.
robot = ["dep:base64", "dep:libc", "dep:tungstenite"]

# Serve the in-process MCP catalog over the robot bridge
# (`get_catalog`). The catalog *anchor* (`glue::__mcp`) lives in
# runtime-vocabulary; this only links the catalog crate so the bridge
# verb can read it. `runtime-vocabulary/catalog` forwards here.
catalog = ["dep:mcp-catalog"]

# Platform-agnostic async + per-frame primitives (`driver` module) and
# the reactive async surface built on them (resource/mutation/
# async_reducer/NetworkState).
async-driver = ["dep:pollster", "dep:log"]

# `face!` embeds font bytes. The `__face_source!` cfg split must be
# evaluated against THIS crate's features, which is why the helper lives
# here with the macro.
embed-font-bytes = []

[dependencies]
# `thread_local!` that costs Android one pthread key per process
# instead of one per static (bionic allows 128).
runtime-tls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Bitflags for `AccessibilityTraits` (one u16 of orthogonal a11y flags
# per primitive).
bitflags = "2"
rustc-hash = { workspace = true }
# The `Graphics` primitive's surface types expose standard
# `raw_window_handle` handles (tiny dep — enums + traits).
raw-window-handle = "0.6"
# `__wasm_split` anchor for the `#[component(lazy)]` glue — same
# hidden-re-export pattern as `__serde_json`.
wasm-split = { workspace = true }
linkme = { workspace = true, optional = true }
# Robot bridge screenshot PNG → base64 in the JSON response.
base64 = { version = "0.22", optional = true }
mcp-catalog = { workspace = true, optional = true }
# The local UTC offset for the native default wall clock
# (`time::SystemWallClockSource`): libc `localtime_r` on unix, Win32 on
# Windows. Its own crate so the per-target code stays out of this crate's
# source and the `datetime` SDK can share the same lookup. No deps on
# wasm32, where the web backend's `js Date` clock is installed instead.
zone-offset = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"], optional = true }

# Browser regression test for the robot log clock (`tests/robot_logs_web.rs`):
# `cargo test -p runtime-shared --features robot --target
# wasm32-unknown-unknown --test robot_logs_web`. Dev-only; never reaches an
# app's graph.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
