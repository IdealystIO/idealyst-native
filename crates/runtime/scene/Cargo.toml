# runtime-scene — the scene core.
#
# The `Element` tree (Item/Fragment/Dyn/Keyed/Owned), `realize` into a
# live tree, the `Host` structural seam, the TypeId-keyed handler
# `Registry` every primitive (builtin or third-party) mounts through, and
# the Dyn/Keyed structural drivers (when_switch/dynamic/each).
#
# The scene knows nothing about styling, text, a11y, or any concrete
# primitive — that is the vocabulary's job. Its structural-op sequences
# are pinned by the goldens in crates/dev/scene-parity.

[package]
name = "runtime-scene"
version = "1.11.0"
edition.workspace = true
license.workspace = true

[features]
# `ui-overlay`: carry a per-node ORIGIN TAG on `Element::Item`, so a
# dev-time overlay can find the node a `ui!` site's descriptor node
# produced and patch it in place.
#
# Default OFF and a real cargo feature rather than `cfg(debug_assertions)`
# on purpose: an over-the-air path would want it in a release build. The
# `Element` field exists ONLY under the feature, so an app that never
# enables it pays nothing — not a byte per node, not a branch.
#
# Forwarded from `runtime-core` / `idealyst` (and `runtime-macros`, which
# emits the tags) the way `runtime-shared`'s `debug-stats` is. Enabling
# it here alone is SOUND but inert: the macro emits no tags, so every
# node's tag is `None`.
ui-overlay = []

[dependencies]
# `thread_local!` that costs Android one pthread key per process
# instead of one per static (bionic allows 128).
runtime-tls = { workspace = true }
runtime-world = { workspace = true }
# Registry map keyed by payload TypeId — internal, never attacker-controlled
# (same rationale as runtime-world's use).
rustc-hash = { workspace = true }
