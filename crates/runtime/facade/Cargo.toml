# runtime-facade — the `extern crate runtime_facade as runtime_core;`
# alias target for the P6 SDK retarget (idea-lite core migration).
#
# An SDK/component crate (idea-theme, idea-ui, idea-ui-nav, …) that was
# authored against `runtime_core::…` paths compiles the SAME source on
# the new core by adding, at its crate root, under its own `new-core`
# feature:
#
#     #[cfg(feature = "new-core")]
#     extern crate runtime_facade as runtime_core;
#
# A crate-root `extern crate … as …` alias shadows the extern-prelude
# `runtime_core` for the whole crate (use paths, inline paths, and
# `::runtime_core::…` absolute paths alike — verified against rustc,
# edition 2021), so every existing `runtime_core::X` reference resolves
# here instead. This crate's ROOT therefore mirrors the old runtime-core
# author surface: `runtime_vocabulary::glue::*` (the macro-emission /
# compatibility namespace — extend GLUE, not this crate, when something
# is missing) plus the proc-macro set that old `runtime_core` re-exports.
#
# Enabling `runtime-macros/new-core` here is deliberate: this crate only
# ever appears in a build graph through a consumer's non-default
# `new-core` feature, and its presence must imply the retargeted macro
# lowering (proc-macro features unify build-graph-wide — see
# runtime-macros/Cargo.toml for the hazard note).
[package]
name = "runtime-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Old-core author-surface facade over runtime_vocabulary::glue (idea-lite migration P6 alias target)."

[features]
# Mirror of the old `runtime-core/robot` opt-in: forwards to the
# vocabulary robot registry so `test_id` forwarding and `#[method]`
# registrations in an aliased crate go live.
robot = ["runtime-vocabulary/robot"]
# Mirror of the old `runtime-core/async-driver` opt-in: forwards to the
# vocabulary so glue's root grows `driver` (spawn_async/render_loop) and
# the `resource`/`mutation` mirrors — the names an aliased async-consuming
# SDK crate (graphql's hooks) reaches for via `runtime_core::…`.
async-driver = ["runtime-vocabulary/async-driver"]
# Mirror of the old `runtime-core/catalog` opt-in — ONE switch makes a
# new-core graph catalog-capable: turns on the macro emission gate
# (`runtime-macros/catalog`) and the vocabulary anchor
# (`glue::__mcp`, which this root's glob re-export carries, so the
# alias-resolved `::runtime_core::__mcp::…` emissions from
# `#[derive(IdealystSchema)]` / `#[idealyst_tool]` / `recipe!` resolve
# here too). Forwards runtime-shared's `catalog` through the
# vocabulary, so the bridge `get_catalog` verb + the static
# core-primitive recipes come along. `mcp` alias kept for parity with
# the old core's back-compat name.
catalog = ["runtime-vocabulary/catalog", "runtime-macros/catalog"]
mcp = ["catalog"]
# Mirror of `runtime-core/dev` (robot + catalog): what a dev-session
# wrapper turns on to get the automation registry AND the MCP catalog
# in a new-core graph (see build-runtime-server's `--new-core` sidecar
# generation).
dev = ["robot", "catalog"]

[dependencies]
runtime-vocabulary = { workspace = true }
runtime-macros = { workspace = true, features = ["new-core"] }
# For the shared-substrate `#[macro_export]` decl macros this root
# re-exports (`typeface!` / `face!` / `node_ref!`): their `$crate::…`
# expansions resolve against runtime-shared, and the types they
# construct (`assets::Typeface`, `Ref<H>`) are the same items glue
# already re-exports. No runtime-core dependency — the facade's graph
# is walker-free.
runtime-shared = { workspace = true }
