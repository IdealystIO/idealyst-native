# runtime-world — the reactive kernel of the idea-lite core migration (P0).
#
# Worlds are discrete reactive runtimes: each owns an arena of signal/effect
# slots, a staged-write queue, and a typed context map. Many worlds coexist on
# one thread (app world + per-request SSR worlds + test worlds) and flush /
# tear down independently. Semantics are idea-lite's staged-commit model with
# a derivation-class (glitch-free) flush; storage is per-world arenas with
# generational Copy handles.
#
# This crate is deliberately dependency-minimal: it is the bottom of the new
# core's dependency chain (world ← scene ← vocabulary ← backends) and must
# stay wasm-lean.

[package]
name = "runtime-world"
version = "1.5.2"
edition.workspace = true
license.workspace = true

[features]
# Dev-time hot reload: carry signal VALUES across an in-process re-run
# (`src/hot_state.rs`). Off by default and compiled out completely —
# with it off, `create_signal` has no seed lookup, no recording, and
# `AnySignal` has no erased-payload methods.
#
# Turned on through `runtime-core/hot-reload`, the same switch that
# makes `#[component]` emit its subsecond dispatch split. The two belong
# together: a patch with no re-run changes nothing on screen, and a
# re-run with no carried state resets the app on every save.
hot-reload = []

[dependencies]
# Fast FxHash for the kernel's maps (world registry, per-world context).
# Keys are internal world ids / TypeIds — never attacker-controlled — so the
# default SipHash's cryptographic resistance is wasted cost on the hottest
# path (same rationale as runtime-core's reactive collections).
rustc-hash = { workspace = true }
