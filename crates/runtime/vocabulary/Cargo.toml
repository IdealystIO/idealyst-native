# runtime-vocabulary — the capability traits and the builtin vocabulary
# over the `runtime_scene::Host` structural seam.
#
# `caps` holds one Ops trait per primitive family, every trait a subtrait
# of `runtime_scene::Host`; a backend implements the families it
# supports. The builtin vocabulary is the payload types (`prims`), the
# builders (the `ui!` contract), the generic mount handlers (each bounded
# on exactly the caps it uses), the shared `style_attach` service,
# `register_builtins`, and `glue` — the author surface `runtime-core`
# re-exports.

[package]
name = "runtime-vocabulary"
version = "4.3.1"
edition.workspace = true
license.workspace = true

[features]
# The element identity / robot registry (`src/robot.rs`): mount
# handlers register every identity-bearing primitive for the automation
# surface (find-by-test_id, tap, type_text, snapshot, …). OFF by
# default (`runtime-core/robot` forwards here) — the `test_id`
# slots always exist (so `ui! { view(test_id = …) }` compiles in every
# build), only the per-mount registration overhead is gated.
# `async-driver` drives an async robot function (`robot_fn`).
robot = ["async-driver"]

# `ui-overlay`: the dev-time overlay's RUNTIME half — the per-node tag a
# patch addresses by, the applier that edits a built `Element`, and the
# live applier that edits a mounted tree through the backend seam.
#
# NOT the emission: that is `runtime-macros/ui-overlay`, in a crate this
# one does not depend on. A consumer wanting both enables
# `runtime-core/ui-overlay`, which forwards to each.
ui-overlay = ["runtime-scene/ui-overlay"]

# Phase-timer instrumentation for the mount/style hot paths (repeat
# batch, dynamic-sheet effect). Same discipline as the other crates'
# debug-stats (CLAUDE.md §6): OFF by default, counters land in
# runtime-shared's thread-local phase map, zero code when off.
debug-stats = ["runtime-shared/debug-stats"]

# Forward runtime-shared's `async-driver` gate so glue exposes the
# feature-gated `driver` module (`spawn_async` / `render_loop`) that
# author code reaches as `runtime_core::driver::…`.
async-driver = ["runtime-shared/async-driver"]

# Forward runtime-shared's `style-dump` gate so glue can re-export the
# `premint` linkme registry at `glue::premint`. This is where the
# `stylesheet!` expansion's `cfg(idealyst_premint_dump)` registration
# lands after the macro's retarget rewrites `::runtime_core::premint::…`
# → `::runtime_vocabulary::glue::premint::…`. Only the CLI's ephemeral dump build and `premint-dump`'s own tests
# enable it — shipped graphs carry zero registry code.
style-dump = ["runtime-shared/style-dump"]

# MCP catalog anchor: links `mcp-catalog` and re-exports it at
# `glue::__mcp`, where the `#[component]` / `doc_scope!` emissions land
# (`::runtime_core::__mcp::…` → `::runtime_vocabulary::glue::__mcp::…`).
# Forwards `runtime-shared/catalog` so the robot bridge's `get_catalog`
# verb + the static core-primitive recipes ride along — one switch gives
# a session the full catalog. Off by default (production carries zero catalog code);
# the emission gate itself is `runtime-macros/catalog`, enabled by
# whichever wrapper/app wants capture (see runtime-core/catalog).
catalog = ["dep:mcp-catalog", "runtime-shared/catalog"]

# `hot-reload`: the subsecond dispatch anchor for the `#[component]`
# split. Links `dev-hot` (with its own `hot` feature, i.e. the real
# subsecond substrate) and re-exports it at `glue::__hot`, where the
# split's `::runtime_core::__hot::call(..)` emission lands after the
# retarget pass.
#
# Both halves in one switch, deliberately — same reasoning as
# `runtime-core/ui-overlay`. The EMISSION gate lives on
# `runtime-macros` (a crate this one does not depend on), so a consumer
# turns on `runtime-core/hot-reload`, which forwards to both. Turning on
# only the macro half emits calls to an anchor that does not exist (a
# loud compile error — fine); turning on only this half links dev-hot
# and dispatches nothing (silent, and the bad one). One switch, no
# half-configuration.
#
# `runtime-world/hot-reload` rides along because the other half of a
# working hot reload is the kernel carrying signal VALUES across the
# re-run a patch triggers — and this crate's build probe is what opens
# each component's frame on that path stack. Split apart, a patch would
# apply and reset the app's state on every save.
#
# Off by default: production graphs carry zero hot-reload code, and
# `dev-hot` is an optional dep so the default build graph is unchanged.
# Only `idealyst dev`'s generated runtime-server sidecar enables it.
hot-reload = ["dep:dev-hot", "dev-hot/hot", "runtime-world/hot-reload"]

# Remote components (crates/streaming): the element codec that carries a
# bundle's `Element` tree to the host app — `remote::bundle` encodes it in the
# bundle (closures become callback ids), `remote::host` decodes it into real
# prims whose closures call back. Off for every app that hosts no remote
# components. See `src/remote/mod.rs`.
# `async-driver`: a bundle drives `#[host_fn]` futures with its own executor
# (`remote::wasm`), installed through runtime-shared's driver seam.
remote = ["dep:postcard", "dep:linkme", "async-driver", "runtime-shared/remote-serde", "runtime-world/bridge"]
# Both halves in one process, on the kernel's loopback engine: what the
# codec's own tests run on (`cargo test -p runtime-vocabulary --features
# remote-loopback --test remote_elements`).
remote-loopback = ["remote", "runtime-world/loopback-engine"]
# A native app runs its `#[component(remote)]` bodies in-process instead of
# mounting them from the installed bundle: the same source, compiled
# natively. For measuring a remote component against itself as native code,
# and for debugging one without the bundle in the way. Off in shipped apps.
remote-inline = ["remote"]

[dependencies]
# `thread_local!` that costs Android one pthread key per process
# instead of one per static (bionic allows 128).
runtime-tls = { workspace = true }
# The shared prop/data types (StyleRules, AccessibilityProps, handler
# aliases, primitives::* payloads, robot bridge, host slots) live in
# runtime-shared — the shared substrate. This crate has NO dependency
# on the author-surface `runtime-core` root (which depends on it).
runtime-shared = { workspace = true }
runtime-scene = { workspace = true }
runtime-world = { workspace = true }
# Descriptor DATA types. `#[component]` / `#[props]` generate an
# `__apply_literal` naming `LiteralValue` on EVERY props struct, so the
# type must resolve in every build — the dependency is unconditional even
# though the overlay that consumes descriptors is feature-gated.
runtime-template = { workspace = true }
# The `Deserialize` bound of `robot::watch_signal_writable` (the bridge's
# `write_signal` verb parses the new value as JSON) in EVERY build — the
# robot-less `robot` module keeps the same signature so app code needs no
# `cfg` — plus `#[robot_fn]` argument decoding and the remote codec.
# runtime-shared depends on serde unconditionally, so this adds nothing
# to the graph.
serde = { workspace = true }
# The remote element codec's wire format (feature `remote`).
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
# The app's table of components bundles may import, filled at link time by
# every `#[component]` (feature `remote`; see `remote::host::APP_COMPONENTS`).
linkme = { workspace = true, optional = true }

# Catalog anchor (see the `catalog` feature above).
mcp-catalog = { workspace = true, optional = true }

# Hot-reload dispatch anchor (see the `hot-reload` feature above).
# Crate-type rlib, so it is statically linked ONCE into whichever
# binary the graph produces — there must be exactly one copy of
# subsecond's global jump table in a process.
dev-hot = { workspace = true, optional = true }

[dev-dependencies]
# Self-dev-dep so the test targets compile the lib WITH `async-driver`
# (feature unification): the lazy chunk driver (handlers/lazy.rs,
# tests/lazy.rs) and the resource/mutation mirrors
# (src/async_reactive.rs, tests/async_reactive.rs) are gated on it,
# and a plain
# `cargo test -p runtime-vocabulary` must exercise both instead of
# silently vanishing behind a --features flag nobody passes in CI.
runtime-vocabulary = { path = ".", features = ["async-driver", "robot"] }
# The test substrate: scene Host + every-caps recording mock. Dev-dep
# cycle (host-mock depends on this crate's lib) is fine — Cargo permits
# dev-dependency cycles.
host-mock = { path = "../../dev/host-mock" }
# `ui!` / `#[component]`, for the tests that must pin the AUTHOR-FACING
# spelling of a feature this crate owns rather than its builder form
# (`tests/slots.rs`). Safe as a dev-dep here: the macros always emit
# `::runtime_vocabulary::glue::…` absolute paths, which resolve inside
# this crate's own test targets.
runtime-macros = { path = "../macros" }
# The Taffy layout tree every native backend (iOS/macOS/Android) drives,
# for `tests/presence_layout.rs`: a host whose nodes ARE layout nodes, so a
# test can assert where a mounted primitive's children actually land —
# geometry a recording mock cannot see.
runtime-layout = { path = "../layout" }
# Compile-fail cases for `#[derive(Tokens)]` (`tests/tokens_compile_fail.rs`):
# a misspelled token, an incomplete theme, a non-token field and a name
# collision must each fail to compile. Same harness `i18n` and
# `ui-lowering-parity` use for their typing proofs.
trybuild = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(idealyst_stream_guest)'] }
