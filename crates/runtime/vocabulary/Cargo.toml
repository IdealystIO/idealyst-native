# runtime-vocabulary — the vocabulary layer of the idea-lite core migration
# (P2a): the capability-trait split of runtime-core's 159-method `Backend`
# mega-trait.
#
# `caps` holds one Ops trait per primitive family (signatures FROZEN to
# today's `Backend`), every trait a subtrait of the `runtime_scene::Host`
# structural seam extracted in P1. `bridge::LegacyBridge<B>` adapts any
# existing `Backend` impl to the full capability surface with zero edits
# to backend crates — the compile-time proof of the signature freeze.
# `COVERAGE.md` accounts for every Backend method.
#
# P2b adds the built-in vocabulary: payload types (`prims`), builders
# (the ui! contract), generic mount handlers (the walker's per-primitive
# build modules re-homed, bounded on exactly the caps they use), the
# shared `style_attach` service, and `register_builtins`.

[package]
name = "runtime-vocabulary"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The new-core element identity / robot registry (`src/robot.rs`):
# mount handlers register every identity-bearing primitive for the
# automation surface (find-by-test_id, tap, type_text, snapshot, …).
# OFF by default, mirroring runtime-core's `robot` gate — the `test_id`
# slots always exist (so `ui! { view(test_id = …) }` compiles in every
# build), only the per-mount registration overhead is gated.
robot = []

# Phase-timer instrumentation for the new-core mount/style hot paths
# (repeat batch, dynamic-sheet effect). Same discipline as the other
# crates' debug-stats (CLAUDE.md §6): OFF by default, counters land in
# runtime-core's thread-local phase map, zero code when off.
debug-stats = ["runtime-core/debug-stats"]

# Forward runtime-core's `async-driver` gate so glue can mirror the old
# root's feature-gated `driver` module (`spawn_async` / `render_loop`).
# Apps whose aliased sources spell `runtime_core::driver::…` enable this
# (the website's embedded-simulator new-core build is the consumer).
async-driver = ["runtime-core/async-driver"]

[dependencies]
# SANCTIONED, migration-transitional (see lib.rs): the frozen Backend
# signatures reference runtime-core's prop/data types (StyleRules,
# AccessibilityProps, handler aliases, primitives::* payloads). Those
# types migrate OUT of runtime-core at P7; this dependency goes with them.
runtime-core = { workspace = true }
runtime-scene = { workspace = true }
runtime-world = { workspace = true }
