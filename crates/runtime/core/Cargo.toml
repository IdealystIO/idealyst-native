# runtime-core — the framework's author surface.
#
# Every app, SDK, component library and example spells the framework as
# `runtime_core::…`. This crate is that root: a paper-thin re-export of
# `runtime_vocabulary::glue` plus the macro set (which a module
# re-export cannot carry).
#
# It is NOT the runtime. The runtime is `runtime-world` (reactive
# kernel), `runtime-scene` (Element/realize/Host/Registry),
# `runtime-vocabulary` (capability traits + builtin handlers) and
# `runtime-shared` (style engine, assets, animation, scheduling, robot,
# prop/handle types). Backends depend on those directly and never on
# this crate.
#
# Anything missing from the author surface belongs in
# `runtime_vocabulary::glue`, next to the machinery it wraps — not here.
[package]
name = "runtime-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Idealyst author surface: runtime_vocabulary::glue re-export plus the macro set."

[features]
# The robot registry so `test_id` forwarding and `#[method]`
# registrations go live in a consuming crate.
robot = ["runtime-vocabulary/robot"]
# `driver` (spawn_async/render_loop) and the `resource`/`mutation`
# mirrors on the root — what an async-consuming SDK reaches for.
async-driver = ["runtime-vocabulary/async-driver"]
# ONE switch makes a graph catalog-capable: the macro emission gate
# (`runtime-macros/catalog`) plus the vocabulary anchor (`glue::__mcp`,
# which this root's glob re-export carries, so the
# `::runtime_core::__mcp::…` emissions from
# `#[derive(IdealystSchema)]` / `#[idealyst_tool]` / `recipe!` resolve
# here too). Forwards runtime-shared's `catalog` through the
# vocabulary, so the bridge `get_catalog` verb + the static
# core-primitive recipes come along.
catalog = ["runtime-vocabulary/catalog", "runtime-macros/catalog"]
# Back-compat alias — the catalog feature was originally named after
# its first consumer.
mcp = ["catalog"]
# What a dev-session wrapper turns on: the automation registry AND the
# MCP catalog. NOTE: `runtime-vocabulary/robot` does not forward
# `runtime-shared/robot`, so a native dev wrapper that also needs the
# bridge transport declares
# `dev = ["runtime-core/dev", "runtime-shared/robot"]`.
dev = ["robot", "catalog"]
# `runtime_core::premint` — the linkme registry the `stylesheet!`
# expansion registers into under `cfg(idealyst_premint_dump)`. Enabled
# only by the CLI's ephemeral premint-dump wrapper and by the
# `premint-dump` crate's own tests.
style-dump = ["runtime-vocabulary/style-dump"]

[dependencies]
runtime-vocabulary = { workspace = true }
runtime-macros = { workspace = true }
# For the shared-substrate `#[macro_export]` decl macros this root
# re-exports (`typeface!` / `face!` / `node_ref!`): their `$crate::…`
# expansions resolve against runtime-shared, and the types they
# construct (`assets::Typeface`, `Ref<H>`) are the same items glue
# already re-exports.
runtime-shared = { workspace = true }
