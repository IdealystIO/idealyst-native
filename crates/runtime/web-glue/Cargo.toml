# web-glue — the framework-owned wasm ⇄ JS boundary (phase 1 proof of
# concept of docs/proposals/own-web-bindings.md).
#
# Replaces what wasm-bindgen / web-sys / js-sys give the framework today:
# JS object handles, strings, callbacks, promises-as-futures, exceptions —
# with the JS for every binding carried INSIDE the linked wasm (import
# names + one custom section) and turned into `pkg/<lib>.js` by a streaming
# build pass (`wasm_carve::glue` + `build_web::own_glue`) that never walks a
# function body.
#
# Zero dependencies on purpose (the one optional dep is the temporary
# hybrid bridge): it sits under every web crate that will be ported onto
# it, and it must not drag wasm-bindgen back in.

[package]
name = "web-glue"
version = "1.6.0"
edition.workspace = true
license.workspace = true
description = "Framework-owned wasm <-> JS bindings: handles, strings, callbacks, futures, exceptions, with the JS shipped inside the wasm."

[features]
# HYBRID-BRIDGE: `web_glue::bridge`, the crossing between web-glue handles
# and wasm-bindgen values for a page that links both. After phase 3 it
# carries only wgpu's crossings (phase 5's hybrid mode): canvas-native's
# web-sys-typed entry points for canvas-vello, and canvas-vello's
# texture-layer stream into its web-sys `<video>`. See `src/bridge.rs`.
# Own-mode builds never enable it, so their graph stays free of wasm-bindgen.
wasm-bindgen-bridge = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }

# Browser tests (`tests/web_media.rs`) — run with
# `cargo test -p web-glue --target wasm32-unknown-unknown` (the workspace
# runner supplies the glue JS). A dev-dependency only: nothing that depends
# on web-glue links wasm-bindgen through it.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
