# runtime-template — a `ui!` site, as data.
#
# A `Descriptor` is everything about a `ui!` site that is not code: the
# node tree, the tags, the attribute names, the literal values, the child
# order, and a `SlotSig` describing the ordered dynamic expressions the
# site leaves to compiled code. It is produced from SOURCE at build time
# and written beside the build — never compiled into the app, which was
# measured to cost +1.4 s on every one-edit rebuild. See the README.
#
# ONE dependency, `serde`. No scene, no builders, no dev server, no CLI.
# Two very different consumers have to share these types: the CLI-side
# producer/differ, and the proc-macro crate (for `site_key` alone, under
# `ui-overlay`). A proc-macro crate's dependencies are compiled for the
# HOST on every build, so every dep added here is paid by every build of
# every app with the feature on. That is the reason for the narrowness,
# and it is also what keeps a descriptor a portable artifact: it
# serializes and validates with no renderer in the graph.
[package]
name = "runtime-template"
version = "1.5.0"
edition.workspace = true
license.workspace = true
description = "Idealyst ui! template descriptors: the static half of a ui! site, plus slot signatures and patch validation."

[dependencies]
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
