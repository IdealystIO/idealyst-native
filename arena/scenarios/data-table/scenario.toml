  Ada Lovelace       Engineer     92
  Alan Turing        Researcher   99
  Grace Hopper       Engineer     95
  Katherine Johnson  Analyst      97
  Linus Torvalds     Engineer     88
  Margaret Hamilton  Lead         96
  Dennis Ritchie     Researcher   91
  Barbara Liskov     Professor    94

Requirements:
- Display all 8 rows in a table laid out in columns, with a column header
